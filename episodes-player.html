async function checkMembershipExpiry(){

    const userId =
    localStorage.getItem("user_id");


    if(!userId){
        return;
    }


    const {data,error}=await supabase

    .from("profiles")

    .select("expires_at")

    .eq("id",userId)

    .single();



    if(error || !data){
        return;
    }



    if(
        data.expires_at &&
        new Date(data.expires_at) <= new Date()
    ){

        clearInterval(expiryTimer);


        stopSeriesPlayerAndRedirect();

    }

}



// Check silently every 5 minutes

expiryTimer =
setInterval(
checkMembershipExpiry,
300000
);

/* =========================
   PREMIUM ACCESS CONTROL
========================= */

async function checkAccess(seriesType){


    // =========================
    // FREE CONTENT
    // =========================

    if(
        seriesType &&
        seriesType.toLowerCase() === "free"
    ){

        return {
            allowed:true
        };

    }



    // =========================
    // PREMIUM CONTENT
    // =========================


    // CHECK ACTIVE PIN FIRST

    const activePIN =
    localStorage.getItem("activePIN");


    const pinExpiry =
    localStorage.getItem("pinExpiry");



    if(
        activePIN &&
        pinExpiry &&
        Date.now() < Number(pinExpiry)
    ){

        return {
            allowed:true,
            method:"PIN"
        };

    }



    // =========================
    // CHECK LOGIN
    // =========================

    const loggedIn =
    localStorage.getItem("loggedIn");


    if(loggedIn !== "true"){

        return {
            allowed:false,
            reason:"not_logged_in"
        };

    }



    // =========================
    // GET USER PROFILE
    // =========================

    const userID =
    localStorage.getItem("user_id");


    if(!userID){

        return {
            allowed:false,
            reason:"missing_identity"
        };

    }



    const {data:user,error}=

    await supabase

    .from("profiles")

    .select("*")

    .eq("id",userID)

    .single();



    if(error || !user){

        return {
            allowed:false,
            reason:"profile_missing"
        };

    }




    // =========================
    // PREMIUM VALIDATION
    // =========================


    if(
        user.account_status !== "active"
    ){

        return {
            allowed:false,
            reason:"account_inactive"
        };

    }




    if(
        user.membership?.toLowerCase()
        !== "premium"
    ){

        return {
            allowed:false,
            reason:"not_premium"
        };

    }



    if(
        !user.expires_at ||
        new Date(user.expires_at) <= new Date()
    ){

        return {
            allowed:false,
            reason:"expired"
        };

    }




    return {
        allowed:true,
        method:"premium"
    };


}

/* =========================
SUBSCRIPTION ALERT
========================= */


async function showSubscriptionReminder(){


const box =
document.getElementById(
"subscriptionAlert"
);



let expiry =
localStorage.getItem("pinExpires");


// If no PIN expiry, check profile expiry

if(!expiry){

    const userId =
    localStorage.getItem("user_id");


    if(userId){

        const {data:user}=await supabase

        .from("profiles")

        .select("expires_at")

        .eq("id",userId)

        .single();


        if(user?.expires_at){

            expiry =
            new Date(user.expires_at).getTime();

        }

    }

}


if(!expiry) return;



const left =
Number(expiry)-Date.now();



const days =
Math.ceil(left/86400000);



if(days>5)return;



box.style.display="block";

box.className="subscriptionAlert";





if(days>1){


box.style.background="#991b1b";


box.innerHTML=`

🚨 Your subscription expires in 
<b>${days} days</b>

<br><br>

<button class="fullBtn"
onclick="location.href='packages.html'">

Renew Subscription

</button>

`;



}




else if(days===1){


box.style.background=
"linear-gradient(135deg,#dc2626,#7f1d1d)";

"criticalExpiry"
);



box.innerHTML=`

<br><br>

Your subscription EXPIRES TOMORROW

<br><br>

<button class="fullBtn"
onclick="location.href='packages.html'">

RENEW NOW

</button>

`;



}




else{


box.style.background="#ef4444";

box.classList.add(
"criticalExpiry"
);



box.innerHTML=`

⛔ LAST DAY OF ACCESS ⛔

<br><br>

Your subscription expires TODAY

<br><br>

<button class="fullBtn"
onclick="location.href='packages.html'">

Renew Subscription

</button>

`;



}




}

i

);

).textContent =
`Episode ${ep.episode_number}`;

loadComments(ep.id);

}

/* =========================
COMMENTS
========================= */


function timeAgo(date){


const seconds =
Math.floor(
(Date.now()-new Date(date))/1000
);



if(seconds<60)return"Just now";


const minutes=Math.floor(seconds/60);


if(minutes<60)
return minutes+" minutes ago";



const hours=Math.floor(minutes/60);


if(hours<24)
return hours+" hours ago";



const days=Math.floor(hours/24);


return days+" days ago";


}






async function loadComments(epId){


const {data}=await supabase

.from("episode_comments")

.select("*")

.eq("episode_id",epId)

.order(
"created_at",
{
ascending:false
}
);



const comments=data||[];




document.getElementById(
"commentsList"
).innerHTML =


comments
.filter(c=>!c.parent_id)

.map(c=>{


const replies =
comments.filter(
r=>r.parent_id===c.id
);



return `

<div class="commentItem">


<div class="commentUser">

${c.user_name}

</div>


<div class="commentText">

${c.comment}

</div>


<small>
🕒 ${timeAgo(c.created_at)}
</small>


<div class="commentActions">


<button onclick="likeComment(${c.id})">

❤️ ${c.likes||0}

</button>


<button onclick="openReply(${c.id})">

💬 ${replies.length} Replies

</button>


</div>



<div id="replies-${c.id}" style="display:none">


${replies.map(r=>`

<div class="replyItem">

<b>${r.user_name}</b>

<p>${r.comment}</p>

</div>

`).join("")}



<textarea 
id="replyText-${c.id}"
placeholder="Write reply...">
</textarea>


<button onclick="sendReply(${c.id})">

Post Reply

</button>



</div>



</div>


`;

}).join("");



}








window.likeComment=async function(id){


const {data}=await supabase

.from("episode_comments")

.select("likes")

.eq("id",id)

.single();



const likes=(data.likes||0)+1;



await supabase

.from("episode_comments")

.update({

likes

})

.eq("id",id);



loadComments(
episodes[index].id
);


};








window.openReply=function(id){


const box=
document.getElementById(
"replies-"+id
);



if(box)

box.style.display =
box.style.display==="none"
?"block"
:"none";


};









window.sendReply=async function(parent){


const text =
document.getElementById(
"replyText-"+parent
).value.trim();



if(!text)return;



await supabase

.from("episode_comments")

.insert([{


episode_id:
episodes[index].id,


user_name:
currentUserName,


comment:text,


parent_id:parent,


created_at:
new Date().toISOString()


}]);



loadComments(
episodes[index].id
);



};

/* FULLSCREEN */


document.getElementById("fullBtn").onclick = async () => {

    const player = document.getElementById("player");

    if (!document.fullscreenElement) {

        await player.requestFullscreen();

        // Force landscape where supported
        try {
            if (screen.orientation?.lock) await screen.orientation.lock("landscape");
        } catch(e){}

        // Fallback for Android browsers: prompt fullscreen on play

    } else {

        await document.exitFullscreen();

        try {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        } catch (e) {}

    }
};










// Auto-enter fullscreen and request landscape on mobile playback
document.addEventListener("play", async (e)=>{
  const el=e.target;
  if(el.tagName==="VIDEO"){
    const p=document.getElementById("player");
    try{
      if(!document.fullscreenElement) await p.requestFullscreen();
    }catch(e){}
    try{
      if(screen.orientation?.lock) await screen.orientation.lock("landscape");
    }catch(e){}
  }
},true);

/* =========================
START
========================= */


await loadCurrentUser();



if(currentUserName!=="Guest"){

document.getElementById(
"username"
).style.display="none";

}



loadEpisodes();
