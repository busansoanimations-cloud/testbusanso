.card{

border:

padding:30px;

box-shadow:
0 25px 70px rgba(0,0,0,.5);

h1{

}



.message{

/* WATCH BUTTONS */


.action{

color:white;

padding:22px;

margin-bottom:18px;

.action:hover{

}



.movies{

background:

.series{

background:

.expiry{

padding:18px;

border-radius:22px;

background:linear-gradient(135deg,#0f172a,#1e293b);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 10px 30px rgba(0,0,0,.35);

}

.expiry-title{

font-size:14px;

color:#94a3b8;

margin-bottom:10px;

}

#expiry{

display:block;

font-size:26px;

font-weight:900;

letter-spacing:.5px;

}

.expiry-green{

color:#22c55e;

text-shadow:0 0 18px rgba(34,197,94,.45);

}

.expiry-yellow{

color:#facc15;

text-shadow:0 0 18px rgba(250,204,21,.45);

}

.expiry-red{

color:#ef4444;

text-shadow:0 0 18px rgba(239,68,68,.45);

}


.logout{

display:none;

}

/* FREE USER LOCKED BUTTONS */

.locked{
    background:#374151 !important;
    color:#9ca3af !important;
    box-shadow:none !important;
    cursor:not-allowed;
    position:relative;
}


.locked::after{
    content:" 🔒 PREMIUM ONLY";
    display:block;
    font-size:12px;
    margin-top:8px;
    color:#facc15;
}


/* PAY BUTTON */

text-decoration:none;

padding:22px;

border-radius:22px;

margin-bottom:18px;

font-size:20px;

font-weight:900;

color:#111827;

background:
linear-gradient(
135deg,
#facc15,
#f97316
);

box-shadow:
0 0 25px rgba(250,204,21,.6);

animation:pulsePay 1.5s infinite;

}


@keyframes pulsePay{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}
.admin-btn{

display:none;

margin-top:20px;

background:
linear-gradient(135deg,#22c55e,#15803d);

color:white;

padding:18px;

border-radius:20px;

font-size:18px;

font-weight:800;

text-decoration:none;

box-shadow:
0 15px 35px rgba(34,197,94,.35);

async function loadPremiumUser(){


const userID =
localStorage.getItem("user_id");


if(!userID){

location.href="auth.html";
return;

}



const {data,error}=await supabaseClient

.from("profiles")

.select("*")

.eq("id",Number(userID))

.single();


if(error || !data){

location.href="auth.html";
return;

}

if ((data.account_status || "").toLowerCase() !== "active") {

    localStorage.clear();

    location.href = "blocked.html";

    return;

}
// ==============================
// KIBANDA / FREE UI CONTROL
// ==============================

const membership =
(data.membership || "free").toLowerCase();

// UPDATE BADGE
const badge = document.getElementById("memberBadge");

if (membership === "kibanda") {
    badge.textContent = "👑 " + (data.package_type || "KIBANDA");
} else {
    badge.textContent = "🆓 FREE MEMBER";
}

const moviesBtn =
document.getElementById("moviesBtn");

const seriesBtn =
document.getElementById("seriesBtn");

const payBtn =
document.getElementById("payBtn");

membership === "kibanda" &&
data.expires_at &&
new Date(data.expires_at) > new Date()
){

seriesBtn.classList.remove("locked");

seriesBtn.href="kibseries.html";


}else{

seriesBtn.classList.add("locked");


moviesBtn.href="javascript:void(0)";
seriesBtn.href="javascript:void(0)";


moviesBtn.onclick=function(){

};


seriesBtn.onclick=function(){

};


payBtn.style.display="block";


}



// UPDATE LOCAL STORAGE EVERY VISIT

localStorage.setItem(
"name",
data.name || ""
);

localStorage.setItem(
"whatsapp_number",
data.whatsapp_number || ""
);

localStorage.setItem(
"membership",
data.membership || "free"
);

localStorage.setItem(
"package_type",
data.package_type || ""
);

localStorage.setItem(
"expires_at",
data.expires_at || ""
);



// DISPLAY USER DATA

"Hello,<br>" +
(data.name || "Member").toUpperCase();

if (

   startExpiryCountdown(data.expires_at);

} else {

async function checkAdminAccess(){


const userID =
localStorage.getItem("user_id");


if(!userID){
return;
}


const {data,error}=await supabaseClient

.from("profiles")

.select("role")

.eq("id",Number(userID))

.single();



console.log("ADMIN CHECK DATA:", data);
console.log("ADMIN CHECK ERROR:", error);


if(error || !data){
return;
}


// SHOW ADMIN BUTTON ONLY

if(
    data.role &&
    data.role.trim().toLowerCase() === "admin"
){

    document.getElementById("adminBtn")
    .style.display="block";

}


}
function startExpiryCountdown(expiryDate){

    const expiry=document.getElementById("expiry");

    function update(){

        const diff=new Date(expiryDate)-new Date();

        if(diff<=0){

            expiry.className="expiry-red";

            expiry.innerHTML="❌ Membership Expired";

            return;

        }

        const days=Math.floor(diff/86400000);

        const hours=Math.floor((diff%86400000)/3600000);

        const minutes=Math.floor((diff%3600000)/60000);

        if(days>=7){

            expiry.className="expiry-green";

        }else if(days>=1){

            expiry.className="expiry-yellow";

        }else{

            expiry.className="expiry-red";

        }

        let text="";

        if(days>0){

            text+=days+" Day"+(days>1?"s ":" ");

        }

        text+=hours+" Hour"+(hours!=1?"s ":" ");

        text+=minutes+" Minute"+(minutes!=1?"s":"");

        expiry.innerHTML=text+" Remaining";

    }

    update();

    setInterval(update,60000);

}
// START PAGE
loadPremiumUser();
checkAdminAccess();

const realtimeChannel = supabaseClient
.channel("profile-" + localStorage.getItem("user_id"))
.on(
    "postgres_changes",
    {
        event: "*",
        schema: "public",
        table: "profiles",
        filter: `id=eq.${localStorage.getItem("user_id")}`
    },
    (payload) => {

        console.log("Realtime profile update:", payload);

        // Reload all user data and update the UI
        loadPremiumUser();
        checkAdminAccess();

    }
)
.subscribe();
