// ==============================
// MEMBERSHIP / REDIRECT HELPERS
// ==============================

function getLocalMembership(){
    return (localStorage.getItem("membership") || "free").trim().toLowerCase();
}

function getLocalExpiry(){
    return localStorage.getItem("expires_at") || "";
}

function membershipIsExpired(membership, expires){
    if(membership === "free") return false;
    if(!expires) return true;
    const date = new Date(expires);
    return Number.isNaN(date.getTime()) || date <= new Date();
}

function normalizeLocalMembership(){
    let membership = getLocalMembership();
    const expires = getLocalExpiry();

    if(membership !== "free" && membershipIsExpired(membership, expires)){
        localStorage.setItem("membership","free");
        localStorage.setItem("package_type","");
        localStorage.setItem("expires_at","");
        membership = "free";
    }

    return membership;
}

function routeByMembership(){
    const membership = normalizeLocalMembership();

    if(membership === "kibanda"){
        location.replace("kibwatch.html");
        return true;
    }

    if(membership === "premium"){
        location.replace("account.html");
        return true;
    }

    // FREE stays on home.html
    return false;
}

// Refresh membership before an action when possible.
// A network failure NEVER logs the user out and NEVER sends them to auth.html.
// The already-stored local membership/expiry remains the fallback.
async function refreshMembershipForAction(){
    const localBefore = normalizeLocalMembership();

    if(!currentUser){
        return localBefore;
    }

    const logged = localStorage.getItem("loggedIn");
    const name = localStorage.getItem("name");

    if(!logged || !name){
        return normalizeLocalMembership();
    }

    try{
        const {data,error} = await supabase
            .from("profiles")
            .select("membership,package_type,expires_at,name")
            .eq("name",name)
            .single();

        if(!error && data){
            localStorage.setItem("membership", String(data.membership || "free").toLowerCase());
            localStorage.setItem("package_type", data.package_type || "");
            localStorage.setItem("expires_at", data.expires_at || "");

            currentUser = {
                ...currentUser,
                ...data,
                membership: String(data.membership || "free").toLowerCase()
            };
        }
    }catch(error){
        console.warn("Membership refresh failed; using local membership.", error);
    }

    return normalizeLocalMembership();
}

// Page-load routing only.
// FREE stays here. PREMIUM -> account.html. KIBANDA -> kibwatch.html.
function checkPremiumRedirect(){
    return routeByMembership();
}

    currentUser = {

        package_type: localStorage.getItem("package_type") || "",

    };

    showLoggedUser(currentUser);

if (!data) {
    // Profile genuinely doesn't exist anymore.
return null;

// Update localStorage with latest membership from Supabase
localStorage.setItem("membership", data.membership || "free");

// Save latest data


localStorage.setItem(

localStorage.setItem(

    if(!user) return false;

    const membership = String(user.membership || "free").toLowerCase();
    const expires = user.expires_at || "";

    if(membership === "free") return true;

    if(

    // Premium-card click: refresh membership first so a recent upgrade/expiry

    const membership = await refreshMembershipForAction();

    if(membership === "kibanda"){
        location.replace("kibwatch.html");
        return;

function applyFilter(type){


currentFilter=type;



const sections=[

trendingBox,

moviesBox,

seriesBox,

freeMoviesBox,

freeSeriesBox

];


sections.forEach(section=>{

section.innerHTML="";

});




allContent.forEach(item=>{


if(
type!=="all" &&
item.kind!==type
)

return;



const card=createCard(
item,
item.kind
);



if(item.kind==="movie"){


moviesBox.appendChild(
card.cloneNode(true)
);



}



if(item.kind==="series"){


seriesBox.appendChild(
card.cloneNode(true)
);


}



});




// rebuild trending

allContent

.filter(item=>

type==="all" ||

item.kind===type

)

.sort(

(a,b)=>

(b.views||0)-(a.views||0)

)

.slice(0,10)

.forEach(item=>{


trendingBox.appendChild(

createCard(
item,
item.kind
)

);


});




}

    if(!redirected){
        await verifyUser();

        // verifyUser may have refreshed membership from Supabase.
        // Re-check after the refresh so an upgraded/expired account is routed.
        const redirectedAfterVerify = checkPremiumRedirect();

        if(!redirectedAfterVerify){
            fetchContent();
        }
    }

})();

};




// ==============================
// HERO AUTO SLIDER (NO PAGE SCROLL)
// ==============================

let currentHero = 0;


setInterval(()=>{


const heroes =
document.querySelectorAll(".hero-poster");


const dots =
document.querySelectorAll(".hero-dot");


if(!heroes.length) return;



currentHero++;


if(currentHero >= heroes.length){
currentHero = 0;
}



// ONLY MOVE HERO CONTAINER
heroSlider.scrollTo({

left:
heroSlider.clientWidth * currentHero,

behavior:"smooth"

});



dots.forEach(dot=>{
dot.classList.remove("active");
});


if(dots[currentHero]){
dots[currentHero].classList.add("active");
}



},6000);









// ==============================
// HERO DOT CLICK
// ==============================


heroDots.onclick=(e)=>{


if(
!e.target.classList.contains(
"hero-dot"
)

)

return;





const dots =
[
...document.querySelectorAll(".hero-dot")
];



currentHero =
dots.indexOf(
e.target
);



document
.querySelectorAll(".hero-poster")
[currentHero]

.scrollIntoView({

behavior:"smooth",

inline:"center",

block:"nearest"

});




dots.forEach(dot=>{

dot.classList.remove(
"active"
);

});



e.target.classList.add(
"active"
);



};
