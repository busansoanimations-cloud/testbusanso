// ==============================
// MEMBERSHIP / REDIRECT HELPERS
// ==============================

function getLocalMembership(){
    return (localStorage.getItem("membership") || "free").trim().toLowerCase();
}

function getLocalExpiry(){
    return localStorage.getItem("expires_at") || "";
}

function membershipIsExpired(membership, expires){
    if(membership === "free") return false;
    if(!expires) return true;
    const date = new Date(expires);
    return Number.isNaN(date.getTime()) || date <= new Date();
}

function normalizeLocalMembership(){
    let membership = getLocalMembership();
    const expires = getLocalExpiry();

    if(membership !== "free" && membershipIsExpired(membership, expires)){
        localStorage.setItem("membership","free");
        localStorage.setItem("package_type","");
        localStorage.setItem("expires_at","");
        membership = "free";
    }

    return membership;
}

function routeByMembership(){
    const membership = normalizeLocalMembership();

    if(membership === "kibanda"){
        location.replace("kibwatch.html");
        return true;
    }

    if(membership === "premium"){
        location.replace("account.html");
        return true;
    }

    // FREE stays on home.html
    return false;
}

// Refresh membership before an action when possible.
// A network failure NEVER logs the user out and NEVER sends them to auth.html.
// The already-stored local membership/expiry remains the fallback.
async function refreshMembershipForAction(){
    const localBefore = normalizeLocalMembership();

    if(!currentUser){
        return localBefore;
    }

    const logged = localStorage.getItem("loggedIn");
    const name = localStorage.getItem("name");

    if(!logged || !name){
        return normalizeLocalMembership();
    }

    try{
        let data = null;
        let error = null;

        const authId = localStorage.getItem("auth_user_id") || "";

        if(authId){
            const result = await supabase
                .from("profiles")
                .select("membership,package_type,expires_at,name,auth_user_id")
                .eq("auth_user_id",authId)
                .maybeSingle();
            data = result.data;
            error = result.error;
        }

        // Keep old accounts working if they have no auth_user_id yet.
        if(!data && name){
            const result = await supabase
                .from("profiles")
                .select("membership,package_type,expires_at,name,auth_user_id")
                .eq("name",name)
                .maybeSingle();
            data = result.data;
            error = result.error;
        }

        if(!error && data){
            localStorage.setItem("membership", String(data.membership || "free").toLowerCase());
            localStorage.setItem("package_type", data.package_type || "");
            localStorage.setItem("expires_at", data.expires_at || "");

            currentUser = {
                ...currentUser,
                ...data,
                membership: String(data.membership || "free").toLowerCase()
            };
        }
    }catch(error){
        console.warn("Membership refresh failed; using local membership.", error);
    }

    return normalizeLocalMembership();
}

    let session = null;

        const { data, error } = await supabase.auth.getSession();

        session = data?.session || null;
    }catch(error){
        console.warn("Unable to read Supabase session:", error);

    const authUser = session?.user || null;
    const authId = authUser?.id || localStorage.getItem("auth_user_id") || "";
    const authEmail = authUser?.email || localStorage.getItem("email") || "";
    const metadata = authUser?.user_metadata || {};
    const metadataName =
        metadata.full_name ||
        metadata.name ||
        metadata.display_name ||
        (authEmail ? authEmail.split("@")[0] : "");

    // Existing users still have the old localStorage identity.
    const localName = localStorage.getItem("name") || "";

    // If Google/Supabase is signed in, persist enough identity locally so the

    if(authUser){
        localStorage.setItem("loggedIn","true");
        localStorage.setItem("auth_user_id",authUser.id);
        if(authEmail) localStorage.setItem("email",authEmail);
        if(!localName && metadataName){
            localStorage.setItem("name",metadataName);
        }
    }

    const name = localStorage.getItem("name") || metadataName;

    // 1. Preferred path: match a Google Auth user to profiles.auth_user_id.
    if(authId){
        try{
            const {data,error}=await supabase
                .from("profiles")
                .select("*")
                .eq("auth_user_id",authId)
                .maybeSingle();

            if(!error && data){
                localStorage.setItem("name", data.name || name || metadataName || "User");
                localStorage.setItem("loggedIn","true");
                localStorage.setItem("auth_user_id",authId);
                localStorage.setItem("membership",String(data.membership || "free").toLowerCase());

                currentUser={...data, auth_user_id:authId, email:authEmail};
                showLoggedUser(currentUser);
                return currentUser;
            }
        }catch(error){
            console.warn("auth_user_id profile lookup failed:",error);
        }
    }

    // 2. Legacy path: existing localStorage users are still supported.
    if(name){
        try{
            const {data,error}=await supabase
                .from("profiles")
                .select("*")
                .eq("name",name)

                currentUser={...data, auth_user_id:authId || data.auth_user_id || "", email:authEmail};
                showLoggedUser(currentUser);

    if(event === "SIGNED_OUT"){
        currentUser=null;
        localStorage.removeItem("loggedIn");
        localStorage.removeItem("auth_user_id");
        localStorage.removeItem("email");
        showGuest();
    }
});

// ==============================
// PREMIUM CHECK
// ==============================


function hasAccess(user){
    if(!user) return false;

    const membership = String(user.membership || "free").toLowerCase();
    const expires = user.expires_at || "";

    if(membership === "free") return true;

    if(
        (membership === "premium" || membership === "kibanda") &&
        expires &&
        !membershipIsExpired(membership, expires)
    ){
        return true;
    }

    return false;
}

// ==============================
// CONTENT ACCESS CONTROL
// ==============================


async function openContent(item,page){

    // FREE cards are open to ANY visitor/user.
    // Do not force free-card clicks through auth or membership redirects.
    const premium =
        item.type==="premium" ||
        item.type===true;

    if(!premium){
        location.href =
            page==="movie"
            ? `movie.html?id=${item.id}`
            : `serie.html?id=${item.id}`;
        return;
    }

    // Premium-card click: refresh membership first so a recent upgrade/expiry
    // is recognized before deciding what to do.
    const membership = await refreshMembershipForAction();

    // KIBANDA users are routed to their own area.
    if(membership === "kibanda"){
        location.replace("kibwatch.html");
        return;
    }

    // PREMIUM user clicking premium content goes to ACCOUNT.
    if(membership === "premium"){
        location.replace("account.html");
        return;
    }

    // Expired premium/kibanda is normalized to FREE above.
    // FREE users need a package to access premium content.
    location.href="packages.html";
}
