<html lang="en">
<head>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 50% -10%,
        #5d4a19 0%,
        #241d0d 22%,
        #0d0d0d 55%,
        #050505 100%
    );

    color:#fff;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


/* =========================================================
   GOLD VARIABLES
========================================================= */

:root{

    --gold:#d4af37;
    --gold-light:#f4d77b;
    --gold-dark:#8d6b16;

    --black:#070707;

    --panel:
    rgba(255,255,255,.045);

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:sticky;

    top:0;

    z-index:20;

    height:64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    0 18px;

    background:
    rgba(5,5,5,.92);

    backdrop-filter:
    blur(15px);

    border-bottom:
    1px solid rgba(212,175,55,.22);

}


.brand{

    display:flex;

    align-items:center;

    gap:10px;

    color:
    var(--gold-light);

    font-size:16px;

    font-weight:900;

    letter-spacing:
    1.5px;

}


.brand-mark{

    width:36px;

    height:36px;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        145deg,
        #f4d77b,
        #b58b22,
        #6d4f0d
    );

    color:#090909;

    font-size:16px;

    font-weight:900;

    box-shadow:
    0 0 20px
    rgba(212,175,55,.22);

}


.home-button{

    color:#aaa;

    text-decoration:none;

    font-size:13px;

    font-weight:700;

}

.home-button:hover{

    color:
    var(--gold-light);

}


/* =========================================================
   MAIN
========================================================= */

.page{

    width:100%;

    max-width:720px;

    margin:0 auto;

    padding:
    30px 16px 70px;

}


/* =========================================================
   GOLD HERO
========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    text-align:center;

    padding:
    38px 22px 32px;

    border:
    1px solid
    rgba(212,175,55,.28);

    border-radius:26px;

    background:

    linear-gradient(
        145deg,
        rgba(212,175,55,.13),
        rgba(255,255,255,.035) 45%,
        rgba(0,0,0,.35)
    );

    box-shadow:

    0 25px 70px
    rgba(0,0,0,.55),

    inset 0 1px 0
    rgba(255,255,255,.08);

}


.hero::before{

    content:"";

    position:absolute;

    width:240px;

    height:240px;

    top:-130px;

    left:50%;

    transform:
    translateX(-50%);

    border-radius:50%;

    background:
    rgba(212,175,55,.12);

    filter:
    blur(35px);

}


.logo{

    position:relative;

    width:105px;

    height:105px;

    object-fit:contain;

    display:block;

    margin:
    0 auto 20px;

    border-radius:24px;

    box-shadow:
    0 12px 40px
    rgba(0,0,0,.5);

}


/*
    LOGO IMAGE

    This is the current BUSANSO logo image.
    Replace the URL below later if you want another
    official logo image.
*/

.hero-title{

    position:relative;

    margin:0;

    font-size:27px;

    font-weight:900;

    letter-spacing:
    1.5px;

    background:

    linear-gradient(
        90deg,
        #b88718,
        #f7df86,
        #c79b2e
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


.hero-subtitle{

    position:relative;

    margin:
    9px 0 0;

    color:#aaa;

    font-size:13px;

}


/* =========================================================
   USER CARD
========================================================= */

.user-card{

    margin-top:20px;

    padding:22px;

    border-radius:20px;

    background:
    var(--panel);

    border:
    1px solid
    rgba(255,255,255,.08);

}


.user-label{

    color:#777;

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:1.3px;

    margin-bottom:7px;

}


.user-name{

    color:#fff;

    font-size:20px;

    font-weight:800;

    word-break:break-word;

}


.user-email{

    margin-top:6px;

    color:#999;

    font-size:13px;

    word-break:break-word;

}


/* =========================================================
   MEMBERSHIP
========================================================= */

.membership-card{

    position:relative;

    overflow:hidden;

    margin-top:18px;

    padding:26px 22px;

    border-radius:22px;

    background:

    linear-gradient(
        145deg,
        rgba(212,175,55,.18),
        rgba(212,175,55,.05),
        rgba(255,255,255,.025)
    );

    border:
    1px solid
    rgba(212,175,55,.38);

    box-shadow:
    0 18px 50px
    rgba(0,0,0,.35);

}


.membership-card::after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    right:-90px;

    top:-90px;

    border-radius:50%;

    background:
    rgba(244,215,123,.09);

}


.membership-heading{

    position:relative;

    color:#999;

    font-size:10px;

    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;

}


.package{

    position:relative;

    margin-top:7px;

    color:
    var(--gold-light);

    font-size:30px;

    font-weight:900;

    letter-spacing:.5px;

}


.package-description{

    position:relative;

    margin-top:7px;

    color:#aaa;

    font-size:13px;

}


/* =========================================================
   DETAILS
========================================================= */

.details{

    margin-top:18px;

    display:grid;

    grid-template-columns:
    repeat(2, minmax(0,1fr));

    gap:12px;

}


.detail{

    padding:18px;

    border-radius:17px;

    background:
    rgba(255,255,255,.035);

    border:
    1px solid
    rgba(255,255,255,.07);

}


.detail-label{

    color:#777;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:8px;

}


.detail-value{

    color:#eee;

    font-size:14px;

    font-weight:700;

    word-break:break-word;

}


.detail-value.gold{

    color:
    var(--gold-light);

}


/* =========================================================
   STATUS
========================================================= */

.status-box{

    margin-top:18px;

    padding:15px 17px;

    border-radius:14px;

    background:
    rgba(212,175,55,.06);

    border:
    1px solid
    rgba(212,175,55,.16);

    color:#aaa;

    font-size:12px;

    line-height:1.5;

}


.status-box strong{

    color:
    var(--gold-light);

}


/* =========================================================
   ACTIONS
========================================================= */

.actions{

    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:11px;

}


.action{

    width:100%;

    min-height:52px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    text-decoration:none;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:
    transform .15s ease,
    opacity .15s ease;

}


.action:hover{

    transform:
    translateY(-1px);

}


.primary{

    color:#090909;

    background:

    linear-gradient(
        135deg,
        #f4d77b,
        #d4af37,
        #a77d17
    );

    box-shadow:
    0 8px 25px
    rgba(212,175,55,.18);

}


.secondary{

    color:#ddd;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid
    rgba(255,255,255,.09);

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    text-align:center;

    padding:
    70px 20px;

    color:#999;

}


.spinner{

    width:34px;

    height:34px;

    margin:
    0 auto 18px;

    border-radius:50%;

    border:
    3px solid
    rgba(255,255,255,.12);

    border-top-color:
    var(--gold);

    animation:
    spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    margin-top:30px;

    padding:22px;

    text-align:center;

    border-radius:18px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid
    rgba(255,255,255,.08);

}


.error-box h2{

    margin:0 0 10px;

    color:#eee;

    font-size:19px;

}


.error-box p{

    margin:0;

    color:#999;

    font-size:13px;

    line-height:1.6;

}


.retry{

    margin-top:18px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

    .page{

        padding:
        20px 12px 60px;

    }

    .hero{

        padding:
        32px 17px 27px;

    }

    .hero-title{

        font-size:23px;

    }

    .details{

        grid-template-columns:
        1fr;

    }

}

</style>

</head>

<script>

/*
==============================================================
BUSANSO ACCOUNT
==============================================================

THIS PAGE SUPPORTS TWO TYPES OF USERS.

1. NEW GOOGLE USERS

   Supabase Auth session
          ↓
   auth.uid()
          ↓
   profiles.auth_user_id


2. LEGACY BUSANSO USERS

   localStorage.user_id
          ↓
   profiles.id


IMPORTANT:

A Google user does NOT need:

    device_id
    loggedIn
    isLoggedIn

We do not sign anyone out simply because a legacy value
doesn't exist.

==============================================================
*/


(function(){

"use strict";


/* =========================================================
   SUPABASE
========================================================= */


const SUPABASE_URL =
"https://dhkfhhybzcxdeoalcfqx.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



/* =========================================================
   ELEMENTS
========================================================= */


const loading =
document.getElementById("loading");


const account =
document.getElementById("account");


const errorBox =
document.getElementById("error");


const errorMessage =
document.getElementById("errorMessage");


const userName =
document.getElementById("userName");


const userEmail =
document.getElementById("userEmail");


const packageBox =
document.getElementById("package");


const packageDescription =
document.getElementById(
    "packageDescription"
);


const statusValue =
document.getElementById(
    "statusValue"
);


const expiryValue =
document.getElementById(
    "expiryValue"
);


const accountId =
document.getElementById(
    "accountId"
);


const signinValue =
document.getElementById(
    "signinValue"
);


const statusBox =
document.getElementById(
    "statusBox"
);



/* =========================================================
   HELPERS
========================================================= */


function clean(value){

    return String(
        value == null
        ? ""
        : value
    )
    .trim();

}



function normalize(value){

    return clean(value)
    .toLowerCase();

}



function formatDate(value){

    if(!value){

        return "No expiry set";

    }


    const date =
    new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return clean(value);

    }


    return date.toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}



function isExpired(profile){

    if(
        !profile ||
        !profile.expires_at
    ){

        return false;

    }


    const expiry =
    new Date(
        profile.expires_at
    );


    if(
        isNaN(
            expiry.getTime()
        )
    ){

        return false;

    }


    return (
        expiry.getTime()
        <= Date.now()
    );

}



/* =========================================================
   ACCESS TYPE
========================================================= */


function getAccess(profile){

    if(!profile){

        return "free";

    }


    const membership =
    normalize(
        profile.membership
    );


    const packageType =
    normalize(
        profile.package_type
    );


    const paid =
    profile.paid_status === true ||
    normalize(
        profile.paid_status
    ) === "true";


    /*
    KIBANDA
    */

    if(
        membership === "kibanda" ||
        packageType === "kibanda"
    ){

        return "kibanda";

    }


    /*
    PREMIUM
    */

    if(
        membership === "premium" ||
        packageType === "premium" ||
        paid
    ){

        return "premium";

    }


    /*
    FREE
    */

    return "free";

}



/* =========================================================
   FIND GOOGLE PROFILE
========================================================= */


async function findGoogleProfile(
    user
){

    if(
        !user ||
        !user.id
    ){

        return null;

    }


    console.log(
        "BUSANSO: Looking for Google profile:",
        user.id
    );


    const result =
    await supabase

    .from("profiles")

    .select("*")

    .eq(
        "auth_user_id",
        user.id
    )

    .maybeSingle();


    if(result.error){

        console.error(
            "Google profile lookup failed:",
            result.error
        );

        /*
        IMPORTANT:

        Do NOT sign out the user.
        */

        throw result.error;

    }


    return result.data || null;

}



/* =========================================================
   FIND LEGACY PROFILE
========================================================= */


async function findLegacyProfile(){

    const storedId =
    localStorage.getItem(
        "user_id"
    );


    if(!storedId){

        return null;

    }


    console.log(
        "BUSANSO: Looking for legacy profile:",
        storedId
    );


    const numericId =
    Number(storedId);


    if(
        !Number.isFinite(
            numericId
        )
    ){

        return null;

    }


    const result =
    await supabase

    .from("profiles")

    .select("*")

    .eq(
        "id",
        numericId
    )

    .maybeSingle();


    if(result.error){

        console.error(
            "Legacy profile lookup failed:",
            result.error
        );

        throw result.error;

    }


    return result.data || null;

}



/* =========================================================
   SAVE COMPATIBILITY DATA
========================================================= */


function saveCompatibility(
    profile,
    user
){

    try{


        if(user && user.id){

            localStorage.setItem(
                "auth_user_id",
                user.id
            );

            localStorage.setItem(
                "supabase_auth_user_id",
                user.id
            );

        }


        if(profile){

            if(
                profile.id != null
            ){

                localStorage.setItem(
                    "user_id",
                    String(profile.id)
                );

            }


            if(profile.name){

                localStorage.setItem(
                    "name",
                    profile.name
                );

            }


            localStorage.setItem(
                "membership",
                profile.membership || ""
            );


            localStorage.setItem(
                "package_type",
                profile.package_type || ""
            );


            localStorage.setItem(
                "paid_status",
                String(
                    profile.paid_status === true
                )
            );


            localStorage.setItem(
                "expires_at",
                profile.expires_at || ""
            );


            if(
                profile.activated_at
            ){

                localStorage.setItem(
                    "activated_at",
                    profile.activated_at
                );

            }

        }


    }catch(error){

        console.warn(
            "BUSANSO localStorage warning:",
            error
        );

    }

}



/* =========================================================
   DISPLAY ACCOUNT
========================================================= */


function displayAccount(
    profile,
    user,
    signInType
){

    const access =
    getAccess(profile);


    const expired =
    isExpired(profile);


    let displayAccess =
    access;


    /*
    Expired premium/kibanda
    */

    if(
        expired &&
        (
            access === "premium" ||
            access === "kibanda"
        )
    ){

        displayAccess =
        "expired";

    }


    /*
    NAME
    */

    const metadata =
    user &&
    user.user_metadata
    ?
    user.user_metadata
    :
    {};


    const fallbackName =
    metadata.full_name ||
    metadata.name ||
    (
        user &&
        user.email
        ?
        user.email.split("@")[0]
        :
        "BUSANSO User"
    );


    userName.textContent =
    profile.name ||
    fallbackName;


    /*
    EMAIL
    */

    userEmail.textContent =
    user &&
    user.email
    ?
    user.email
    :
    "Legacy BUSANSO account";


    /*
    PACKAGE
    */

    if(displayAccess === "premium"){

        packageBox.textContent =
        "PREMIUM";

        packageDescription.textContent =
        "Premium BUSANSO membership";

    }
    else if(displayAccess === "kibanda"){

        packageBox.textContent =
        "KIBANDA";

        packageDescription.textContent =
        "Kibanda membership access";

    }
    else if(displayAccess === "expired"){

        packageBox.textContent =
        "EXPIRED";

        packageDescription.textContent =
        "Your previous paid membership has expired.";

    }
    else{

        packageBox.textContent =
        "FREE";

        packageDescription.textContent =
        "Free BUSANSO membership";

    }


    /*
    STATUS
    */

    if(displayAccess === "premium"){

        statusValue.textContent =
        "ACTIVE";

    }
    else if(displayAccess === "kibanda"){

        statusValue.textContent =
        "ACTIVE";

    }
    else if(displayAccess === "expired"){

        statusValue.textContent =
        "EXPIRED";

    }
    else{

        statusValue.textContent =
        "FREE";

    }


    /*
    EXPIRY
    */

    expiryValue.textContent =
    formatDate(
        profile.expires_at
    );


    /*
    ACCOUNT ID
    */

    accountId.textContent =
    profile.id != null
    ?
    String(profile.id)
    :
    "—";


    /*
    SIGN-IN
    */

    if(
        signInType === "google"
    ){

        signinValue.textContent =
        "Google";

    }
    else{

        signinValue.textContent =
        "Legacy";

    }


    /*
    STATUS MESSAGE
    */

    if(displayAccess === "premium"){

        statusBox.innerHTML =
        "<strong>Premium active.</strong> " +
        "Your account has premium access.";

    }
    else if(displayAccess === "kibanda"){

        statusBox.innerHTML =
        "<strong>Kibanda active.</strong> " +
        "Your account has Kibanda access.";

    }
    else if(displayAccess === "expired"){

        statusBox.innerHTML =
        "<strong>Membership expired.</strong> " +
        "Your profile is still preserved. " +
        "You can renew your access.";

    }
    else{

        statusBox.innerHTML =
        "<strong>Free account.</strong> " +
        "Your BUSANSO profile is active.";

    }


    /*
    SHOW PAGE
    */

    loading.style.display =
    "none";

    errorBox.style.display =
    "none";

    account.style.display =
    "block";

}



/* =========================================================
   LOAD ACCOUNT
========================================================= */


async function loadAccount(){

    try{

        console.log(
            "BUSANSO ACCOUNT: Starting..."
        );


        /*
        ======================================================
        FIRST: CHECK GOOGLE / SUPABASE SESSION
        ======================================================
        */

        const sessionResult =
        await supabase.auth.getSession();


        if(sessionResult.error){

            throw sessionResult.error;

        }


        const session =
        sessionResult.data.session;


        if(
            session &&
            session.user
        ){

            console.log(
                "BUSANSO ACCOUNT: Google/Supabase user found:",
                session.user.id
            );


            const profile =
            await findGoogleProfile(
                session.user
            );


            if(profile){

                saveCompatibility(
                    profile,
                    session.user
                );


                displayAccount(
                    profile,
                    session.user,
                    "google"
                );


                return;

            }


            /*
            The Google session exists but the profile
            cannot currently be found.

            DO NOT silently convert this person into a
            legacy/guest user.
            */

            throw new Error(
                "Google account is authenticated, but its BUSANSO profile could not be found."
            );

        }



        /*
        ======================================================
        SECOND: LEGACY USER
        ======================================================
        */

        console.log(
            "BUSANSO ACCOUNT: No Google session. Checking legacy identity..."
        );


        const legacyProfile =
        await findLegacyProfile();


        if(legacyProfile){

            saveCompatibility(
                legacyProfile,
                null
            );


            displayAccount(
                legacyProfile,
                null,
                "legacy"
            );


            return;

        }



        /*
        ======================================================
        NO USER
        ======================================================
        */

        throw new Error(
            "No active BUSANSO account was found on this device."
        );


    }
    catch(error){

        console.error(
            "BUSANSO ACCOUNT ERROR:",
            error
        );


        loading.style.display =
        "none";

        account.style.display =
        "none";

        errorBox.style.display =
        "block";


        errorMessage.textContent =
        error.message ||
        "Unable to load your account.";

    }

}



/* =========================================================
   AUTH STATE LISTENER
========================================================= */


supabase.auth.onAuthStateChange(
    function(
        event,
        session
    ){

        console.log(
            "BUSANSO ACCOUNT AUTH EVENT:",
            event
        );


        /*
        If a Google session appears while this page
        is open, reload the account data.

        We never sign the user out here.
        */

        if(
            session &&
            session.user
        ){

            loadAccount();

        }

    }
);



/* =========================================================
   START
========================================================= */

loadAccount();


})();

</script>
