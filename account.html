/* ==================================================
   LOAD USER

   THIS IS THE ACCOUNT (2) LOGIC
================================================== */

async function loadPremiumUser(){

    const userID =
    localStorage.getItem("user_id");


    /*
    NO USER ID
    */

    if(!userID){

        location.href =
        "auth.html";

        return;

    }


    /*
    LOAD PROFILE
    */

    const {
        data,
        error
    } =
    await supabaseClient

    .from("profiles")

    .select("*")

    .eq(
        "id",
        Number(userID)
    )

    .single();


    /*
    PROFILE NOT FOUND
    */

    if(error || !data){

        location.href =
        "auth.html";

        return;

    }


    /*
    ACCOUNT STATUS
    */

    if(
        (data.account_status || "")
        .toLowerCase()
        !==
        "active"
    ){

        localStorage.clear();

        location.href =
        "blocked.html";

        return;

    }


    /*
    MEMBERSHIP
    */

    const membership =
    (
        data.membership ||
        "free"
    ).toLowerCase();


    /*
    PACKAGE BADGE
    */

    if(
        membership === "premium"
    ){

        memberBadge.textContent =
        "👑 " +
        (
            data.package_type ||
            "PREMIUM"
        );

    }
    else{

        memberBadge.textContent =
        "🆓 FREE MEMBER";

    }


    /*
    PREMIUM + VALID EXPIRY
    */

    const premiumActive =
    membership === "premium"
    &&
    data.expires_at
    &&
    new Date(data.expires_at)
    >
    new Date();


    /* ==================================================
       PREMIUM USER
    ================================================== */

    if(premiumActive){

        /*
        ENABLE WATCH MOVIES
        */

        moviesBtn.classList.remove(
            "locked"
        );

        moviesBtn.href =
        "movies.html";

        moviesBtn.onclick =
        null;


        /*
        ENABLE WATCH SERIES
        */

        seriesBtn.classList.remove(
            "locked"
        );

        seriesBtn.href =
        "series.html";

        seriesBtn.onclick =
        null;


        /*
        HIDE PAY BUTTON
        */

        payBtn.style.display =
        "flex";


        payBtn.style.display =
        "none";


        /*
        SHOW EXPIRY
        */

        expiryBox.style.display =
        "block";

        startExpiryCountdown(
            data.expires_at
        );

    }


    /* ==================================================
       FREE / EXPIRED USER
    ================================================== */

    else{

        /*
        GREY MOVIES BUTTON
        */

        moviesBtn.classList.add(
            "locked"
        );

        moviesBtn.href =
        "javascript:void(0)";


        moviesBtn.onclick =
        function(e){

            e.preventDefault();

            location.href =
            "packages.html";

        };


        /*
        GREY SERIES BUTTON
        */

        seriesBtn.classList.add(
            "locked"
        );

        seriesBtn.href =
        "javascript:void(0)";


        seriesBtn.onclick =
        function(e){

            e.preventDefault();

            location.href =
            "packages.html";

        };


        /*
        SHOW PAY BUTTON
        */

        payBtn.style.display =
        "flex";


        /*
        HIDE EXPIRY
        */

        expiryBox.style.display =
        "none";

    }


    /* ==================================================
       LOCAL STORAGE UPDATE
    ================================================== */

    localStorage.setItem(
        "name",
        data.name || ""
    );


    localStorage.setItem(
        "whatsapp_number",
        data.whatsapp_number || ""
    );


    localStorage.setItem(
        "membership",
        data.membership || "free"
    );


    localStorage.setItem(
        "package_type",
        data.package_type || ""
    );


    localStorage.setItem(
        "expires_at",
        data.expires_at || ""
    );


    /*
    MAKE SURE LOGIN STATE EXISTS
    */

    localStorage.setItem(
        "loggedIn",
        "true"
    );


    /*
    KEEP USER ID
    */

    localStorage.setItem(
        "user_id",
        data.id
    );


    /*
    LOAD SERIES AFTER USER STATUS
    */

    await loadSeries();

}

/* ==================================================
   EXPIRY COUNTDOWN

   COPIED FROM ACCOUNT (2)
================================================== */

function startExpiryCountdown(
    expiryDate
){

    function update(){

        const diff =
        new Date(expiryDate)
        -
        new Date();


        if(diff <= 0){

            expiryElement.className =
            "expiry-red";

            expiryElement.innerHTML =
            "❌ Membership Expired";

            return;

        }


        const days =
        Math.floor(
            diff / 86400000
        );


        const hours =
        Math.floor(
            (
                diff %
                86400000
            )
            /
            3600000
        );


        const minutes =
        Math.floor(
            (
                diff %
                3600000
            )
            /
            60000
        );


        /*
        COLOR
        */

        if(days >= 7){

            expiryElement.className =
            "expiry-green";

        }

        else if(days >= 1){

            expiryElement.className =
            "expiry-yellow";

        }

        else{

            expiryElement.className =
            "expiry-red";

        }


        let text = "";


        if(days > 0){

            text +=
            days +
            " Day" +
            (
                days > 1
                ? "s "
                : " "
            );

        }


        text +=
        hours +
        " Hour" +
        (
            hours !== 1
            ? "s "
            : " "
        );


        text +=
        minutes +
        " Minute" +
        (
            minutes !== 1
            ? "s"
            : ""
        );


        expiryElement.innerHTML =
        text +
        " Remaining";

    }


    update();


    setInterval(
        update,
        60000
    );

}


/* ==================================================
   CACHE IMAGE
================================================== */

async function cacheImage(url){

    if(
        "caches"
        in window
    ){

        try{

            const cache =
            await caches.open(
                "series-images"
            );


            const res =
            await fetch(
                url,
                {
                    mode:"no-cors"
                }
            );


            await cache.put(
                url,
                res
            );

        }
        catch(error){

            console.log(
                "Image cache skipped:",
                error
            );

        }

    }

}


/* ==================================================
   RENDER SERIES
================================================== */

function render(data){

    box.innerHTML = "";


    data.forEach(

            document.createElement(
                "div"
            );


            c.className =
            "card";


            c.style.animationDelay =
            i * .05 +
            "s";


            c.innerHTML = `

                <div class="poster-wrap">

                    <img
                        src="${s.poster}"
                        loading="lazy"
                        class="poster-click"
                        alt="${s.title || ""}"
                    >

                    <div
                        class="status-badge ${
                            (
                                s.status ||
                                "completed"
                            ).toLowerCase()
                        }"
                    >

                        ${
                            s.status ||
                            "COMPLETED"
                        }

                    </div>

                </div>


                <div class="info">

                    <div class="title">

                        ${
                            s.title ||
                            ""
                        }

                    </div>


                    <div class="meta">

                        ${
                            s.country ||
                            ""
                        }

                        •

                        ${
                            s.genre ||
                            ""
                        }

                        •

                        ${
                            s.year ||
                            ""
                        }

                    </div>

                </div>

            `;


            /*
            CARD CLICK
            */

            c.querySelector(
                ".poster-click"
            ).onclick =
            () => {

                location.href =
                `serie.html?id=${s.id}`;

            };


            box.appendChild(c);


            if(s.poster){

                cacheImage(
                    s.poster
                );

            }

        }
    );

}


/* ==================================================
   POPULATE FILTERS
================================================== */

function populateFilters(data){

    /*
    CLEAR OLD OPTIONS
    */

    countryFilter.innerHTML =
    `<option value="">
        All Countries
    </option>`;


    genreFilter.innerHTML =
    `<option value="">
        All Genres
    </option>`;


    const countries =
    [
        ...new Set(
            data
            .map(
                s => s.country
            )
            .filter(Boolean)
        )
    ];


    const genres =
    [
        ...new Set(
            data
            .map(
                s => s.genre
            )
            .filter(Boolean)
        )
    ];


    countries.forEach(
        country => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            country;


            option.textContent =
            country;


            countryFilter.appendChild(
                option
            );

        }
    );


    genres.forEach(
        genre => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            genre;


            option.textContent =
            genre;


            genreFilter.appendChild(
                option
            );

        }
    );

}


/* ==================================================
   FILTER
================================================== */

function applyFilters(){

    let filtered =
    SERIES;


    const q =
    search.value
    .toLowerCase()
    .trim();


    const selectedCountry =
    countryFilter.value;


    const selectedGenre =
    genreFilter.value;


    if(selectedGenre){

        filtered =
        filtered.filter(
            s =>
            s.genre &&
            s.genre
            .toUpperCase()
            ===
            selectedGenre
            .toUpperCase()
        );

    }


    if(selectedCountry){

        filtered =
        filtered.filter(
            s =>
            s.country &&
            s.country
            ===
            selectedCountry
        );

    }


    if(q){

        filtered =
        filtered.filter(
            s =>
            (
                s.title ||
                ""
            )
            .toLowerCase()
            .includes(q)
        );

    }


    render(
        filtered
    );

}


search.oninput =
applyFilters;


countryFilter.onchange =
applyFilters;


genreFilter.onchange =
applyFilters;


/* ==================================================
   FETCH SERIES

   ORIGINAL SERIES LOGIC
================================================== */

async function loadSeries(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("series")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            console.error(
                "Supabase series error:",
                error
            );

            box.innerHTML = `

                <div style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:40px;
                    color:#f87171;
                    font-weight:bold;
                ">

                    Failed to load series.

                </div>

            `;

            return;

        }


        SERIES =
        data || [];


        populateFilters(
            SERIES
        );


        render(
            SERIES
        );


        console.log(
            "Series fetched:",
            SERIES
        );

    }

    catch(error){

        console.error(
            "Series fetch failed:",
            error
        );

    }

}
