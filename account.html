
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUSANSO Premium</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;
    min-height:100dvh;
    font-family:Poppins,Arial,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(212,175,55,.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 15% 85%,
            rgba(80,50,150,.10),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #050505,
            #0c0b08 48%,
            #020202
        );

    padding:clamp(10px,2vw,24px);
}

.page{
    width:100%;
    min-height:calc(100dvh - 2 * clamp(10px,2vw,24px));

    margin:0 auto;

    display:flex;
    flex-direction:column;

    justify-content:center;
}

/* =========================
   HEADER
========================= */

.topbar{
    width:100%;
    max-width:680px;

    height:58px;

    margin:0 auto 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:50px;
    height:50px;

    object-fit:contain;

    border-radius:14px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.35);
}

.top-btn{
    border:1px solid rgba(255,215,0,.28);

    background:
        linear-gradient(
            135deg,
            rgba(255,215,0,.14),
            rgba(255,255,255,.04)
        );

    color:#ffd84d;

    padding:9px 15px;

    border-radius:11px;

    text-decoration:none;

    font-size:11px;
    font-weight:800;

    transition:.2s ease;
}

.top-btn:hover{
    background:rgba(255,215,0,.18);
    transform:translateY(-1px);
}


/* =========================
   MAIN CARD
========================= */

.account-card{
    position:relative;
    overflow:hidden;

    width:100%;
    max-width:680px;

    margin:0 auto;

    border-radius:27px;

    padding:27px 25px 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,215,0,.14),
            rgba(255,255,255,.055) 35%,
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,215,0,.28);

    box-shadow:
        0 25px 70px rgba(0,0,0,.70),
        inset 0 1px rgba(255,255,255,.09);

    backdrop-filter:blur(12px);
}

.account-card:before{
    content:"";

    position:absolute;

    width:280px;
    height:280px;

    border-radius:50%;

    background:rgba(255,215,0,.075);

    filter:blur(65px);

    top:-170px;
    right:-100px;

    pointer-events:none;
}


/* =========================
   TITLE
========================= */

h1{
    position:relative;

    text-align:center;

    font-size:29px;
    line-height:1.15;

    margin-bottom:7px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffe27a,
            #c99716,
            #fff
        );

    background-size:220% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleShine 5s linear infinite;
}

#userName{
    font-weight:950;

    color:#ffb52e;

    text-shadow:
        0 0 18px rgba(255,181,46,.42);
}

.welcome{
    position:relative;

    color:#c5bead;

    font-size:12px;

    margin-bottom:18px;

    text-align:center;

    line-height:1.5;
}


/* =========================
   PACKAGE
========================= */

.package-box{
    position:relative;

    padding:15px 17px;

    border-radius:17px;

    background:
        rgba(0,0,0,.38);

    border:1px solid rgba(255,215,0,.18);

    margin-bottom:12px;

    text-align:center;
}

.package-title{
    color:#918b7c;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1.5px;

    margin-bottom:5px;
}

.package-name{
    font-size:21px;

    font-weight:900;

    color:#ffe06b;

    letter-spacing:.5px;
}

.status{
    margin-top:5px;

    font-size:11px;

    color:#aaa;
}


/* =========================
   EXPIRY
========================= */

.expiry-box{
    position:relative;

    padding:15px 17px;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(255,215,0,.12),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,215,0,.20);

    margin-bottom:14px;

    text-align:center;
}

.expiry-label{
    color:#9e9888;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1.3px;

    margin-bottom:6px;
}

.expiry-date{
    color:#fff;

    font-size:12px;

    margin-bottom:7px;
}

.countdown{
    font-size:13px;

    font-weight:700;

    color:#ffd84d;

    line-height:1.3;

    text-transform:lowercase;
}

.countdown.expired{
    color:#ff6b6b;
}

.countdown.urgent{
    color:#ff3b30;

    font-weight:900;

    text-shadow:
        0 0 10px rgba(255,59,48,.45);
}


/* =========================
   BIG WATCH BUTTONS
========================= */

.big-actions{
    position:relative;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;

    margin-bottom:13px;
}

.big-btn{
    min-height:72px;

    border-radius:17px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:5px;

    text-decoration:none;

    font-size:12px;

    font-weight:900;

    color:#1b1400;

    background:
        linear-gradient(
            135deg,
            #fff0a3,
            #ffd43b 45%,
            #b77d00
        );

    box-shadow:
        0 9px 24px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.75);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.big-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 13px 30px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.8);
}

.big-btn span{
    font-size:25px;
}


/* =========================
   FREE USER LOCK
========================= */

.locked{
    background:
        linear-gradient(
            135deg,
            #3a3528,
            #242119
        ) !important;

    color:#8f8878 !important;

    box-shadow:none !important;

    border-color:
        rgba(255,215,0,.10) !important;

    cursor:pointer;

    position:relative;

    opacity:.82;
}

.locked::after{
    content:"🔒 PREMIUM ONLY";

    display:block;

    font-size:8px;

    margin-top:3px;

    color:#ffd84d;
}


/* =========================
   PAY TO WATCH
========================= */

.pay-btn{
    position:relative;

    display:none;

    width:100%;

    min-height:56px;

    margin:0 0 12px;

    border-radius:16px;

    align-items:center;
    justify-content:center;

    text-align:center;

    text-decoration:none;

    color:#211700;

    font-size:13px;

    font-weight:950;

    letter-spacing:.3px;

    background:
        linear-gradient(
            135deg,
            #fff0a3,
            #ffd43b 45%,
            #b77d00
        );

    border:
        1px solid rgba(255,235,130,.70);

    box-shadow:
        0 10px 28px rgba(255,196,0,.22),
        inset 0 1px rgba(255,255,255,.85);

    animation:
        goldPayPulse 1.8s infinite;
}

.pay-btn:hover{
    animation-play-state:paused;

    transform:scale(1.025);
}


/* =========================
   PREMIUM WATCH BUTTONS
========================= */

.big-btn.premium-active{
    min-height:82px;

    font-size:13px;

    background:
        linear-gradient(
            135deg,
            #fff6b0,
            #ffd21f 45%,
            #d08a00
        );

    box-shadow:
        0 12px 32px rgba(255,196,0,.28),
        inset 0 1px rgba(255,255,255,.9);

    border:
        1px solid rgba(255,235,130,.8);
}

.big-btn.premium-active span{
    font-size:30px;
}


/* =========================
   ADMIN UPDATE
========================= */

.admin-btn{
    display:none;

    width:100%;

    min-height:45px;

    margin-top:0;

    margin-bottom:11px;

    border-radius:13px;

    align-items:center;
    justify-content:center;

    text-align:center;

    text-decoration:none;

    color:#211700;

    font-size:11px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #fff0a3,
            #ffd43b 45%,
            #b77d00
        );

    border:
        1px solid rgba(255,215,0,.35);

    box-shadow:
        0 8px 20px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.7);
}

.admin-btn:hover{
    transform:translateY(-1px);
}


/* =========================
   LOGOUT
========================= */

.logout-btn{
    display:block;

    width:100%;

    min-height:40px;

    margin-top:0;

    border:
        1px solid rgba(255,215,0,.12);

    border-radius:11px;

    background:
        rgba(255,255,255,.035);

    color:#8f8878;

    font-size:10px;

    font-weight:800;

    cursor:pointer;

    transition:.2s ease;
}

.logout-btn:hover{
    color:#ffd84d;

    background:
        rgba(255,215,0,.08);
}


/* =========================
   LOADING
========================= */

.loading{
    width:100%;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#d0c8b5;

    font-size:13px;

    text-align:center;
}

.hidden{
    display:none!important;
}


/* =========================
   ERROR
========================= */

.error{
    text-align:center;

    padding:40px 20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.error h2{
    color:#ffd84d;

    margin-bottom:10px;

    font-size:22px;
}

.error p{
    color:#aaa;

    font-size:12px;

    line-height:1.6;
}

.error a{
    display:inline-block;

    margin-top:17px;

    color:#ffd84d;

    text-decoration:none;

    font-size:12px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes goldPayPulse{

    0%,100%{
        transform:scale(1);

        box-shadow:
            0 10px 28px rgba(255,196,0,.20),
            inset 0 1px rgba(255,255,255,.8);
    }

    50%{
        transform:scale(1.025);

        box-shadow:
            0 14px 35px rgba(255,196,0,.36),
            0 0 20px rgba(255,215,0,.15),
            inset 0 1px rgba(255,255,255,.9);
    }
}

@keyframes titleShine{

    to{
        background-position:220% center;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:6px;
    }

    .page{
        min-height:calc(100dvh - 12px);
    }

    .topbar{
        height:48px;

        margin-bottom:7px;
    }

    .logo{
        width:43px;
        height:43px;
    }

    .top-btn{
        padding:8px 12px;
        font-size:10px;
    }

    .account-card{
        padding:20px 15px 15px;

        border-radius:22px;
    }

    h1{
        font-size:23px;
    }

    .welcome{
        font-size:10px;
        margin-bottom:13px;
    }

    .package-box,
    .expiry-box{
        padding:12px 11px;
        margin-bottom:9px;
    }

    .package-name{
        font-size:18px;
    }

    .status,
    .expiry-date{
        font-size:9px;
    }

    .countdown{
        font-size:10px;
    }

    .big-actions{
        gap:7px;
        margin-bottom:9px;
    }

    .big-btn{
        min-height:62px;
        font-size:10px;
        border-radius:14px;
    }

    .big-btn span{
        font-size:21px;
    }

    .big-btn.premium-active{
        min-height:70px;
        font-size:11px;
    }

    .big-btn.premium-active span{
        font-size:25px;
    }

    .pay-btn{
        min-height:47px;
        margin-bottom:9px;
        font-size:10px;
    }

    .admin-btn{
        min-height:39px;
        margin-bottom:8px;
        font-size:9px;
    }

    .logout-btn{
        min-height:34px;
        font-size:9px;
    }
}


/* =========================
   VERY SHORT SCREENS
========================= */

@media(max-height:650px){

    body{
        padding:5px;
    }

    .page{
        min-height:calc(100dvh - 10px);
    }

    .topbar{
        height:40px;
        margin-bottom:4px;
    }

    .logo{
        width:36px;
        height:36px;
    }

    .top-btn{
        padding:6px 10px;
        font-size:9px;
    }

    .account-card{
        padding:14px 11px 9px;
        border-radius:19px;
    }

    h1{
        font-size:20px;
        margin-bottom:2px;
    }

    .welcome{
        font-size:8px;
        margin-bottom:7px;
    }

    .package-box,
    .expiry-box{
        padding:8px 9px;
        margin-bottom:6px;
    }

    .package-title,
    .expiry-label{
        font-size:7px;
    }

    .package-name{
        font-size:15px;
    }

    .status,
    .expiry-date{
        font-size:8px;
    }

    .countdown{
        font-size:9px;
    }

    .big-actions{
        gap:6px;
        margin-bottom:6px;
    }

    .big-btn{
        min-height:48px;
        font-size:8px;
        border-radius:11px;
    }

    .big-btn span{
        font-size:16px;
    }

    .big-btn.premium-active{
        min-height:56px;
        font-size:9px;
    }

    .big-btn.premium-active span{
        font-size:20px;
    }

    .pay-btn{
        min-height:38px;
        margin-bottom:5px;
        font-size:9px;
    }

    .admin-btn{
        min-height:33px;
        margin-bottom:5px;
        font-size:8px;
    }

    .logout-btn{
        min-height:28px;
        font-size:8px;
    }
}

</style>

</head>


<body>


<div id="loading" class="loading">
    Loading your BUSANSO account...
</div>


<div id="page" class="page hidden">


    <div class="topbar">

        <img
            class="logo"
            src="https://i.ibb.co/qL8vn3jS/busanso-logo-source.png"
            alt="BUSANSO">

        <div class="top-actions">

            <a
                class="top-btn"
                href="home.html">
                HOME
            </a>

        </div>

    </div>


    <main class="account-card">


        <h1>
            Welcome,
            <span id="userName">
                User
            </span>
        </h1>


        <div class="welcome">
            Your BUSANSO package is active.
        </div>


        <!-- PACKAGE -->

        <section class="package-box">

            <div class="package-title">
                Package
            </div>

            <div
                id="packageName"
                class="package-name">
                Loading...
            </div>

            <div
                id="membershipStatus"
                class="status">
                Loading...
            </div>

        </section>


        <!-- EXPIRY -->

        <section
            id="expiryBox"
            class="expiry-box">

            <div class="expiry-label">
                Access expires
            </div>

            <div
                id="expiryDate"
                class="expiry-date">
                Loading...
            </div>

            <div
                id="countdown"
                class="countdown">
                Loading countdown...
            </div>

        </section>


        <!-- WATCH BUTTONS -->

        <div class="big-actions">

            <a
                href="movies.html"
                id="moviesBtn"
                class="big-btn">

                <span>🎬</span>

                WATCH MOVIES

            </a>


            <a
                href="series.html"
                id="seriesBtn"
                class="big-btn">

                <span>📺</span>

                WATCH SERIES

            </a>

        </div>


        <!-- FREE USERS ONLY -->

        <a
            href="packages.html"
            id="payBtn"
            class="pay-btn">

            🔓 PAY TO WATCH

        </a>


        <!-- ADMIN ONLY -->

        <a
            href="adm-page.html"
            id="adminBtn"
            class="admin-btn">

            🔄 UPDATE

        </a>


        <!-- LOGOUT -->

        <button
            type="button"
            class="logout-btn"
            onclick="logout()">

            🚪 LOGOUT

        </button>


    </main>

</div>


<!-- ERROR -->

<div
    id="errorPage"
    class="page hidden">

    <main class="account-card error">

        <h2>
            Account Not Found
        </h2>

        <p id="errorMessage">
            We could not identify this account.
        </p>

        <a href="javascript:location.reload()">
            REFRESH ACCOUNT
        </a>

    </main>

</div>


<script>

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true,
                flowType:"pkce",
                storageKey:"busanso-auth"
            }
        }
    );


/*
 * Legacy compatibility client.
 */
const legacySupabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:false,
                autoRefreshToken:false,
                detectSessionInUrl:false,
                flowType:"pkce"
            }
        }
    );


let countdownTimer = null;


/* =========================================
   LOAD ACCOUNT
========================================= */

async function loadAccount(){

    const loading =
        document.getElementById("loading");

    const page =
        document.getElementById("page");

    const errorPage =
        document.getElementById("errorPage");

    const errorMessage =
        document.getElementById("errorMessage");


    let authUser = null;

    let sessionSource = "none";


    /* CURRENT AUTH SESSION */

    try{

        const {data} =
            await supabaseClient.auth.getSession();

        authUser =
            data?.session?.user || null;

        if(authUser){
            sessionSource = "busanso-auth";
        }

    }catch(error){

        console.warn(
            "Current Supabase session check:",
            error
        );
    }


    /* LEGACY AUTH SESSION */

    if(!authUser){

        try{

            const {data} =
                await legacySupabaseClient
                    .auth
                    .getSession();

            authUser =
                data?.session?.user || null;

            if(authUser){
                sessionSource = "legacy-auth";
            }

        }catch(error){

            console.warn(
                "Legacy Supabase session check:",
                error
            );
        }
    }


    let data = null;


    /* AUTH USER -> PROFILE */

    if(authUser){

        try{

            const result =
                await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq(
                        "auth_user_id",
                        authUser.id
                    )
                    .maybeSingle();

            data =
                result.data || null;

        }catch(error){

            console.warn(
                "auth_user_id profile lookup:",
                error
            );
        }


        /* OLDER EMAIL MATCH */

        if(!data && authUser.email){

            try{

                const result =
                    await supabaseClient
                        .from("profiles")
                        .select("*")
                        .ilike(
                            "email",
                            authUser.email
                        )
                        .maybeSingle();

                data =
                    result.data || null;

            }catch(error){

                console.warn(
                    "email profile lookup:",
                    error
                );
            }
        }
    }


    /* LEGACY USER ID */

    if(!data){

        const userID =
            localStorage.getItem("user_id");

        if(userID){

            try{

                const result =
                    await supabaseClient
                        .from("profiles")
                        .select("*")
                        .eq(
                            "id",
                            Number(userID)
                        )
                        .maybeSingle();

                data =
                    result.data || null;

            }catch(error){

                console.warn(
                    "legacy user_id profile lookup:",
                    error
                );
            }
        }
    }


    /* FINAL LOCAL ID VERIFICATION */

    if(!data){

        const cachedID =
            localStorage.getItem("user_id");

        if(cachedID){

            try{

                const result =
                    await supabaseClient
                        .from("profiles")
                        .select("*")
                        .eq(
                            "id",
                            Number(cachedID)
                        )
                        .single();

                data =
                    result.data || null;

            }catch(error){

                console.warn(
                    "Final profile verification:",
                    error
                );
            }
        }
    }


    /* NO PROFILE */

    if(!data){

        console.error(
            "BUSANSO: no matching profile found.",
            {
                sessionSource,
                authUserId:
                    authUser?.id || null,
                email:
                    authUser?.email || null,
                localUserId:
                    localStorage.getItem("user_id")
            }
        );


        if(loading){
            loading.classList.add("hidden");
        }

        if(page){
            page.classList.add("hidden");
        }


        if(errorPage){

            errorPage.classList.remove("hidden");

            if(errorMessage){

                errorMessage.textContent =
                    authUser

                        ? "Your BUSANSO profile could not be matched yet. Your login session has NOT been signed out."

                        : "Your BUSANSO login session could not be read. Please refresh this page.";
            }
        }

        return false;
    }


    /* SYNCHRONIZE USER */

    localStorage.setItem(
        "user_id",
        String(data.id)
    );


    if(authUser){

        localStorage.setItem(
            "auth_user_id",
            authUser.id
        );

        localStorage.setItem(
            "supabase_auth_user_id",
            authUser.id
        );


        if(authUser.email){

            localStorage.setItem(
                "email",
                authUser.email
            );
        }
    }


    /* ACCOUNT STATUS */

    if(
        (data.account_status || "")
            .toLowerCase() !== "active"
    ){

        location.href =
            "blocked.html";

        return false;
    }


    const membership =
        (data.membership || "free")
            .toLowerCase();


    document.getElementById(
        "userName"
    ).textContent =
        data.name || "Member";


    document.getElementById(
        "packageName"
    ).textContent =
        (
            data.package_type ||
            "free"
        ).toUpperCase();


    const status =
        document.getElementById(
            "membershipStatus"
        );


    const expiryBox =
        document.getElementById(
            "expiryBox"
        );


    const moviesBtn =
        document.getElementById(
            "moviesBtn"
        );


    const seriesBtn =
        document.getElementById(
            "seriesBtn"
        );


    const payBtn =
        document.getElementById(
            "payBtn"
        );


    /*
     * PREMIUM IS ACTIVE ONLY WHEN:
     * membership = premium
     * AND expires_at is still in future.
     */

    const premiumActive =
        membership === "premium" &&
        data.expires_at &&
        new Date(data.expires_at) > new Date();


    /*
     * PAY TO WATCH:
     * ONLY FREE USERS SEE THIS.
     */

    if(payBtn){

        payBtn.style.display =
            membership === "free"
                ? "flex"
                : "none";
    }


    /* PREMIUM */

    if(premiumActive){

        status.textContent =
            "Active";


        moviesBtn.classList.remove(
            "locked"
        );

        seriesBtn.classList.remove(
            "locked"
        );


        moviesBtn.classList.add(
            "premium-active"
        );

        seriesBtn.classList.add(
            "premium-active"
        );


        moviesBtn.href =
            "movies.html";

        seriesBtn.href =
            "series.html";


        moviesBtn.onclick =
            null;

        seriesBtn.onclick =
            null;


        expiryBox.style.display =
            "block";


        startExpiryCountdown(
            data.expires_at
        );

    }else{

        status.textContent =
            membership === "premium"
                ? "Expired"
                : "Free package";


        if(data.expires_at){

            expiryBox.style.display =
                "block";

            startExpiryCountdown(
                data.expires_at
            );

        }else{

            expiryBox.style.display =
                "none";
        }


        /*
         * LOCK WATCH BUTTONS FOR FREE
         * AND EXPIRED PREMIUM USERS.
         */

        moviesBtn.classList.add(
            "locked"
        );

        seriesBtn.classList.add(
            "locked"
        );


        moviesBtn.classList.remove(
            "premium-active"
        );

        seriesBtn.classList.remove(
            "premium-active"
        );


        moviesBtn.href =
            "javascript:void(0)";

        seriesBtn.href =
            "javascript:void(0)";


        moviesBtn.onclick =
            function(){

                location.href =
                    "packages.html";
            };


        seriesBtn.onclick =
            function(){

                location.href =
                    "packages.html";
            };
    }


    /* LOCAL CACHE */

    localStorage.setItem(
        "name",
        data.name || ""
    );

    localStorage.setItem(
        "whatsapp_number",
        data.whatsapp_number || ""
    );

    localStorage.setItem(
        "membership",
        data.membership || "free"
    );

    localStorage.setItem(
        "package_type",
        data.package_type || ""
    );

    localStorage.setItem(
        "expires_at",
        data.expires_at || ""
    );


    if(data.account_status){

        localStorage.setItem(
            "account_status",
            data.account_status
        );
    }


    if(data.role){

        localStorage.setItem(
            "role",
            data.role
        );
    }


    loading.classList.add(
        "hidden"
    );


    if(errorPage){

        errorPage.classList.add(
            "hidden"
        );
    }


    page.classList.remove(
        "hidden"
    );


    return true;
}


/* =========================================
   EXPIRY COUNTDOWN
========================================= */

function startExpiryCountdown(
    expiryDate
){

    const expiryDateEl =
        document.getElementById(
            "expiryDate"
        );

    const countdown =
        document.getElementById(
            "countdown"
        );


    function update(){

        const diff =
            new Date(expiryDate).getTime() -
            new Date().getTime();


        if(diff <= 0){

            expiryDateEl.textContent =
                new Date(
                    expiryDate
                ).toLocaleString();


            countdown.textContent =
                "access expired";


            countdown.classList.remove(
                "urgent"
            );

            countdown.classList.add(
                "expired"
            );


            document.getElementById(
                "membershipStatus"
            ).textContent =
                "Expired";


            return;
        }


        expiryDateEl.textContent =
            new Date(
                expiryDate
            ).toLocaleString(
                undefined,
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            );


        const days =
            Math.floor(
                diff / 86400000
            );


        const hours =
            Math.floor(
                (diff % 86400000) /
                3600000
            );


        const minutes =
            Math.floor(
                (diff % 3600000) /
                60000
            );


        const seconds =
            Math.floor(
                (diff % 60000) /
                1000
            );


        if(days < 5){

            countdown.classList.add(
                "urgent"
            );

        }else{

            countdown.classList.remove(
                "urgent"
            );
        }


        countdown.textContent =
            days + " days " +

            String(hours)
                .padStart(2,"0") +

            " hours " +

            String(minutes)
                .padStart(2,"0") +

            " minutes " +

            String(seconds)
                .padStart(2,"0") +

            " seconds";
    }


    update();


    if(countdownTimer){

        clearInterval(
            countdownTimer
        );
    }


    countdownTimer =
        setInterval(
            update,
            1000
        );
}


/* =========================================
   ADMIN BUTTON
========================================= */

async function checkAdminAccess(){

    let data = null;


    /*
     * FIRST:
     * Check the currently authenticated user.
     */

    try{

        const {data:sessionData} =
            await supabaseClient
                .auth
                .getSession();


        const authUser =
            sessionData?.session?.user ||
            null;


        if(authUser){

            const result =
                await supabaseClient
                    .from("profiles")
                    .select("role")
                    .eq(
                        "auth_user_id",
                        authUser.id
                    )
                    .maybeSingle();


            data =
                result.data || null;
        }

    }catch(error){

        console.warn(
            "Admin session check:",
            error
        );
    }


    /*
     * LEGACY FALLBACK
     */

    if(!data){

        const userID =
            localStorage.getItem(
                "user_id"
            );


        if(userID){

            try{

                const result =
                    await supabaseClient
                        .from("profiles")
                        .select("role")
                        .eq(
                            "id",
                            Number(userID)
                        )
                        .maybeSingle();


                data =
                    result.data || null;

            }catch(error){

                console.warn(
                    "Legacy admin check:",
                    error
                );
            }
        }
    }


    /*
     * SHOW UPDATE ONLY TO ADMIN.
     *
     * This deliberately checks the DATABASE
     * role value. It does NOT trust a localStorage
     * role by itself.
     */

    if(
        data &&
        data.role &&
        String(data.role)
            .trim()
            .toLowerCase() === "admin"
    ){

        const adminBtn =
            document.getElementById(
                "adminBtn"
            );


        if(adminBtn){

            adminBtn.style.display =
                "flex";
        }
    }
}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    try{

        await supabaseClient
            .auth
            .signOut();

    }catch(error){

        console.warn(
            "Supabase signout:",
            error
        );
    }


    localStorage.clear();


    location.href =
        "auth.html";
}


/* =========================================
   START
========================================= */

async function startPage(){

    try{

        const loaded =
            await loadAccount();


        if(!loaded){

            return;
        }


        await checkAdminAccess();


        /*
         * REALTIME PROFILE UPDATES
         */

        const userID =
            localStorage.getItem(
                "user_id"
            );


        if(userID){

            supabaseClient
                .channel(
                    "profile-" + userID
                )
                .on(
                    "postgres_changes",
                    {
                        event:"*",
                        schema:"public",
                        table:"profiles",
                        filter:
                            `id=eq.${userID}`
                    },
                    function(){

                        loadAccount();

                        checkAdminAccess();

                    }
                )
                .subscribe();
        }


    }catch(error){

        console.error(
            "BUSANSO account error:",
            error
        );


        const loading =
            document.getElementById(
                "loading"
            );


        const page =
            document.getElementById(
                "page"
            );


        if(loading){

            loading.classList.add(
                "hidden"
            );
        }


        if(page){

            page.classList.add(
                "hidden"
            );
        }


        const errorPage =
            document.getElementById(
                "errorPage"
            );


        if(errorPage){

            errorPage.classList.remove(
                "hidden"
            );
        }
    }
}


startPage();

</script>
