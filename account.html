<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BUSANSO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#050403}
body{font-family:Poppins,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#5a410f 0,#171108 28%,#070604 58%,#020202 100%);color:#fff;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,215,90,.035),transparent 28%);z-index:-1}
.header{position:sticky;top:0;z-index:100;background:rgba(5,4,2,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(212,175,55,.45);box-shadow:0 8px 30px rgba(0,0,0,.35);padding:10px 16px}
.nav{max-width:1380px;margin:auto;display:flex;align-items:center;gap:14px;min-height:58px}
.logo{width:150px;height:52px;object-fit:contain;flex-shrink:0}
.actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:800;font-size:12px;padding:0 17px;border-radius:14px;border:1px solid #e2bd55;background:linear-gradient(135deg,#68450b,#d4af37 50%,#7b5411);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.28);white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.birthday{background:linear-gradient(135deg,#9b6710,#f4d36b 50%,#9b6710);color:#211500}
.welcome{text-align:center;max-width:1380px;margin:7px auto 0;padding:0 14px;color:#e7c96c;font-size:12px;min-height:18px}
#main{padding-bottom:40px}
.hero{max-width:1380px;margin:14px auto 0;padding:0 16px}
.hero-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 1px 5px}
.hero-track::-webkit-scrollbar{display:none}
.hero-card{min-width:100%;height:350px;position:relative;overflow:hidden;border-radius:24px;border:1px solid rgba(220,177,65,.75);scroll-snap-align:center;box-shadow:0 18px 55px rgba(0,0,0,.7);cursor:pointer;background:#100d06}
.hero-card img{width:100%;height:100%;object-fit:cover;display:block}
.hero-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.22) 48%,rgba(0,0,0,.05) 100%)}
.hero-info{position:absolute;z-index:2;left:30px;right:30px;bottom:24px}
.hero-info h2{font-size:30px;font-weight:800;line-height:1.12;text-shadow:0 3px 15px #000;margin-top:4px}
.hero-info span{display:inline-block;color:#1e1500;background:linear-gradient(135deg,#ffe58a,#c99a28);padding:5px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.8px}
.dots{text-align:center;padding:8px 0 2px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#675225;margin:3px;cursor:pointer;transition:.2s}.dot.active{width:28px;border-radius:10px;background:#d4af37}
.section{max-width:1380px;margin:18px auto 0;padding:0 16px}
.section-title{font-size:20px;font-weight:800;color:#f0cf69;margin-bottom:11px;padding:10px 13px;border-left:4px solid #d4af37;background:linear-gradient(90deg,rgba(212,175,55,.10),transparent 70%);border-radius:0 10px 10px 0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{min-width:0;cursor:pointer;padding-bottom:4px}.poster{aspect-ratio:2/3;border-radius:14px;overflow:hidden;border:1px solid rgba(183,141,43,.42);background:#171208;box-shadow:0 8px 22px rgba(0,0,0,.55);transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover .poster{transform:translateY(-3px);border-color:#d4af37;box-shadow:0 13px 28px rgba(0,0,0,.7)}.poster img{width:100%;height:100%;object-fit:cover;display:block}.title{font-size:11px;font-weight:700;line-height:1.35;margin-top:7px;color:#f1ead9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#9b8a60;font-size:12px;padding:20px 0}.wa{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#25d366;box-shadow:0 8px 25px #0009;z-index:50;border:2px solid rgba(255,255,255,.25)}.wa img{width:30px;height:30px}.loading{min-height:55vh;display:flex;align-items:center;justify-content:center;color:#e7c761;font-weight:700}.skeleton{aspect-ratio:2/3;border-radius:14px;background:linear-gradient(90deg,#171208,#30240e,#171208);background-size:200%;animation:load 1.2s infinite}@keyframes load{to{background-position:-200%}}
@media(max-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}.hero-card{height:310px}.hero-info h2{font-size:25px}.logo{width:135px}}
@media(max-width:720px){.header{padding:8px 10px}.nav{gap:8px;min-height:50px}.logo{width:110px;height:44px}.actions{gap:7px}.btn{min-height:42px;padding:0 12px;font-size:10px;border-radius:12px}.hero{margin-top:10px;padding:0 10px}.hero-card{height:250px;border-radius:19px}.hero-info{left:19px;bottom:18px}.hero-info h2{font-size:21px}.section{padding:0 10px;margin-top:15px}.section-title{font-size:17px;margin-bottom:9px;padding:8px 10px}.grid{grid-template-columns:repeat(4,1fr);gap:10px}.poster{border-radius:11px}.title{font-size:10px;margin-top:6px}.welcome{font-size:11px}}
@media(max-width:480px){.header{padding:7px 8px}.nav{min-height:46px}.logo{width:92px;height:39px}.actions{gap:5px}.btn{min-height:40px;padding:0 9px;font-size:9px;border-radius:11px}.birthday{font-size:0;padding:0;width:42px}.birthday:first-letter{font-size:18px}.hero{margin-top:8px;padding:0 8px}.hero-card{height:205px;border-radius:16px}.hero-info{left:14px;bottom:13px}.hero-info h2{font-size:17px}.hero-info span{font-size:8px;padding:4px 8px}.dots{padding:6px 0 0}.section{padding:0 8px;margin-top:13px}.section-title{font-size:15px;margin-bottom:8px;padding:7px 9px}.grid{grid-template-columns:repeat(3,1fr);gap:9px}.poster{border-radius:10px}.title{font-size:9px;margin-top:5px}.wa{width:52px;height:52px;right:12px;bottom:12px}}
@media(min-width:1400px){.hero-card{height:390px}.section{margin-top:20px}.grid{gap:16px}.title{font-size:12px}}
</style>
</head>
<body>
<header class="header"><div class="nav">
<img class="logo" src="https://i.ibb.co/hxgrLF35/BUSANSO-New.png" alt="BUSANSO">
<div class="actions"><a class="btn birthday" href="happy-birthday.html">🎂 <span> BIRTHDAY WISHES</span></a><a class="btn" id="loginBtn" href="auth.html">LOGIN</a></div>
</div><div id="welcome" class="welcome"></div></header>
<div id="loading" class="loading">Loading BUSANSO...</div>
<main id="main" style="display:none">
<section class="hero"><div id="heroTrack" class="hero-track"></div><div id="dots" class="dots"></div></section>
<div id="sections"></div>
</main>
<a class="wa" href="https://wa.me/256703888884" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp"></a>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const SUPABASE_URL="https://dhkfhhybzcxdeoalcfqx.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0JiTxDqCnzgLIIzKf9uCx3WrSgk2DaY";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let profile=null;

// IMPORTANT: user recognition is based on the current Supabase Auth user,
// then the matching row in public.profiles. No localStorage/device_id is used.
async function loadUser(){
  const {data:{user},error:authError}=await supabase.auth.getUser();
  if(authError||!user) return null;
  // The profiles table should contain auth_user_id for Google/OAuth accounts.
  let {data,error}=await supabase.from("profiles").select("*").eq("auth_user_id",user.id).maybeSingle();
  if(error) throw error;
  // If the row was created without auth_user_id but has the Auth user's email,
  // use email only as a database lookup fallback. No local profile data is used.
  if(!data && user.email){
    const r=await supabase.from("profiles").select("*").eq("email",user.email).maybeSingle();
    if(!r.error && r.data) data=r.data;
  }
  if(data){
    profile=data;
    const displayName=data.name||user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split("@")[0]||"USER";
    $("loginBtn").textContent=displayName.toUpperCase();
    $("loginBtn").href="account.html";
    $("welcome").innerHTML=`Welcome back <b>${escapeHtml(displayName.toUpperCase())}</b>`;
  }
  return data;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
function isFree(item){return String(item.type??"").toLowerCase()!=="premium" && item.type!==true;}
function card(item,page){const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="poster"><img loading="lazy" src="${escapeAttr(item.poster||"")}" alt=""></div><div class="title">${escapeHtml(item.title||"Untitled")}</div>`;d.onclick=()=>location.href=`${page}.html?id=${encodeURIComponent(item.id)}`;return d;}
function escapeAttr(s){return String(s).replace(/&/g,"&amp;").replace(/\"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function section(title,id,items,page){const wrap=document.createElement("section");wrap.className="section";wrap.innerHTML=`<h2 class="section-title">${title}</h2><div class="grid" id="${id}"></div>`;const grid=wrap.querySelector(".grid");if(!items.length)grid.innerHTML='<div class="empty">Nothing available yet.</div>';items.forEach(x=>grid.appendChild(card(x,page)));$("sections").appendChild(wrap);}
async function loadContent(){
  const [mr,sr]=await Promise.all([
    supabase.from("movies").select("*").order("created_at",{ascending:false}),
    supabase.from("series").select("*").order("created_at",{ascending:false})
  ]);
  if(mr.error) throw mr.error;if(sr.error) throw sr.error;
  const movies=mr.data||[],series=sr.data||[];
  // Exactly latest 2 horizontal movie posters + latest 2 horizontal series posters.
  const heroItems=[...movies.slice(0,2).map(x=>({...x,_page:"movie",_kind:"MOVIE"})),...series.slice(0,2).map(x=>({...x,_page:"serie",_kind:"SERIES"}))].filter(x=>x.horizontal_poster||x.poster);
  const hero=$('heroTrack'),dots=$('dots');hero.innerHTML="";dots.innerHTML="";
  heroItems.forEach((item,i)=>{const el=document.createElement("article");el.className="hero-card";el.innerHTML=`<img src="${escapeAttr(item.horizontal_poster||item.poster)}" alt=""><div class="hero-info"><span>${item._kind}</span><h2>${escapeHtml(item.title||"Untitled")}</h2></div>`;el.onclick=()=>location.href=`${item._page}.html?id=${encodeURIComponent(item.id)}`;hero.appendChild(el);const dot=document.createElement("i");dot.className="dot"+(i===0?" active":"");dot.onclick=()=>hero.scrollTo({left:hero.clientWidth*i,behavior:"smooth"});dots.appendChild(dot)});
  const latestMovies=movies.slice(0,12),latestSeries=series.slice(0,12),freeMovies=movies.filter(isFree).slice(0,12),freeSeries=series.filter(isFree).slice(0,12);
  $("sections").innerHTML="";
  section("🎬 Latest Movies","latestMovies",latestMovies,"movie");
  section("📺 Latest Series","latestSeries",latestSeries,"serie");
  section("🎁 Free Movies","freeMovies",freeMovies,"movie");
  section("🎁 Free Series","freeSeries",freeSeries,"serie");
  let n=0;setInterval(()=>{if(!heroItems.length)return;n=(n+1)%heroItems.length;hero.scrollTo({left:hero.clientWidth*n,behavior:"smooth"});[...dots.children].forEach((d,i)=>d.classList.toggle("active",i===n));},6000);
}
async function start(){try{await loadUser();await loadContent();$("loading").style.display="none";$("main").style.display="block";}catch(e){console.error(e);$("loading").innerHTML="BUSANSO could not load right now. Please refresh the page.";}}
supabase.auth.onAuthStateChange((event)=>{if(["SIGNED_IN","TOKEN_REFRESHED","USER_UPDATED"].includes(event))loadUser().catch(console.error);if(event==="SIGNED_OUT"){profile=null;$("loginBtn").textContent="LOGIN";$("loginBtn").href="auth.html";$("welcome").textContent="";}});
start();
</script>
</body>
</html>
