/* CARD */

/* TITLE */

.title{

background:

-webkit-text-fill-color:transparent;

}


.subtitle{

/* STATUS */

.status-box{

padding:20px;

border-radius:20px;

rgba(212,175,55,.08);

1px solid

}

.status-label{

letter-spacing:2px;

}

.status-value{

}

.status-value.free{

}


/* DETAILS */

.details{

display:flex;

}

.row{

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

padding:14px 15px;

border-radius:15px;

background:
rgba(255,255,255,.035);

border:
1px solid
rgba(255,255,255,.06);

}

.label{

color:#888;

font-size:11px;

}

.value{

color:#fff;

font-size:12px;

font-weight:700;

text-align:right;

word-break:break-word;

}


/* BUTTONS */

.actions{

display:flex;

flex-direction:column;

gap:11px;

margin-top:25px;

}

.button{

display:block;

width:100%;

padding:15px;

border-radius:16px;

text-align:center;

text-decoration:none;

font-size:13px;

font-weight:800;

cursor:pointer;

border:none;

}

.primary{

background:

linear-gradient(
135deg,
#8f6b18,
#d4af37,
#f5df7a
);

color:#160f00;

box-shadow:

0 10px 25px
rgba(212,175,55,.20);

}

.secondary{

background:
rgba(255,255,255,.06);

border:
1px solid
rgba(255,255,255,.1);

color:#fff;

}


/* MESSAGE */

.message{

text-align:center;

padding:25px 10px;

color:#aaa;

font-size:13px;

}


/* ERROR */

.error{

color:#ff8a8a;

text-align:center;

line-height:1.7;

}


/* GOLD LINE */

.gold-line{

height:1px;

margin:25px 0;

background:

linear-gradient(
90deg,
transparent,
#d4af37,
transparent
);

}


/* MOBILE */

@media(max-width:400px){

.account-card{

padding:25px 16px;

}

.title{

font-size:23px;

}

}

</style>

</head>

<div class="container">

<img
class="logo"

>


<h1 class="title">

</div>

<script>

(function(){

"use strict";


/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
ELEMENTS
========================================================= */

const loading =
document.getElementById(
"loading"
);

const content =
document.getElementById(
"accountContent"
);

const errorBox =
document.getElementById(
"errorBox"
);

const membershipStatus =
document.getElementById(
"membershipStatus"
);

const profileName =
document.getElementById(
"profileName"
);

const emailRow =
document.getElementById(
"emailRow"
);

const profileEmail =
document.getElementById(
"profileEmail"
);

const packageType =
document.getElementById(
"packageType"
);

const expiry =
document.getElementById(
"expiry"
);

const accountId =
document.getElementById(
"accountId"
);

const loginMethod =
document.getElementById(
"loginMethod"
);


/* =========================================================
ACCESS
========================================================= */

function getAccess(profile){

if(!profile){
return "free";
}

const membership =
String(
profile.membership || ""
)
.toLowerCase()
.trim();

const packageTypeValue =
String(
profile.package_type || ""
)
.toLowerCase()
.trim();

const paid =
profile.paid_status === true ||
profile.paid_status === "true";


if(
membership === "kibanda" ||
packageTypeValue === "kibanda"
){

return "kibanda";

}


if(
membership === "premium" ||
packageTypeValue === "premium" ||
paid
){

return "premium";

}


return "free";

}


/* =========================================================
EXPIRY
========================================================= */

function isExpired(profile){

if(
!profile ||
!profile.expires_at
){

return false;

}

const date =
new Date(
profile.expires_at
);

if(
Number.isNaN(
date.getTime()
)
){

return false;

}

return date.getTime() <= Date.now();

}


/* =========================================================
GOOGLE PROFILE
========================================================= */

async function getGoogleProfile(
user
){

if(
!user ||
!user.id
){

return null;

}


const result =
await supabase

.from("profiles")

.select("*")

.eq(
"auth_user_id",
user.id
)

.maybeSingle();


if(result.error){

console.error(
"Google profile error:",
result.error
);

throw result.error;

}


return result.data || null;

}


/* =========================================================
LEGACY PROFILE
========================================================= */

async function getLegacyProfile(){

/*
First use user_id.
*/

const storedId =
localStorage.getItem(
"user_id"
);

if(storedId){

const id =
Number(
storedId
);

if(
Number.isFinite(id)
){

const result =
await supabase

.from("profiles")

.select("*")

.eq(
"id",
id
)

.maybeSingle();


if(
!result.error &&
result.data
){

return result.data;

}

}

}


/*
Old fallback:
name.
*/

const name =
localStorage.getItem(
"name"
);

if(name){

const result =
await supabase

.from("profiles")

.select("*")

.eq(
"name",
name
)

.limit(1);


if(
!result.error &&
result.data &&
result.data.length
){

return result.data[0];

}

}


return null;

}


/* =========================================================
SAVE COMPATIBILITY
========================================================= */

function saveCompatibility(
profile,
user
){

try{

if(user && user.id){

localStorage.setItem(
"auth_user_id",
user.id
);

localStorage.setItem(
"supabase_auth_user_id",
user.id
);

}

if(
profile &&
profile.id != null
){

localStorage.setItem(
"user_id",
String(profile.id)
);

}

if(profile){

localStorage.setItem(
"name",
profile.name || ""
);

localStorage.setItem(
"membership",
String(
profile.membership || "free"
).toLowerCase()
);

localStorage.setItem(
"package_type",
profile.package_type || ""
);

localStorage.setItem(
"paid_status",
String(
profile.paid_status === true ||
profile.paid_status === "true"
)
);

localStorage.setItem(
"expires_at",
profile.expires_at || ""
);

localStorage.setItem(
"activated_at",
profile.activated_at || ""
);

}

}catch(error){

console.warn(
"Compatibility storage error:",
error
);

}

}


/* =========================================================
DISPLAY
========================================================= */

function displayProfile(
profile,
authUser,
method
){

const access =
getAccess(profile);


/*
Expired premium/kibanda
*/

let displayedAccess =
access;

if(
isExpired(profile) &&
(
access === "premium" ||
access === "kibanda"
)
){

displayedAccess =
"expired";

}


/* MEMBERSHIP */

if(
displayedAccess === "premium"
){

membershipStatus.textContent =
"PREMIUM";

membershipStatus.className =
"status-value";

}
else if(
displayedAccess === "kibanda"
){

membershipStatus.textContent =
"KIBANDA";

membershipStatus.className =
"status-value";

}
else if(
displayedAccess === "expired"
){

membershipStatus.textContent =
"EXPIRED";

membershipStatus.className =
"status-value";

}
else{

membershipStatus.textContent =
"FREE";

membershipStatus.className =
"status-value free";

}


/* NAME */

profileName.textContent =
profile.name ||
"BUSANSO USER";


/* GOOGLE EMAIL */

if(
authUser &&
authUser.email
){

emailRow.style.display =
"flex";

profileEmail.textContent =
authUser.email;

}


/* PACKAGE */

packageType.textContent =
profile.package_type ||
(
displayedAccess === "premium"
?
"Premium"
:
displayedAccess === "kibanda"
?
"Kibanda"
:
"Free"
);


/* EXPIRY */

if(
profile.expires_at
){

const date =
new Date(
profile.expires_at
);

if(
!Number.isNaN(
date.getTime()
)
){

expiry.textContent =
date.toLocaleString();

}else{

expiry.textContent =
profile.expires_at;

}

}else{

expiry.textContent =
"No expiry";

}


/* ID */

accountId.textContent =
profile.id != null
?
String(profile.id)
:
"-";


/* METHOD */

loginMethod.textContent =
method === "google"
?
"Google"
:
"Legacy account";


/* SHOW */

loading.style.display =
"none";

content.style.display =
"block";

}


/* =========================================================
MAIN ACCOUNT CHECK
========================================================= */

async function loadAccount(){

try{


/*
=========================================================
1. GOOGLE / SUPABASE AUTH
=========================================================
*/

const sessionResult =
await supabase.auth.getSession();


if(
!sessionResult.error &&
sessionResult.data &&
sessionResult.data.session &&
sessionResult.data.session.user
){

const user =
sessionResult.data.session.user;

const profile =
await getGoogleProfile(
user
);


if(profile){

saveCompatibility(
profile,
user
);

displayProfile(
profile,
user,
"google"
);

return;

}

}


/*
=========================================================
2. LEGACY ACCOUNT
=========================================================
*/

const legacy =
await getLegacyProfile();


if(legacy){

saveCompatibility(
legacy,
null
);

displayProfile(
legacy,
null,
"legacy"
);

return;

}


/*
=========================================================
NO ACCOUNT
=========================================================
*/

loading.style.display =
"none";

errorBox.style.display =
"block";

errorBox.innerHTML =

`
No BUSANSO account could be identified.

<br><br>

Please return to the sign-in page and
continue with Google.
<br><br>

<a
href="auth.html"
style="
color:#d4af37;
font-weight:800;
text-decoration:none;
"
>
GO TO SIGN IN
</a>
`;

}catch(error){

console.error(
"ACCOUNT PAGE ERROR:",
error
);

loading.style.display =
"none";

errorBox.style.display =
"block";

errorBox.textContent =
"Unable to load your account. Please try again.";

}

}


/* =========================================================
START
========================================================= */

loadAccount();


/* =========================================================
AUTH STATE CHANGE
========================================================= */

supabase.auth.onAuthStateChange(
async function(
event,
session
){

if(
event === "SIGNED_IN" &&
session &&
session.user
){

try{

const profile =
await getGoogleProfile(
session.user
);

if(profile){

saveCompatibility(
profile,
session.user
);

displayProfile(
profile,
session.user,
"google"
);

}

}catch(error){

console.error(
"Auth state profile error:",
error
);

}

}

});


})();

</script>

</body>

</html>
