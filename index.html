<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSANSO</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020204;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* =========================================================
   PREMIUM CINEMATIC BACKGROUND
   ========================================================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

/* Deep cinematic gradients */
.background::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(212,175,55,.20) 0%,
            rgba(212,175,55,.08) 20%,
            transparent 48%
        ),
        radial-gradient(
            ellipse at 10% 90%,
            rgba(91,55,180,.14),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 90% 10%,
            rgba(20,120,170,.10),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #030305 0%,
            #08080d 45%,
            #020203 100%
        );
}

/* Soft cinematic light */
.light{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.45;
    background:rgba(212,175,55,.10);
    animation:lightMove 8s ease-in-out infinite alternate;
}

.light.one{
    top:-250px;
    left:-220px;
}

.light.two{
    right:-260px;
    bottom:-250px;
    background:rgba(95,70,190,.10);
    animation-delay:-4s;
}

/* Large soft spotlight */
.spotlight{
    position:absolute;
    left:50%;
    top:-25%;
    width:55vw;
    height:90vh;
    transform:translateX(-50%);
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.045),
            rgba(212,175,55,.025),
            transparent 75%
        );
    filter:blur(35px);
    opacity:.65;
}

/* =========================================================
   FLOATING PARTICLES
   ========================================================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    box-shadow:0 0 6px rgba(255,255,255,.25);
    animation:
        particleFloat var(--duration) linear infinite;
    animation-delay:var(--delay);
}

/* A few larger golden particles */
.gold-particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(212,175,55,.75);
    box-shadow:0 0 10px rgba(212,175,55,.45);
    animation:
        particleFloat var(--duration) linear infinite;
    animation-delay:var(--delay);
}

/* =========================================================
   MAIN SPLASH
   ========================================================= */

.splash{
    position:relative;
    z-index:5;
    width:min(92vw,620px);
    text-align:center;
    padding:28px 22px;

    animation:
        splashIn 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}

/* =========================================================
   LOGO
   ========================================================= */

.logo-wrap{
    width:125px;
    height:125px;
    margin:0 auto 24px;

    padding:3px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #fff4b0,
            #d4af37,
            #8a6918,
            #fff5bd,
            #d4af37
        );

    box-shadow:
        0 0 25px rgba(212,175,55,.25),
        0 0 75px rgba(212,175,55,.12),
        inset 0 0 20px rgba(255,255,255,.15);

    animation:
        logoGlow 3s ease-in-out infinite alternate;
}

.logo{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    border-radius:27px;

    background:#050505;
}

/* =========================================================
   BRAND
   ========================================================= */

.brand{
    margin:0;

    font-size:
        clamp(36px,9vw,64px);

    line-height:1;

    font-weight:900;

    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            #fff4b2,
            #d4af37,
            #fffbe0,
            #b78b25,
            #fff1a0
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        goldShine 4s linear infinite;

    filter:
        drop-shadow(
            0 5px 22px rgba(212,175,55,.22)
        );
}

.tagline{
    margin-top:12px;

    color:#aaa;

    font-size:
        clamp(10px,2.5vw,13px);

    font-weight:700;

    letter-spacing:4px;

    text-transform:uppercase;
}

/* =========================================================
   OCTOBER MESSAGE
   ========================================================= */

.line{
    width:190px;
    height:1px;

    margin:25px auto 20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            transparent
        );

    opacity:.8;
}

.october{
    margin:0 auto;

    max-width:520px;

    color:#f4f4f4;

    font-size:
        clamp(15px,3.6vw,21px);

    line-height:1.45;

    font-weight:700;

    text-shadow:
        0 2px 15px rgba(0,0,0,.6);
}

.october strong{
    color:#d4af37;

    font-weight:900;
}

.submessage{
    margin:9px auto 0;

    max-width:480px;

    color:#999;

    font-size:
        clamp(11px,2.7vw,14px);

    line-height:1.5;

    font-weight:500;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading{
    margin-top:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    color:#777;

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;
}

.dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#d4af37;

    box-shadow:
        0 0 8px rgba(212,175,55,.5);

    animation:
        dotPulse 1s ease-in-out infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

/* =========================================================
   FADE OUT
   ========================================================= */

.fadeOut{
    animation:
        fadeOut .65s ease forwards;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes splashIn{

    from{
        opacity:0;
        transform:
            translateY(22px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes fadeOut{

    to{
        opacity:0;
        transform:
            scale(1.035);
    }
}

@keyframes logoGlow{

    from{
        transform:scale(1);

        box-shadow:
            0 0 25px rgba(212,175,55,.20),
            0 0 65px rgba(212,175,55,.08);
    }

    to{
        transform:scale(1.025);

        box-shadow:
            0 0 38px rgba(212,175,55,.38),
            0 0 95px rgba(212,175,55,.14);
    }
}

@keyframes goldShine{

    to{
        background-position:300% center;
    }
}

@keyframes lightMove{

    from{
        transform:
            translate(0,0)
            scale(.9);

        opacity:.35;
    }

    to{
        transform:
            translate(110px,70px)
            scale(1.25);

        opacity:.8;
    }
}

@keyframes particleFloat{

    0%{
        transform:
            translateY(105vh)
            translateX(0);

        opacity:0;
    }

    15%{
        opacity:.55;
    }

    50%{
        transform:
            translateY(50vh)
            translateX(20px);
    }

    85%{
        opacity:.35;
    }

    100%{
        transform:
            translateY(-10vh)
            translateX(-15px);

        opacity:0;
    }
}

@keyframes dotPulse{

    0%,100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
    }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
    }
}
</style>
</head>

<body>

<!-- PREMIUM BACKGROUND -->
<div class="background">

    <div class="light one"></div>
    <div class="light two"></div>

    <div class="spotlight"></div>

    <div class="particles" id="particles"></div>

</div>


<!-- SPLASH -->
<main class="splash" id="splash">

    <div class="logo-wrap">

        <img
            class="logo"
            src="https://i.ibb.co/hxgrLF35/BUSANSO-New.png"
            alt="BUSANSO">

    </div>


    <h1 class="brand">
        BUSANSO
    </h1>


    <div class="tagline">
        BUSANSO NATION
    </div>


    <div class="line"></div>


    <p class="october">
        <strong>October is here.</strong><br>
        Get ready for a month packed with
        <strong>new series, movies</strong>
        and much more entertainment.
    </p>


    <p class="submessage">
        More stories. More entertainment.
        More reasons to keep watching BUSANSO.
    </p>


    <div class="loading">

        <span>Loading</span>

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</main>


<script>

/* =========================================================
   PREMIUM PARTICLES
   ========================================================= */

const particles =
    document.getElementById("particles");


/* White cinematic particles */

for(let i = 0; i < 32; i++){

    const particle =
        document.createElement("span");

    particle.className = "particle";

    particle.style.left =
        (Math.random() * 100) + "%";

    particle.style.setProperty(
        "--duration",
        (6 + Math.random() * 8) + "s"
    );

    particle.style.setProperty(
        "--delay",
        (-Math.random() * 12) + "s"
    );

    particles.appendChild(particle);
}


/* Gold particles */

for(let i = 0; i < 10; i++){

    const particle =
        document.createElement("span");

    particle.className = "gold-particle";

    particle.style.left =
        (Math.random() * 100) + "%";

    particle.style.setProperty(
        "--duration",
        (7 + Math.random() * 8) + "s"
    );

    particle.style.setProperty(
        "--delay",
        (-Math.random() * 12) + "s"
    );

    particles.appendChild(particle);
}


/* =========================================================
   SMART BUSANSO ENTRY
   ---------------------------------------------------------
   1. Load the existing Supabase client used by BUSANSO.
   2. Silently check for an existing authenticated session.
   3. Confirm that the authenticated user has a BUSANSO profile.
   4. Existing users -> home.html
   5. New/unregistered users -> auth.html
   --------------------------------------------------------- */

const splash = document.getElementById("splash");

let destination = "auth.html";
let authCheckDone = false;
let redirectStarted = false;

const MIN_SPLASH_TIME = 1400;
const MAX_SPLASH_TIME = 3300;
const startedAt = Date.now();


function goToDestination(){
    if(redirectStarted) return;

    redirectStarted = true;

    splash.classList.add("fadeOut");

    setTimeout(() => {
        window.location.replace(destination);
    }, 650);
}


function finishAuthCheck(nextPage){
    destination = nextPage;
    authCheckDone = true;

    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);

    setTimeout(() => {
        goToDestination();
    }, remaining);
}


function loadBusansoSupabaseClient(){

    return new Promise((resolve) => {

        /* If the shared BUSANSO client is already available, use it. */
        if(window.busansoSupabase){
            resolve(window.busansoSupabase);
            return;
        }

        /*
         * Load the same shared Supabase configuration used by
         * the rest of the BUSANSO website.
         *
         * js/supabase.js is expected to create:
         * window.busansoSupabase
         */
        const sharedConfig = document.createElement("script");

        sharedConfig.src = "js/supabase.js";
        sharedConfig.onload = () => {

            /*
             * Give the shared file a moment to initialize its
             * global client before falling back to auth.html.
             */
            let attempts = 0;

            const waitForClient = setInterval(() => {

                attempts++;

                if(window.busansoSupabase){
                    clearInterval(waitForClient);
                    resolve(window.busansoSupabase);
                    return;
                }

                if(attempts >= 20){
                    clearInterval(waitForClient);
                    resolve(null);
                }

            }, 50);
        };

        sharedConfig.onerror = () => resolve(null);

        document.head.appendChild(sharedConfig);
    });
}


async function checkExistingBusansoUser(){

    try{

        const supabaseClient =
            await loadBusansoSupabaseClient();

        /*
         * If the shared client cannot be loaded, fail safely.
         * The user will simply be taken to auth.html.
         */
        if(!supabaseClient){
            finishAuthCheck("auth.html");
            return;
        }


        /* Get the persistent Supabase session silently. */
        const {
            data: sessionData,
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if(sessionError || !sessionData || !sessionData.session){
            finishAuthCheck("auth.html");
            return;
        }


        const session = sessionData.session;
        const user = session.user;


        if(!user || !user.id){
            finishAuthCheck("auth.html");
            return;
        }


        /*
         * First look for the profile by the Supabase Auth UUID.
         * This is the preferred/current BUSANSO relationship.
         */
        let profileResult =
            await supabaseClient
                .from("profiles")
                .select("id,auth_user_id,email,account_status")
                .eq("auth_user_id", user.id)
                .limit(1)
                .maybeSingle();


        /*
         * Some existing accounts may have a profile linked by email
         * but not yet have auth_user_id populated. Check email as a
         * second safe fallback.
         */
        if(
            profileResult.error ||
            !profileResult.data
        ){

            const email =
                (user.email || "").trim().toLowerCase();

            if(email){

                profileResult =
                    await supabaseClient
                        .from("profiles")
                        .select("id,auth_user_id,email,account_status")
                        .ilike("email", email)
                        .limit(1)
                        .maybeSingle();
            }
        }


        /*
         * A valid Supabase session alone is not enough for BUSANSO.
         * We also require an existing profile row before bypassing
         * the login page.
         */
        if(profileResult && profileResult.data){

            /*
             * Keep the identifiers available to existing BUSANSO
             * pages. This does not replace the Supabase session.
             */
            try{
                localStorage.setItem(
                    "auth_user_id",
                    user.id
                );

                localStorage.setItem(
                    "supabase_auth_user_id",
                    user.id
                );

                localStorage.setItem(
                    "user_id",
                    String(profileResult.data.id)
                );
            }catch(storageError){
                console.warn(
                    "BUSANSO localStorage update skipped:",
                    storageError
                );
            }

            finishAuthCheck("account.html");
            return;
        }


        /*
         * Authenticated but no BUSANSO profile:
         * send the user to auth so the existing registration/profile
         * logic can handle the account instead of showing a blank home.
         */
        finishAuthCheck("auth.html");

    }catch(error){

        console.warn(
            "BUSANSO silent login check failed:",
            error
        );

        /* Never block the user on the splash screen. */
        finishAuthCheck("auth.html");
    }
}


/*
 * Start the silent check immediately while the cinematic splash
 * is already visible. The user never sees the login form flash
 * before this decision is made.
 */
checkExistingBusansoUser();


/*
 * Safety timeout.
 *
 * If Supabase or the network takes too long, continue to auth
 * rather than leaving the user permanently stuck on the splash.
 */
setTimeout(() => {

    if(!authCheckDone){
        finishAuthCheck("auth.html");
    }

}, MAX_SPLASH_TIME);


/*
 * Prevent the splash from ever becoming stuck if an unexpected
 * browser/runtime issue occurs.
 */
setTimeout(() => {

    if(!redirectStarted){
        goToDestination();
    }

}, MAX_SPLASH_TIME + 1000);

</script>

</body>
</html>
