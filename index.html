<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUSANSO NATION</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(
                circle at center,
                #242424 0%,
                #101010 42%,
                #050505 100%
            );
    }

    .logo-wrap {
        position: relative;
        width: 190px;
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: logoIn 1.2s ease-out forwards;
    }

    .glow {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        filter: blur(25px);
        animation: pulse 2s ease-in-out infinite;
    }

    .logo {
        position: relative;
        width: 150px;
        height: auto;
        opacity: 0;
        animation: logoShow 1.2s ease-out .15s forwards;
    }

    .title {
        margin-top: 20px;
        color: #fff;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 4px;
        opacity: 0;
        animation: textShow 1s ease-out .7s forwards;
    }

    .tagline {
        margin-top: 10px;
        color: #aaa;
        font-size: 13px;
        letter-spacing: 1px;
        opacity: 0;
        animation: textShow 1s ease-out 1s forwards;
    }

    .loader {
        margin-top: 30px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.12);
        border-top-color: #fff;
        animation:
            spin .9s linear infinite,
            fadeIn 1s ease-out 1.1s forwards;
        opacity: 0;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(.9);
            opacity: .45;
        }

        50% {
            transform: scale(1.12);
            opacity: .8;
        }
    }

    @keyframes logoIn {
        from {
            transform: scale(.7);
        }

        to {
            transform: scale(1);
        }
    }

    @keyframes logoShow {
        from {
            opacity: 0;
            transform: scale(.8);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes textShow {
        from {
            opacity: 0;
            transform: translateY(12px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }
</style>
</head>

<body>

<div class="splash">

    <div class="logo-wrap">
        <div class="glow"></div>

        <img
            class="logo"
            src="https://i.ibb.co/hxgrLF35/BUSANSO-New.png"
            alt="BUSANSO NATION"
        >
    </div>

    <div class="title">
        BUSANSO NATION
    </div>

    <div class="tagline">
        Giving you a stress-free ride
    </div>

    <div class="loader"></div>

</div>

</body>
</html>
