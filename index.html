<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSANSO NATION</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, Helvetica, sans-serif;
}

.splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            #242424 0%,
            #101010 45%,
            #050505 100%
        );
}

.logo-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: zoomIn 1s ease-out;
}

.glow {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    filter: blur(25px);
    animation: pulse 2s ease-in-out infinite;
}

.logo {
    position: relative;
    width: 150px;
    height: auto;
}

.title {
    margin-top: 20px;
    color: white;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 4px;
    animation: fadeUp 1s ease-out .4s both;
}

.tagline {
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
    letter-spacing: 1px;
    animation: fadeUp 1s ease-out .7s both;
}

.loader {
    margin-top: 30px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: white;
    animation: spin .8s linear infinite;
}

@keyframes zoomIn {
    from {
        transform: scale(.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%,100% {
        transform: scale(.9);
        opacity: .4;
    }
    50% {
        transform: scale(1.1);
        opacity: .8;
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="splash">

    <div class="logo-wrap">
        <div class="glow"></div>

        <img
            class="logo"
            src="https://i.ibb.co/qL8vn3jS/busanso-logo-source.png"
            alt="BUSANSO NATION"
        >
    </div>

    <div class="title">
        BUSANSO NATION
    </div>

    <div class="tagline">
        Giving you a stress-free ride
    </div>

    <div class="loader"></div>

</div>

<script>
/*
    BUSANSO TEST STARTUP

    Show splash for 2.5 seconds,
    then continue to authentication.
*/

setTimeout(function () {
    window.location.href = "auth.html";
}, 2500);
</script>

</body>
</html>
