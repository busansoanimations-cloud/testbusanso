<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://dhkfhhybzcxdeoalcfqx.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY'
);

(async () => {
  const user_id = localStorage.getItem("user_id");

  if (!user_id) {
    location.replace("auth.html");
    return;
  }

  // Read the current membership/expiry from Supabase first.
  const { data, error } = await supabase
    .from("profiles")
    .select("membership,expires_at")
    .eq("id", user_id)
    .single();

  if (error || !data) {
    console.error("KIBANDA ACCESS CHECK FAILED:", error);
    location.replace("auth.html");
    return;
  }

  const membership = String(data.membership || "").toLowerCase().trim();
  const expiresAt = data.expires_at;
  const expiryTime = expiresAt ? new Date(expiresAt).getTime() : NaN;
  const now = Date.now();

  // Always synchronize the latest Supabase values into Local Storage.
  localStorage.setItem("membership", membership);
  if (expiresAt) {
    localStorage.setItem("expires_at", expiresAt);
  } else {
    localStorage.removeItem("expires_at");
  }

  console.log("KIBANDA ACCESS:", { membership, expiresAt, now });

  // Only active KIBANDA members may remain on this page.
  if (membership !== "kibanda" || !Number.isFinite(expiryTime) || expiryTime <= now) {
    // Expired/ineligible KIBANDA users go back to the KIBWATCH page.
    location.replace("kibwatch.html");
    return;
  }

  // Mark access as approved only after both checks pass.
  document.documentElement.dataset.kibandaAccess = "granted";
})();
</script>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
'https://dhkfhhybzcxdeoalcfqx.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY'
);

const title=document.getElementById("title")
const meta=document.getElementById("meta")
const synopsis=document.getElementById("synopsis")
const cast=document.getElementById("cast")
const player=document.getElementById("player")

const prevBtn=document.getElementById("prevBtn")
const nextBtn=document.getElementById("nextBtn")
const episodeList=document.getElementById("episodeList")
const episodesBtn=document.getElementById("episodesBtn")
const downloadBtn=document.getElementById("downloadBtn")

const progressBar=document.getElementById("downloadBar")
const progressWrap=document.getElementById("downloadProgress")
const progressText=document.getElementById("progressText")

const params=new URLSearchParams(location.search)
const id=params.get("id")

let serie=null
let idx=0

async function fetchSerie(){

const {data,error}=await supabase
.from('series')
.select('*,episodes(*)')
.eq('id',id)
.single()

if(error||!data){
title.textContent="Series not found"
return
}

serie=data

// Arrange episodes by episode_number (lowest to highest).
if (Array.isArray(serie.episodes)) {
  serie.episodes = serie.episodes.map((ep, originalIndex) => ({...ep, __originalIndex: originalIndex})).sort((a,b) => {
    const an = Number(a.episode_number), bn = Number(b.episode_number);
    if (Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
    if (Number.isFinite(an)) return -1;
    if (Number.isFinite(bn)) return 1;
    return a.__originalIndex - b.__originalIndex;
  });
}
populateSeries()

}

function populateSeries(){

title.textContent=serie.title
meta.textContent=`${serie.genre} • ${serie.country} • ${serie.year}`
synopsis.textContent=serie.synopsis||""

cast.innerHTML=""
serie.cast?.forEach(c=>{
const span=document.createElement("span")
span.textContent=c
cast.appendChild(span)
})

episodeList.innerHTML=""
serie.episodes.forEach((ep,i)=>{
const div=document.createElement("div")
div.className="episode"
const episodeNumber = Number.isFinite(Number(ep.episode_number)) ? ep.episode_number : i+1;
div.textContent=`Episode ${episodeNumber}`
div.onclick=()=>playEpisode(i)
episodeList.appendChild(div)
})

playEpisode(0)

}

/* ✅ FIXED VIDEO NORMALIZER */
function normalizeVideo(url){

if(!url) return ""

/* =========================
   YOUTUBE
========================= */
if(
  url.includes("youtube.com") ||
  url.includes("youtu.be")
){

  let id = ""

  // youtu.be/xxxx
  if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1].split("?")[0]
  }

  // youtube watch?v=
  else if(url.includes("watch?v=")){
    id = new URL(url).searchParams.get("v")
  }

  // already embed
  else if(url.includes("/embed/")){
    return url
  }

  if(id){
    return `https://www.youtube.com/embed/${id}`
  }
}

/* =========================
   VIMEO
========================= */
if(url.includes("vimeo.com")){

  // already player link
  if(url.includes("player.vimeo.com")){
    return url
  }

  const match = url.match(/vimeo\.com\/(\d+)/)

  if(match && match[1]){
    return `https://player.vimeo.com/video/${match[1]}`
  }
}

/* =========================
   GOOGLE DRIVE
========================= */
if(url.includes("drive.google.com")){

  // already preview
  if(url.includes("/preview")){
    return url
  }

  let id = ""

  // /d/FILE_ID/
  const match = url.match(/\/d\/([^\/]+)/)

  if(match && match[1]){
    id = match[1]
  }

  // open?id=
  else{
    id = new URL(url).searchParams.get("id")
  }

  if(id){
    return `https://drive.google.com/file/d/${id}/preview`
  }
}

/* =========================
   EVERYTHING ELSE
========================= */
return url
}

/* ✅ FIXED DOWNLOAD LINK */
function getDownloadLink(url){

if(url.includes("drive.google.com")){
let match=url.match(/\/d\/(.*?)\//)
let id=match?match[1]:new URL(url).searchParams.get("id")
if(id) return `https://drive.google.com/uc?export=download&id=${id}`
}

return url
}

/* ✅ YOUTUBE CHECK */
function isYouTube(url){
return /youtube\.com|youtu\.be/.test(url)
}

function simulateProgress(callback){

progressWrap.style.display="block"
progressText.style.display="block"

let progress=0

const interval=setInterval(()=>{
progress+=Math.random()*20
if(progress>=100){
progress=100
clearInterval(interval)
setTimeout(()=>{
progressWrap.style.display="none"
progressText.style.display="none"
callback()
},500)
}
progressBar.style.width=progress+"%"
progressText.textContent=`Preparing download... ${Math.floor(progress)}%`
},200)

}

function playEpisode(i){

idx=i
const ep=serie.episodes[i]

const videoURL=normalizeVideo(ep.video)
player.innerHTML=`<iframe src="${videoURL}" allowfullscreen></iframe>`

const episodeNumber = Number.isFinite(Number(ep.episode_number)) ? ep.episode_number : i+1;
downloadBtn.textContent=`Download Episode ${episodeNumber}`

/* ✅ AUTO HIDE FOR YOUTUBE */
if(isYouTube(ep.video)){
downloadBtn.style.display="none"
}else{
downloadBtn.style.display="block"
downloadBtn.onclick=()=>{
const link=getDownloadLink(ep.video)
simulateProgress(()=>{
window.open(link,"_blank")
})
}
}

document.querySelectorAll(".episode")
.forEach((el,j)=>el.classList.toggle("active",i===j))

prevBtn.disabled=i===0
nextBtn.disabled=i===serie.episodes.length-1

}

prevBtn.onclick=()=>idx>0&&playEpisode(idx-1)
nextBtn.onclick=()=>idx<serie.episodes.length-1&&playEpisode(idx+1)

episodesBtn.onclick=()=>{
episodeList.style.display=
episodeList.style.display==="none"?"grid":"none"
}

fetchSerie()

</script>
