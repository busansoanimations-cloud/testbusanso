



<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BUSANSO NATION</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="6d418a15bef62e99f15abae082c777e0">

<!-- PWA REQUIRED -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- END PWA -->

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,rgba(34,197,94,.22),transparent 35%),
    radial-gradient(circle at 0% 100%,rgba(16,185,129,.14),transparent 40%),
    linear-gradient(145deg,#020604,#07130d 55%,#020604);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}


.onboarding{
  width:min(92%,430px);
  position:relative;
  z-index:5;
  opacity:1;
  transform:none;
}

.step{
  display:none;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(134,239,172,.16);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:28px;
  padding:34px 28px 28px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.step.active{
  display:block;
  animation:stepIn .35s ease;
}

.step-number{
  color:#4ade80;
  font-size:.78rem;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:14px;
}

h1{
  font-size:clamp(1.7rem,7vw,2.25rem);
  line-height:1.1;
  margin-bottom:10px;
}

.prompt{
  color:#a7b5ad;
  line-height:1.5;
  margin-bottom:24px;
}

input{
  width:100%;
  padding:17px 18px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.14);
  outline:none;
  background:rgba(0,0,0,.35);
  color:#fff;
  font-size:17px;
  transition:.2s;
}

input:focus{
  border-color:#4ade80;
  box-shadow:0 0 0 4px rgba(34,197,94,.10);
}

input::placeholder{
  color:#718078;
}

.next-btn{
  width:100%;
  padding:16px;
  margin-top:16px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#031008;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.next-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.next-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.back-btn{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:0;
  background:transparent;
  color:#86efac;
  cursor:pointer;
  font-size:14px;
}

.error{
  min-height:20px;
  margin-top:10px;
  color:#fca5a5;
  font-size:14px;
}

.success{
  min-height:20px;
  margin-top:10px;
  color:#86efac;
  font-size:14px;
}

</style>
</head>

<body>
<main class="onboarding">

  <section class="step active" id="nameStep">
    <div class="step-number">Step 1 of 2</div>
    <h1>What's your name?</h1>
    <p class="prompt">Tell us what you'd like us to call you on Busanso Nation.</p>
    <input id="userName" type="text" maxlength="80"
           placeholder="Enter your name" autocomplete="name">
    <div id="nameError" class="error"></div>
    <button class="next-btn" id="nameNext">NEXT</button>
  </section>

  <section class="step" id="phoneStep">
    <div class="step-number">Step 2 of 2</div>
    <h1>What's your number?</h1>
    <p class="prompt">Enter your 10-digit WhatsApp number starting with 0.</p>
    <input id="userPhone" type="tel" inputmode="numeric" maxlength="10"
           placeholder="0700000000" autocomplete="tel">
    <div id="phoneError" class="error"></div>
    <div id="saveMessage" class="success"></div>
    <button class="next-btn" id="finishBtn">CONTINUE</button>
    <button class="back-btn" id="backBtn">← Back</button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dhkfhhybzcxdeoalcfqx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const nameStep = document.getElementById("nameStep");
const phoneStep = document.getElementById("phoneStep");
const userName = document.getElementById("userName");
const userPhone = document.getElementById("userPhone");
const nameError = document.getElementById("nameError");
const phoneError = document.getElementById("phoneError");
const saveMessage = document.getElementById("saveMessage");
const nameNext = document.getElementById("nameNext");
const finishBtn = document.getElementById("finishBtn");
const backBtn = document.getElementById("backBtn");

function getDeviceID(){
  let id = localStorage.getItem("device_id");

  if(!id){
    id = (crypto.randomUUID
      ? crypto.randomUUID()
      : "device-" + Date.now() + "-" + Math.random().toString(36).slice(2));

    localStorage.setItem("device_id", id);
  }

  return id;
}

function saveLocalProfile(profile){
  localStorage.setItem("user_id", profile.id || "");
  localStorage.setItem("name", profile.name || "");
  localStorage.setItem("whatsapp_number", profile.whatsapp_number || "");
  localStorage.setItem("device_id", profile.device_id || getDeviceID());
  localStorage.setItem("account_status", profile.account_status || "active");
  localStorage.setItem("isLoggedIn", "true");
  localStorage.setItem("loggedIn", "true");
  localStorage.setItem("profile", JSON.stringify(profile));

  if(profile.plan) localStorage.setItem("plan", profile.plan);
  if(profile.membership) localStorage.setItem("membership", profile.membership);
}

function goHome(){
  location.replace("home.html");
}

async function checkExistingProfile(){
  const deviceId = getDeviceID();

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("device_id", deviceId)
    .eq("account_status", "active")
    .maybeSingle();

  if(!error && data){
    saveLocalProfile(data);
    goHome();
    return true;
  }

  return false;
}

async function checkNameAvailable(name){
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id")
    .ilike("name", name)
    .limit(1);

  if(error) throw error;
  return !data || data.length === 0;
}

nameNext.addEventListener("click", async () => {
  const name = userName.value.trim();

  nameError.textContent = "";

  if(name.length < 2){
    nameError.textContent = "Please enter at least 2 characters.";
    userName.focus();
    return;
  }

  nameNext.disabled = true;
  nameNext.textContent = "CHECKING...";

  try{
    const available = await checkNameAvailable(name);

    if(!available){
      nameError.textContent = "That name is already used. Please choose another name.";
      userName.focus();
      return;
    }

    nameStep.classList.remove("active");
    phoneStep.classList.add("active");
    userPhone.focus();

  }catch(error){
    console.error(error);
    nameError.textContent = "We couldn't check the name. Please try again.";
  }finally{
    nameNext.disabled = false;
    nameNext.textContent = "NEXT";
  }
});

userPhone.addEventListener("input", () => {
  userPhone.value = userPhone.value.replace(/\D/g,"").slice(0,10);
  phoneError.textContent = "";
});

backBtn.addEventListener("click", () => {
  phoneStep.classList.remove("active");
  nameStep.classList.add("active");
  userName.focus();
});

finishBtn.addEventListener("click", async () => {
  const name = userName.value.trim();
  const phone = userPhone.value.trim();
  const deviceId = getDeviceID();

  phoneError.textContent = "";
  saveMessage.textContent = "";

  if(!/^0\d{9}$/.test(phone)){
    phoneError.textContent = "Enter exactly 10 digits and make sure the number starts with 0.";
    userPhone.focus();
    return;
  }

  finishBtn.disabled = true;
  finishBtn.textContent = "CREATING PROFILE...";

  try{
    // Re-check the name immediately before inserting, preventing a
    // duplicate if another user claimed it after Step 1.
    const available = await checkNameAvailable(name);

    if(!available){
      phoneError.textContent = "That name was just taken. Please go back and choose another.";
      finishBtn.disabled = false;
      finishBtn.textContent = "CONTINUE";
      return;
    }

    const { data, error } = await supabaseClient
      .from("profiles")
      .insert({
        name: name,
        whatsapp_number: phone,
        device_id: deviceId,
        account_status: "active"
      })
      .select("*")
      .single();

    if(error){
      console.error(error);

      if(
        error.message &&
        (error.message.toLowerCase().includes("duplicate") ||
         error.message.toLowerCase().includes("unique"))
      ){
        phoneError.textContent = "That name is already in use. Please go back and choose another.";
      }else{
        phoneError.textContent = "We couldn't create your profile. Please try again.";
      }

      return;
    }

    saveLocalProfile(data);
    saveMessage.textContent = "Profile created. Welcome to Busanso Nation!";
    finishBtn.textContent = "DONE";

    setTimeout(goHome, 500);

  }catch(error){
    console.error(error);
    phoneError.textContent = "Something went wrong. Please try again.";
  }finally{
    if(finishBtn.textContent !== "DONE"){
      finishBtn.disabled = false;
      finishBtn.textContent = "CONTINUE";
    }
  }
});

window.addEventListener("load", async () => {
  // Existing device-bound profiles go straight to the site.
  await checkExistingProfile();
});
</script>

<script>
/* Register service worker */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
