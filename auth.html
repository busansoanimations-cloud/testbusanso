<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070707">

<title>Sign In | BUSANSO Nation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: "Inter", Arial, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 50% 10%, rgba(212,175,55,.16), transparent 35%),
        radial-gradient(circle at 10% 90%, rgba(212,175,55,.07), transparent 30%),
        #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

.bg-glow {
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(212,175,55,.055);
    filter: blur(90px);
    pointer-events: none;
}

.bg-glow.one {
    top: -190px;
    left: -150px;
}

.bg-glow.two {
    right: -180px;
    bottom: -190px;
}

.auth-wrapper {
    width: 100%;
    max-width: 455px;
    padding: 20px;
    position: relative;
    z-index: 2;
}

.auth-card {
    width: 100%;
    padding: 34px 28px 28px;
    border-radius: 28px;
    border: 1px solid rgba(212,175,55,.28);
    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.98),
            rgba(8,8,8,.99)
        );
    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        0 0 45px rgba(212,175,55,.07);
    text-align: center;
    backdrop-filter: blur(18px);
}

.logo-wrap {
    width: 105px;
    height: 105px;
    margin: 0 auto 20px;
    padding: 4px;
    border-radius: 50%;
    background:
        linear-gradient(
            135deg,
            #fff0a3,
            #d4af37,
            #8c6817,
            #f5da70
        );
    box-shadow:
        0 0 28px rgba(212,175,55,.24);
}

.logo-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    border-radius: 50%;
    background: #080808;
}

.brand {
    margin-bottom: 8px;
    color: #d4af37;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
}

h1 {
    margin-bottom: 10px;
    font-size: 28px;
    line-height: 1.2;
    font-weight: 800;
}

.subtitle {
    max-width: 340px;
    margin: 0 auto 28px;
    color: #a5a5a5;
    font-size: 14px;
    line-height: 1.6;
}

.google-btn {
    width: 100%;
    min-height: 58px;
    padding: 0 18px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 15px;
    background: #fff;
    color: #161616;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        opacity .18s ease;
}

.google-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 13px 34px rgba(0,0,0,.42);
}

.google-btn:active {
    transform: translateY(0);
}

.google-btn:disabled {
    opacity: .7;
    cursor: wait;
    transform: none;
}

.google-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 18px;
    color: #666;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: rgba(255,255,255,.08);
}

.status {
    min-height: 20px;
    color: #8f8f8f;
    font-size: 13px;
    line-height: 1.5;
}

.status.success {
    color: #d4af37;
}

.status.error {
    color: #ff7777;
}

.security {
    margin-top: 23px;
    padding: 14px 15px;
    border: 1px solid rgba(212,175,55,.11);
    border-radius: 13px;
    background: rgba(212,175,55,.045);
    color: #858585;
    font-size: 11px;
    line-height: 1.55;
}

.security strong {
    color: #c9a52f;
}

.footer {
    margin-top: 23px;
    color: #505050;
    font-size: 10px;
    line-height: 1.5;
}

.footer span {
    color: #80691f;
}

.spinner {
    width: 19px;
    height: 19px;
    border: 2px solid rgba(0,0,0,.16);
    border-top-color: #333;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 480px) {

    .auth-wrapper {
        padding: 14px;
    }

    .auth-card {
        padding: 30px 21px 24px;
        border-radius: 23px;
    }

    .logo-wrap {
        width: 94px;
        height: 94px;
    }

    h1 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 13px;
    }

    .google-btn {
        min-height: 56px;
    }
}
</style>
</head>

<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>

<div class="auth-wrapper">

    <main class="auth-card">

        <div class="logo-wrap">
            <img
                src="https://i.ibb.co/qL8vn3jS/busanso-logo-source.png"
                alt="BUSANSO Nation"
            >
        </div>

        <div class="brand">BUSANSO NATION</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in securely with your Google account
            and continue watching on BUSANSO.
        </p>

        <button
            id="googleBtn"
            class="google-btn"
            type="button"
        >

            <svg
                class="google-icon"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                    fill="#4285F4"
                    d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.57-5.17 3.57-8.64z"
                />
                <path
                    fill="#34A853"
                    d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.87-3c-1.07.72-2.44 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.97H1.25v3.09A12 12 0 0 0 12 24z"
                />
                <path
                    fill="#FBBC05"
                    d="M5.25 14.28A7.22 7.22 0 0 1 4.87 12c0-.79.14-1.56.38-2.28V6.63H1.25A12 12 0 0 0 0 12c0 1.94.46 3.77 1.25 5.37l4-3.09z"
                />
                <path
                    fill="#EA4335"
                    d="M12 4.75c1.77 0 3.36.61 4.61 1.81l3.45-3.45C17.95 1.12 15.24 0 12 0A12 12 0 0 0 1.25 6.63l4 3.09C6.2 6.87 8.86 4.75 12 4.75z"
                />
            </svg>

            <span id="googleText">Continue with Google</span>

        </button>

        <div class="divider">
            Secure Sign In
        </div>

        <div
            id="status"
            class="status"
            aria-live="polite"
        ></div>

        <div class="security">
            <strong>🔒 Secure authentication</strong><br>
            BUSANSO uses Google authentication.
            Your Google password is never stored by BUSANSO.
        </div>

        <div class="footer">
            © BUSANSO Nation<br>
            <span>
                Your home of African &amp; international entertainment
            </span>
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================================
   BUSANSO SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoiZGhrZmh5YnpjeGRlb2FsY2ZxeCIsImlhdCI6MTc3MjUzNDE1MSwiZXhwIjoyMDg4MTEwMTUxfQ.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   ELEMENTS
   ========================================================= */

const googleBtn =
    document.getElementById("googleBtn");

const googleText =
    document.getElementById("googleText");

const statusBox =
    document.getElementById("status");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

    statusBox.textContent = message;

    statusBox.className =
        "status" + (type ? " " + type : "");
}


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

async function googleLogin() {

    googleBtn.disabled = true;

    googleText.textContent =
        "Connecting to Google...";

    setStatus(
        "Opening secure Google sign-in..."
    );

    try {

        /*
         * IMPORTANT:
         *
         * No profile is created here.
         * No profile information is stored in localStorage.
         *
         * Supabase Auth owns the authentication session.
         */

        const redirectUrl =
            window.location.origin +
            window.location.pathname;

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithOAuth({

            provider: "google",

            options: {
                redirectTo: redirectUrl
            }

        });

        if (error) {
            throw error;
        }

        /*
         * Supabase normally redirects the browser
         * automatically to Google.
         */

    } catch (error) {

        console.error(
            "BUSANSO GOOGLE AUTH ERROR:",
            error
        );

        setStatus(
            error?.message ||
            "Google sign-in could not be started.",
            "error"
        );

        googleBtn.disabled = false;

        googleText.textContent =
            "Continue with Google";
    }
}


/* =========================================================
   COMPLETE AUTHENTICATION
   ========================================================= */

async function completeAuthentication() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {

            console.error(
                "SUPABASE SESSION ERROR:",
                error
            );

            return;
        }

        const session =
            data?.session;

        if (!session?.user) {
            return;
        }

        /*
         * At this point the Google/Supabase session exists.
         *
         * We deliberately DO NOT:
         *
         * - create a profile
         * - modify profiles
         * - save profile ID
         * - save membership
         * - save expiry
         * - save paid_status
         * - save activePIN
         * - save legacy user_id
         *
         * The application will resolve the profile using:
         *
         * profiles.auth_user_id = Supabase Auth user.id
         */

        console.log(
            "BUSANSO AUTHENTICATED:",
            session.user.id
        );

        setStatus(
            "Signed in successfully. Opening BUSANSO...",
            "success"
        );

        googleBtn.disabled = true;

        googleText.textContent =
            "Opening BUSANSO...";

        /*
         * Give Supabase a moment to finish persisting
         * the browser session.
         */

        setTimeout(() => {

            window.location.replace(
                "home.html"
            );

        }, 400);

    } catch (error) {

        console.error(
            "BUSANSO AUTH COMPLETION ERROR:",
            error
        );
    }
}


/* =========================================================
   AUTH STATE CHANGES
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        console.log(
            "BUSANSO AUTH EVENT:",
            event
        );

        if (
            event === "SIGNED_IN" &&
            session?.user
        ) {

            /*
             * Do not perform database profile creation here.
             * The existing profile is resolved by auth_user_id
             * on the application pages.
             */

            setStatus(
                "Signed in successfully. Opening BUSANSO...",
                "success"
            );

            googleBtn.disabled = true;

            googleText.textContent =
                "Opening BUSANSO...";

            setTimeout(() => {

                window.location.replace(
                    "auth.html"
                );

            }, 400);
        }
    }
);


/* =========================================================
   BUTTON
   ========================================================= */

googleBtn.addEventListener(
    "click",
    googleLogin
);


/* =========================================================
   CHECK FOR EXISTING SESSION
   ========================================================= */

completeAuthentication();

</script>

</body>
</html>
