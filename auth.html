<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Busanso - Sign In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;

            font-family: Arial, sans-serif;

            align-items: center;

        }

        .box {
            width: 100%;
            max-width: 430px;

            background: #151515;
            border: 1px solid #333;
            border-radius: 16px;

            padding: 28px;

            text-align: center;

            box-shadow:
                0 0 30px rgba(255,193,7,.08);
        }

        h1 {
            margin: 0 0 8px;

            color: #ffc107;

            font-size: 28px;
        }

        .subtitle {
            color: #aaa;

            font-size: 14px;

            margin-bottom: 25px;
        }

        #googleBtn {
            width: 100%;

            padding: 15px;

            border: 0;

            border-radius: 10px;

            background: #fff;

            color: #222;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        #googleBtn:disabled {
            opacity: .6;

            cursor: wait;
        }

        #status {
            margin-top: 20px;

            padding: 13px;

            border-radius: 9px;

            background: #0d0d0d;

            border: 1px solid #333;

            font-size: 14px;

            line-height: 1.5;

            word-break: break-word;
        }

        .success {
            color: #65d66f;
        }

        .error {
            color: #ff6565;
        }

        .waiting {
            color: #ffc107;
        }

        #details {
            display: none;

            margin-top: 15px;

            padding: 12px;

            background: #050505;

            border: 1px solid #333;

            border-radius: 8px;

            color: #aaa;

            font-family: monospace;

            font-size: 11px;

            text-align: left;

            white-space: pre-wrap;

            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>BUSANSO</h1>

    <div class="subtitle">
        Sign in with your Google account
    </div>

    <button
        id="googleBtn"
        type="button">
        Continue with Google
    </button>

    <div id="status">
        Checking authentication...
    </div>

    <div id="details"></div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsImtpZCI6ImFlYTVlZDJmLWZhOWItNDlhNy05MjUxLTRiZDc2NjM0MCIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL2Roa2ZoaHliemN4ZGVvYWxjZnF4LnN1cGFiYXNlLmNvI2F1dGgiLCJzdWIiOiI2Y2E5MDMyOC0xYzUyLTQyNTAtYTEzNC0wNDkzNjZjNDUzODciLCJhdWQiOiJhdXRoZW50aWNhdGVkIn0";


/*
 * IMPORTANT:
 *
 * Use the actual project anon key.
 *
 * The key above is intentionally NOT used.
 * The correct key is assigned below.
 */

const BUSANSO_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoiZGhrZmh5YnpjeGRlb2FsY2ZxeCIsImlhdCI6MTc3MjUzNDE1MSwiZXhwIjoyMDg4MTEwMTUxfQ.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY";


/* =====================================================
   ELEMENTS
   ===================================================== */

const googleBtn =
    document.getElementById("googleBtn");

const statusBox =
    document.getElementById("status");

const detailsBox =
    document.getElementById("details");


/* =====================================================
   SUPABASE CLIENT
   ===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        BUSANSO_ANON_KEY,
        {
            auth: {

                persistSession: true,

                autoRefreshToken: true,

                /*
                 * THIS IS THE IMPORTANT FIX.
                 *
                 * Google is returning:
                 *
                 * #access_token=...
                 * #refresh_token=...
                 *
                 * Supabase must process that hash.
                 */

                detectSessionInUrl: true,

                flowType: "implicit"
            }
        }
    );


/* =====================================================
   STATUS
   ===================================================== */

function status(message, type) {

    statusBox.className =
        type || "";

    statusBox.textContent =
        message;
}


function detail(message) {

    detailsBox.style.display =
        "block";

    detailsBox.textContent +=
        message + "\n";

    console.log(message);
}


/* =====================================================
   HOME
   ===================================================== */

function goHome() {

    const homeUrl =
        new URL(
            "home.html",
            window.location.href
        ).href;

    detail(
        "Redirecting to: " +
        homeUrl
    );

    window.location.replace(
        homeUrl
    );
}


/* =====================================================
   GOOGLE LOGIN
   ===================================================== */

async function signInWithGoogle() {

    googleBtn.disabled =
        true;

    detailsBox.textContent = "";

    status(
        "Opening Google account selection...",
        "waiting"
    );


    try {

        const redirectTo =
            new URL(
                "auth.html",
                window.location.href
            ).href;


        detail(
            "Redirect URL: " +
            redirectTo
        );


        const result =
            await supabaseClient.auth
                .signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            redirectTo,

                        queryParams: {

                            prompt:
                                "select_account"
                        }
                    }
                });


        if (result.error) {

            status(
                "Google sign-in could not start.",
                "error"
            );

            detail(
                result.error.message
            );

            googleBtn.disabled =
                false;

            return;
        }


        detail(
            "Supabase accepted Google OAuth."
        );


        /*
         * Supabase now sends the browser
         * to Google automatically.
         */

    } catch (error) {

        status(
            "Google sign-in error.",
            "error"
        );

        detail(
            error.message ||
            String(error)
        );

        googleBtn.disabled =
            false;
    }
}


/* =====================================================
   BUTTON
   ===================================================== */

googleBtn.addEventListener(
    "click",
    signInWithGoogle
);


/* =====================================================
   AUTH STATE LISTENER
   ===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        detail(
            "AUTH EVENT: " +
            event
        );


        if (!session) {
            return;
        }


        detail(
            "SESSION RECEIVED."
        );


        detail(
            "User ID: " +
            (
                session.user?.id ||
                "(none)"
            )
        );


        detail(
            "Email: " +
            (
                session.user?.email ||
                "(none)"
            )
        );


        detail(
            "Provider: " +
            (
                session.user?.app_metadata?.provider ||
                "(none)"
            )
        );


        status(
            "Google sign-in successful. Opening Busanso...",
            "success"
        );


        /*
         * Supabase has now processed the
         * access token and persisted the session.
         */

        setTimeout(
            goHome,
            800
        );
    }
);


/* =====================================================
   INITIAL SESSION CHECK
   ===================================================== */

async function checkSession() {

    try {

        detail(
            "Checking Supabase session..."
        );


        const result =
            await supabaseClient.auth
                .getSession();


        if (result.error) {

            detail(
                "getSession error: " +
                result.error.message
            );

            status(
                "Ready to sign in."
            );

            googleBtn.disabled =
                false;

            return;
        }


        const session =
            result.data?.session;


        if (session) {

            detail(
                "SESSION ALREADY EXISTS."
            );


            detail(
                "User ID: " +
                (
                    session.user?.id ||
                    "(none)"
                )
            );


            detail(
                "Email: " +
                (
                    session.user?.email ||
                    "(none)"
                )
            );


            status(
                "Signed in. Opening Busanso...",
                "success"
            );


            setTimeout(
                goHome,
                800
            );


        } else {

            detail(
                "No existing session."
            );


            status(
                "Ready. Press Continue with Google."
            );


            googleBtn.disabled =
                false;
        }


    } catch (error) {

        detail(
            "Session check error: " +
            (
                error.message ||
                String(error)
            )
        );


        status(
            "Ready to sign in."
        );


        googleBtn.disabled =
            false;
    }
}


/* =====================================================
   START
   ===================================================== */

checkSession();

</script>

</body>
</html>
