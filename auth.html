<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUSANSO — Sign Into</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at top,#3b2a08 0%,#171005 45%,#070707 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
}

.card{
    width:100%;
    max-width:430px;
    padding:35px 25px 30px;
    text-align:center;
    border-radius:22px;
    background:linear-gradient(145deg,#2a200c,#0d0d0d);
    border:1px solid rgba(212,175,55,.45);
    box-shadow:0 0 40px rgba(212,175,55,.14);
}

.logo{
    width:180px;
    max-width:75%;
    margin:0 auto 22px;
    display:block;
}

h1{
    margin:0;
    color:#f4d77a;
    font-size:29px;
}

.subtitle{
    margin:10px 0 28px;
    color:#bbb;
    font-size:15px;
    line-height:1.5;
}

#googleBtn{
    width:100%;
    min-height:58px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#f8df83,#c89b28);
    color:#111;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

#googleBtn:disabled{
    opacity:.55;
}

#status{
    min-height:25px;
    margin-top:20px;
    color:#ccc;
    font-size:14px;
    line-height:1.5;
}

.error{
    color:#ff8585!important;
}

.small{
    margin-top:22px;
    color:#666;
    font-size:12px;
}
</style>

</head>

<body>

<div class="card">

<img
 class="logo"
 src="https://busansoanimations-cloud.github.io/testbusanso/images/busanso-logo-source.png"
 alt="BUSANSO">

<h1>Welcome to BUSANSO</h1>

<div class="subtitle">
Sign in with Google to continue watching.
</div>

<button
 id="googleBtn"
 type="button"> <span style="font-size:21px;margin-right:8px;">G</span>
Continue with Google </button>

<div id="status"></div>

<div class="small">
Secure sign-in powered by Google
</div>

</div>

<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
   ============================================================ */

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";


/* ============================================================
   PAGE MODE
   ============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

const isAppMode =
    params.get("app") === "1";


/* ============================================================
   REDIRECT
   ============================================================ */

const WEB_REDIRECT =
    "https://busansoanimations-cloud.github.io/testbusanso/auth.html";

const APP_REDIRECT =
    "busanso://auth/callback";

const REDIRECT_URL =
    isAppMode
        ? APP_REDIRECT
        : WEB_REDIRECT;


/* ============================================================
   ELEMENTS
   ============================================================ */

const button =
    document.getElementById("googleBtn");

const status =
    document.getElementById("status");


function showStatus(message,error){

    status.textContent =
        message || "";

    status.className =
        error ? "error" : "";
}


/* ============================================================
   CHECK SUPABASE LIBRARY
   ============================================================ */

if(
    !window.supabase ||
    !window.supabase.createClient
){

    showStatus(
        "Unable to load the sign-in service.",
        true
    );

    console.error(
        "Supabase JavaScript library is missing."
    );

    return;
}


/* ============================================================
   CREATE SUPABASE CLIENT
   ============================================================ */

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                flowType:"pkce",
                detectSessionInUrl:!isAppMode,
                storageKey:"busanso-auth"
            }
        }
    );


/* ============================================================
   GOOGLE BUTTON
   ============================================================ */

button.addEventListener(
    "click",
    async function(){

        console.log(
            "BUSANSO GOOGLE BUTTON CLICKED"
        );

        button.disabled = true;

        showStatus(
            "Connecting to Google..."
        );

        try{

            const response =
                await client.auth.signInWithOAuth({

                    provider:"google",

                    options:{

                        redirectTo:
                            REDIRECT_URL,

                        queryParams:{
                            prompt:"select_account"
                        }

                    }

                });


            console.log(
                "Supabase OAuth response:",
                response
            );


            if(response.error){

                throw response.error;
            }


            /*
             * Normally Supabase redirects the browser
             * automatically. This message is only visible
             * if something prevents that redirect.
             */

            if(
                response.data &&
                response.data.url
            ){

                console.log(
                    "OAuth URL received:",
                    response.data.url
                );

            }

        }catch(error){

            console.error(
                "BUSANSO GOOGLE ERROR:",
                error
            );

            showStatus(
                error.message ||
                "Google sign-in could not start.",
                true
            );

            button.disabled = false;
        }

    }
);


/* ============================================================
   WEB SESSION COMPLETION
   ============================================================ */

if(!isAppMode){

    client.auth.onAuthStateChange(
        async function(event,session){

            console.log(
                "BUSANSO AUTH EVENT:",
                event
            );

            if(
                event === "SIGNED_IN" &&
                session &&
                session.user
            ){

                showStatus(
                    "Login successful. Opening BUSANSO..."
                );

                try{

                    const user =
                        session.user;

                    localStorage.setItem(
                        "busanso_user",
                        JSON.stringify(user)
                    );


                    /*
                     * Look for existing profile.
                     */

                    let profileResult =
                        await client
                            .from("profiles")
                            .select("*")
                            .eq(
                                "auth_user_id",
                                user.id
                            )
                            .maybeSingle();


                    let profile =
                        profileResult.data;


                    /*
                     * Create profile if necessary.
                     */

                    if(!profile){

                        const metadata =
                            user.user_metadata || {};

                        const name =
                            metadata.full_name ||
                            metadata.name ||
                            (
                                user.email
                                    ? user.email.split("@")[0]
                                    : "BUSANSO USER"
                            );

                        const avatar =
                            metadata.avatar_url ||
                            metadata.picture ||
                            null;


                        const insertResult =
                            await client
                                .from("profiles")
                                .insert({

                                    auth_user_id:user.id,
                                    email:user.email || null,
                                    name:name,
                                    avatar_url:avatar

                                })
                                .select("*")
                                .single();


                        if(
                            insertResult.data
                        ){

                            profile =
                                insertResult.data;

                        }else{

                            /*
                             * Trigger may already have
                             * created the profile.
                             */

                            const retry =
                                await client
                                    .from("profiles")
                                    .select("*")
                                    .eq(
                                        "auth_user_id",
                                        user.id
                                    )
                                    .maybeSingle();

                            profile =
                                retry.data;
                        }
                    }


                    if(profile){

                        localStorage.setItem(
                            "busanso_profile",
                            JSON.stringify(profile)
                        );
                    }


                    window.location.href =
                        "home.html";

                }catch(error){

                    console.error(
                        "Profile completion error:",
                        error
                    );

                    showStatus(
                        error.message ||
                        "Login succeeded but profile loading failed.",
                        true
                    );

                    button.disabled = false;
                }
            }

        }
    );

}


/* ============================================================
   STARTUP MESSAGE
   ============================================================ */

console.log(
    "BUSANSO AUTH READY"
);

console.log(
    "App mode:",
    isAppMode
);

console.log(
    "Redirect URL:",
    REDIRECT_URL
);

showStatus("");

})();

</script>

</body>
</html>
