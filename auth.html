<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BUSANSO NATION</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #242424 0%, #0d0d0d 48%, #050505 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(20, 20, 20, 0.96);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      padding: 38px 28px 32px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,.55);
    }

    .logo {
      width: 145px;
      max-width: 70%;
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .description {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .google-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform .15s ease, opacity .15s ease;
    }

    .google-btn:hover {
      transform: translateY(-1px);
    }

    .google-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .google-icon {
      width: 21px;
      height: 21px;
    }

    .status {
      min-height: 24px;
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
    }

    .status.error {
      color: #ff7777;
    }

    .status.success {
      color: #75e6a5;
    }

    .loading {
      display: none;
      margin: 22px auto 0;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .small {
      margin-top: 25px;
      color: #666;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      class="logo"
      src="https://i.ibb.co/hxgrLF35/BUSANSO-New.png"
      alt="BUSANSO NATION"
    >

    <h1>Welcome to BUSANSO NATION</h1>

    <div class="description">
      Sign in with Google to continue.
      Your account will remain connected while you move through the BUSANSO website.
    </div>

    <button id="googleBtn" class="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4"
          d="M21.35 12.23c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>
        <path fill="#34A853"
          d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.75z"/>
        <path fill="#FBBC05"
          d="M6.54 13.84A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.27.31-1.84V7.63H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.37l3.24-2.53z"/>
        <path fill="#EA4335"
          d="M12 6.13c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.09 14.63 2.25 12 2.25A9.75 9.75 0 0 0 3.3 7.63l3.24 2.53C7.31 7.85 9.46 6.13 12 6.13z"/>
      </svg>

      Continue with Google
    </button>

    <div id="loading" class="loading"></div>

    <div id="status" class="status"></div>

    <div class="small">
      BUSANSO NATION
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /*
      ============================================================
      BUSANSO TEST AUTH
      ============================================================

      This page is intentionally self-contained.

      It does NOT depend on:
        - old auth.js
        - old supabase.js
        - old config.js
        - old localStorage authentication
        - device_id
        - PINs
        - legacy login logic

      The purpose is simply:

        Google
          ↓
        Supabase Auth
          ↓
        authenticated session
          ↓
        home.html

      Once the Google session exists, the other Busanso pages
      should be able to see the same Supabase session.
    */


    const SUPABASE_URL =
      "https://dhkfhhybzcxdeoalcfqx.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const googleBtn =
      document.getElementById("googleBtn");

    const statusBox =
      document.getElementById("status");

    const loading =
      document.getElementById("loading");


    function status(message, type = "") {

      statusBox.textContent = message;

      statusBox.className =
        "status " + type;
    }


    function setLoading(value) {

      googleBtn.disabled = value;

      loading.style.display =
        value ? "block" : "none";
    }


    /*
      ------------------------------------------------------------
      WHERE SHOULD A SUCCESSFUL USER GO?
      ------------------------------------------------------------

      The test repository will contain the real Busanso pages.

      Therefore after authentication we go directly to home.html.

      The Supabase session is stored by the Supabase client in
      the browser. Moving between Busanso pages should NOT destroy
      that session.
    */

    function goToHome() {

      status(
        "Signed in successfully. Opening BUSANSO...",
        "success"
      );

      setTimeout(function () {

        window.location.replace("home.html");

      }, 400);

    }


    /*
      ------------------------------------------------------------
      CHECK EXISTING SESSION
      ------------------------------------------------------------

      IMPORTANT:

      We do NOT sign the user out if something goes wrong here.

      We only determine whether a session already exists.
    */

    async function checkExistingSession() {

      try {

        const result =
          await supabaseClient.auth.getSession();

        if (result.error) {

          console.error(
            "Session check error:",
            result.error
          );

          return;
        }


        const session =
          result.data.session;


        if (session && session.user) {

          console.log(
            "Existing BUSANSO Supabase session:",
            session.user.email
          );

          goToHome();

        }

      } catch (error) {

        console.error(
          "Unexpected session error:",
          error
        );

      }

    }


    /*
      ------------------------------------------------------------
      GOOGLE SIGN-IN
      ------------------------------------------------------------
    */

    googleBtn.addEventListener(
      "click",
      async function () {

        setLoading(true);

        status(
          "Connecting to Google..."
        );

        try {

          const result =
            await supabaseClient.auth.signInWithOAuth({

              provider: "google",

              options: {

                /*
                  IMPORTANT:

                  Google returns to THIS test website.

                  Example:

                  https://your-test-site/auth.html
                */

                redirectTo:
                  window.location.origin +
                  "/auth.html",

                queryParams: {

                  access_type: "offline",

                  prompt: "select_account"

                }

              }

            });


          if (result.error) {

            console.error(
              "Google sign-in error:",
              result.error
            );

            status(
              result.error.message ||
              "Google sign-in failed.",
              "error"
            );

            setLoading(false);

          }

        } catch (error) {

          console.error(
            "Unexpected Google error:",
            error
          );

          status(
            "Unable to start Google sign-in.",
            "error"
          );

          setLoading(false);

        }

      }
    );


    /*
      ------------------------------------------------------------
      AUTH STATE LISTENER
      ------------------------------------------------------------

      If Supabase reports that Google authentication succeeded,
      we do NOT create another session and we do NOT sign out.

      We simply continue to home.html.
    */

    supabaseClient.auth.onAuthStateChange(
      function (event, session) {

        console.log(
          "BUSANSO AUTH EVENT:",
          event
        );


        if (
          session &&
          session.user &&
          (
            event === "SIGNED_IN" ||
            event === "INITIAL_SESSION"
          )
        ) {

          goToHome();

        }

      }
    );


    /*
      Start
    */

    checkExistingSession();

  </script>

</body>
</html>
