<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUSANSO NATION — Sign In</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        radial-gradient(
            circle at top,
            #262626 0%,
            #111 45%,
            #050505 100%
        );

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.card {
    width: 100%;
    max-width: 430px;

    padding: 38px 28px 32px;

    text-align: center;

    background: rgba(20,20,20,.97);

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 24px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.60);
}

.logo {
    display: block;

    width: 150px;
    max-width: 70%;

    height: auto;

    margin: 0 auto 25px;
}

h1 {
    font-size: 25px;
    font-weight: 700;

    margin-bottom: 10px;
}

.description {
    color: #aaa;

    font-size: 14px;
    line-height: 1.6;

    margin-bottom: 28px;
}

.google-button {
    width: 100%;
    height: 54px;

    border: 0;
    border-radius: 12px;

    background: #fff;
    color: #111;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.google-button:hover {
    transform: translateY(-1px);
}

.google-button:active {
    transform: translateY(0);
}

.google-button:disabled {
    opacity: .55;
    cursor: wait;
    transform: none;
}

.google-icon {
    width: 21px;
    height: 21px;
}

.status {
    min-height: 24px;

    margin-top: 20px;

    color: #999;

    font-size: 13px;
    line-height: 1.5;
}

.status.error {
    color: #ff7474;
}

.status.success {
    color: #73e6a2;
}

.loader {
    display: none;

    width: 28px;
    height: 28px;

    margin: 22px auto 0;

    border-radius: 50%;

    border:
        3px solid rgba(255,255,255,.12);

    border-top-color: #fff;

    animation: spin .8s linear infinite;
}

.footer {
    margin-top: 25px;

    color: #555;

    font-size: 11px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="card">

    <img
        class="logo"
        src="https://i.ibb.co/hxgrLF35/BUSANSO-New.png"
        alt="BUSANSO NATION"
    >

    <h1>Welcome to BUSANSO NATION</h1>

    <div class="description">
        Sign in with Google to continue to BUSANSO.
    </div>

    <button
        id="googleButton"
        class="google-button"
        type="button"
    >

        <svg
            class="google-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                fill="#4285F4"
                d="M21.35 12.23c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
            />

            <path
                fill="#34A853"
                d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.75z"
            />

            <path
                fill="#FBBC05"
                d="M6.54 13.84A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.27.31-1.84V7.63H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.37l3.24-2.53z"
            />

            <path
                fill="#EA4335"
                d="M12 6.13c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.09 14.63 2.25 12 2.25A9.75 9.75 0 0 0 3.3 7.63l3.24 2.53C7.31 7.85 9.46 6.13 12 6.13z"
            />
        </svg>

        Continue with Google

    </button>

    <div
        id="loader"
        class="loader"
    ></div>

    <div
        id="status"
        class="status"
    ></div>

    <div class="footer">
        BUSANSO NATION
    </div>

</div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/*
==============================================================
BUSANSO TEST AUTHENTICATION
==============================================================

Supports:

1. NORMAL WEB BROWSER
       ↓
   Google
       ↓
   Supabase
       ↓
   GitHub Pages auth.html
       ↓
   home.html


2. BUSANSO ANDROID APP
       ↓
   Google
       ↓
   Supabase
       ↓
   busanso://auth-callback
       ↓
   BUSANSO Android app
       ↓
   auth.html
       ↓
   home.html

==============================================================
*/


/*
==============================================================
SUPABASE CONFIGURATION
==============================================================
*/

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";


/*
==============================================================
REDIRECT URLS
==============================================================
*/

/*
Normal browser callback.
*/
const WEB_REDIRECT_URL =
    "https://busansoanimations-cloud.github.io/testbusanso/auth.html";


/*
Android APK callback.

The AndroidManifest.xml listens for:

busanso://auth-callback
*/
const APP_REDIRECT_URL =
    "busanso://auth-callback";


/*
==============================================================
DETECT APP MODE
==============================================================

The Android app will eventually load the authentication page
with:

?app=1

Normal browsers do not use that parameter.
*/

const urlParams =
    new URLSearchParams(window.location.search);

const isAppMode =
    urlParams.get("app") === "1";


/*
==============================================================
CREATE SUPABASE CLIENT
==============================================================

The APK uses the implicit authentication flow so the OAuth
tokens can return through the Android deep link.

The normal browser continues using the normal PKCE flow.
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                flowType: isAppMode
                    ? "implicit"
                    : "pkce",

                detectSessionInUrl: true,

                persistSession: true,

                autoRefreshToken: true
            }
        }
    );


/*
==============================================================
PAGE ELEMENTS
==============================================================
*/

const googleButton =
    document.getElementById("googleButton");

const statusBox =
    document.getElementById("status");

const loader =
    document.getElementById("loader");


/*
==============================================================
STATUS
==============================================================
*/

function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
        "status" +
        (type ? " " + type : "");
}


/*
==============================================================
LOADING
==============================================================
*/

function setLoading(isLoading) {

    googleButton.disabled = isLoading;

    loader.style.display =
        isLoading ? "block" : "none";
}


/*
==============================================================
GO TO HOME
==============================================================
*/

function goToHome() {

    showStatus(
        "Google sign-in successful. Opening BUSANSO...",
        "success"
    );

    setTimeout(function () {

        window.location.replace(
            "home.html"
        );

    }, 500);
}


/*
==============================================================
CHECK EXISTING SESSION
==============================================================
*/

async function checkExistingSession() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        if (result.error) {

            console.error(
                "Supabase session check error:",
                result.error
            );

            return;
        }

        const session =
            result.data.session;

        if (
            session &&
            session.user
        ) {

            console.log(
                "Existing Supabase session:",
                session.user.email
            );

            goToHome();
        }

    } catch (error) {

        console.error(
            "Unexpected session error:",
            error
        );
    }
}


/*
==============================================================
GOOGLE SIGN-IN
==============================================================
*/

googleButton.addEventListener(
    "click",
    async function () {

        setLoading(true);

        showStatus(
            "Connecting to Google..."
        );

        try {

            /*
            Select the correct callback depending
            on whether BUSANSO is running inside
            the Android APK.
            */

            const redirectTo =
                isAppMode
                    ? APP_REDIRECT_URL
                    : WEB_REDIRECT_URL;


            const result =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "google",

                    options: {

                        /*
                        Android:

                            busanso://auth-callback

                        Browser:

                            GitHub Pages auth.html
                        */

                        redirectTo: redirectTo,


                        /*
                        Ask Google to show the account
                        selection screen.
                        */

                        queryParams: {

                            prompt:
                                "select_account"

                        }

                    }

                });


            if (result.error) {

                console.error(
                    "Google OAuth error:",
                    result.error
                );

                showStatus(
                    result.error.message ||
                    "Google sign-in failed.",
                    "error"
                );

                setLoading(false);

            }

        } catch (error) {

            console.error(
                "Unexpected Google OAuth error:",
                error
            );

            showStatus(
                "Unable to start Google sign-in.",
                "error"
            );

            setLoading(false);
        }

    }
);


/*
==============================================================
AUTH STATE LISTENER
==============================================================*/

supabaseClient.auth.onAuthStateChange(
    function (event, session) {

        console.log(
            "BUSANSO AUTH EVENT:",
            event
        );


        if (
            session &&
            session.user &&
            (
                event === "SIGNED_IN" ||
                event === "INITIAL_SESSION"
            )
        ) {

            goToHome();
        }

    }
);


/*
==============================================================
START
==============================================================
*/

checkExistingSession();

</script>

</body>
</html>
