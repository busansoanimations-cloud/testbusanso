<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Busanso - Google Sign In Diagnostic</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080808;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 520px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 193, 7, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #ffc107;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 22px;
        }

        #googleBtn {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            color: #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #googleBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            padding: 14px;
            border-radius: 10px;
            background: #0d0d0d;
            border: 1px solid #333;
            margin-bottom: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        .label {
            color: #ffc107;
            font-weight: bold;
        }

        .ok {
            color: #65d66f;
        }

        .error {
            color: #ff6565;
        }

        .warning {
            color: #ffca5c;
        }

        #diagnostic {
            display: none;
            background: #050505;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 500px;
            overflow-y: auto;
        }

        .small {
            color: #888;
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
        }

        .homeBtn {
            display: none;
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #ffc107;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>BUSANSO</h1>

    <div class="subtitle">
        Google Sign-In Diagnostic
    </div>

    <button id="googleBtn" onclick="signInWithGoogle()">
        Continue with Google
    </button>

    <div id="status">
        <span class="label">Status:</span>
        Starting...
    </div>

    <div id="diagnostic"></div>

    <button id="homeBtn" class="homeBtn" onclick="goHome()">
        Continue to Home
    </button>

    <div class="small">
        This diagnostic page does not create or modify profiles.
    </div>

</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoiZGhrZmh5YnpjeGRlb2FsY2ZxeCIsImlhdCI6MTc3MjUzNDE1MSwiZXhwIjoyMDg4MTEwMTUxfQ.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY";


const statusBox =
    document.getElementById("status");

const diagnosticBox =
    document.getElementById("diagnostic");

const googleBtn =
    document.getElementById("googleBtn");

const homeBtn =
    document.getElementById("homeBtn");


let diagnosticLines = [];


function log(message) {

    const time =
        new Date().toLocaleTimeString();

    diagnosticLines.push(
        "[" + time + "] " + message
    );

    diagnosticBox.textContent =
        diagnosticLines.join("\n");

    diagnosticBox.style.display = "block";

    console.log(message);
}


function setStatus(message, type = "") {

    statusBox.innerHTML =
        '<span class="label">Status:</span> ' +
        '<span class="' + type + '">' +
        message +
        '</span>';

    log("STATUS: " + message);
}


function goHome() {

    const homeUrl =
        new URL(
            "home.html",
            window.location.href
        ).href;

    log("Redirecting to: " + homeUrl);

    window.location.replace(homeUrl);
}


async function signInWithGoogle() {

    try {

        googleBtn.disabled = true;

        setStatus(
            "Opening Google account selection..."
        );

        const redirectTo =
            new URL(
                "auth.html",
                window.location.href
            ).href;

        log(
            "OAuth redirect URL: " +
            redirectTo
        );

        log(
            "Starting Supabase Google OAuth..."
        );

        const {
            data,
            error
        } =
        await supabase.auth.signInWithOAuth({

            provider: "google",

            options: {

                redirectTo: redirectTo,

                queryParams: {
                    prompt: "select_account"
                }
            }
        });


        if (error) {

            log(
                "signInWithOAuth ERROR: " +
                JSON.stringify(error)
            );

            setStatus(
                "Google OAuth could not start: " +
                error.message,
                "error"
            );

            googleBtn.disabled = false;

            return;
        }


        log(
            "OAuth request accepted by Supabase."
        );


        if (data && data.url) {

            log(
                "Supabase OAuth URL received."
            );

            log(
                "Browser should now leave this page for Google."
            );

        } else {

            log(
                "WARNING: Supabase returned no OAuth URL."
            );
        }

    } catch (err) {

        log(
            "EXCEPTION starting Google OAuth: " +
            (err?.message || String(err))
        );

        setStatus(
            "Exception: " +
            (err?.message || String(err)),
            "error"
        );

        googleBtn.disabled = false;
    }
}


async function checkAuthCallback() {

    log(
        "========== AUTH CALLBACK CHECK =========="
    );

    log(
        "Current URL:"
    );

    log(
        window.location.href
    );


    const url =
        new URL(window.location.href);


    log(
        "Protocol: " +
        url.protocol
    );

    log(
        "Host: " +
        url.host
    );

    log(
        "Path: " +
        url.pathname
    );

    log(
        "Search: " +
        (url.search || "(none)")
    );

    log(
        "Hash: " +
        (url.hash || "(none)")
    );


    const code =
        url.searchParams.get("code");

    const errorParam =
        url.searchParams.get("error");

    const errorDescription =
        url.searchParams.get(
            "error_description"
        );


    if (errorParam) {

        log(
            "OAUTH ERROR PARAMETER FOUND:"
        );

        log(
            "error = " +
            errorParam
        );

        log(
            "error_description = " +
            (errorDescription || "(none)")
        );

        setStatus(
            "Google/Supabase returned an OAuth error: " +
            errorParam +
            " - " +
            (errorDescription || ""),
            "error"
        );

        googleBtn.disabled = false;

        return;
    }


    if (code) {

        log(
            "PKCE authorization code FOUND."
        );

        log(
            "Code length: " +
            code.length
        );

        setStatus(
            "Google returned an authorization code. Exchanging it for a Supabase session...",
            "warning"
        );


        try {

            log(
                "Calling exchangeCodeForSession()..."
            );


            const {
                data,
                error
            } =
            await supabase.auth
                .exchangeCodeForSession(code);


            if (error) {

                log(
                    "exchangeCodeForSession ERROR:"
                );

                log(
                    JSON.stringify(
                        error,
                        null,
                        2
                    )
                );

                setStatus(
                    "Authorization code was received, BUT Supabase could not exchange it: " +
                    error.message,
                    "error"
                );

                googleBtn.disabled = false;

                return;
            }


            log(
                "exchangeCodeForSession completed."
            );


            if (data && data.session) {

                log(
                    "SUPABASE SESSION FOUND."
                );

                log(
                    "User ID: " +
                    (data.session.user?.id || "(none)")
                );

                log(
                    "Email: " +
                    (data.session.user?.email || "(none)")
                );

                log(
                    "Provider: " +
                    (data.session.user?.app_metadata?.provider || "(none)")
                );


                setStatus(
                    "SUCCESS: Supabase session created.",
                    "ok"
                );


                homeBtn.style.display =
                    "block";


                /*
                 * IMPORTANT:
                 * Do NOT store profile data here.
                 * Do NOT create a profile here.
                 * The migration uses Supabase Auth
                 * + profiles.auth_user_id.
                 */


                log(
                    "Session is available."
                );

                log(
                    "No profile/localStorage operation performed."
                );


                /*
                 * Automatically continue after
                 * a short delay so we can see the
                 * diagnostic before leaving.
                 */

                log(
                    "Home redirect in 3 seconds..."
                );


                setTimeout(
                    goHome,
                    3000
                );


                return;

            } else {

                log(
                    "exchangeCodeForSession returned NO SESSION."
                );

                log(
                    "Returned data: " +
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                );

                setStatus(
                    "Code exchange completed, but NO Supabase session was returned.",
                    "error"
                );

                googleBtn.disabled = false;

                return;
            }


        } catch (err) {

            log(
                "EXCEPTION during code exchange:"
            );

            log(
                err?.stack ||
                err?.message ||
                String(err)
            );

            setStatus(
                "Exception while exchanging Google authorization code: " +
                (err?.message || String(err)),
                "error"
            );

            googleBtn.disabled = false;

            return;
        }

    } else {

        log(
            "NO authorization code found."
        );
    }


    /*
     * Check whether Supabase already restored
     * a session automatically.
     */

    try {

        log(
            "Checking supabase.auth.getSession()..."
        );


        const {
            data,
            error
        } =
        await supabase.auth.getSession();


        if (error) {

            log(
                "getSession ERROR:"
            );

            log(
                JSON.stringify(
                    error,
                    null,
                    2
                )
            );

            setStatus(
                "Supabase getSession error: " +
                error.message,
                "error"
            );

            return;
        }


        if (data && data.session) {

            log(
                "EXISTING SESSION FOUND."
            );

            log(
                "User ID: " +
                (data.session.user?.id || "(none)")
            );

            log(
                "Email: " +
                (data.session.user?.email || "(none)")
            );


            setStatus(
                "Supabase session already exists.",
                "ok"
            );


            homeBtn.style.display =
                "block";


            log(
                "Home redirect in 3 seconds..."
            );


            setTimeout(
                goHome,
                3000
            );


        } else {

            log(
                "NO ACTIVE SUPABASE SESSION."
            );

            setStatus(
                "Waiting for Google sign-in.",
                "warning"
            );

            googleBtn.disabled = false;
        }


    } catch (err) {

        log(
            "getSession exception: " +
            (err?.message || String(err))
        );

        setStatus(
            "Session check failed: " +
            (err?.message || String(err)),
            "error"
        );

        googleBtn.disabled = false;
    }
}


/*
 * Create Supabase client.
 */

let supabase;


try {

    if (
        !window.supabase ||
        !window.supabase.createClient
    ) {

        throw new Error(
            "Supabase JavaScript library did not load."
        );
    }


    supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth: {

                    persistSession: true,

                    autoRefreshToken: true,

                    detectSessionInUrl: false,

                    flowType: "pkce"
                }
            }
        );


    log(
        "Supabase client created successfully."
    );


    /*
     * Listen for authentication state changes.
     */

    supabase.auth.onAuthStateChange(
        (event, session) => {

            log(
                "AUTH STATE EVENT: " +
                event
            );


            if (session) {

                log(
                    "Auth event includes session."
                );

                log(
                    "User ID: " +
                    (session.user?.id || "(none)")
                );

                log(
                    "Email: " +
                    (session.user?.email || "(none)")
                );
            }


            if (
                event === "SIGNED_IN" &&
                session
            ) {

                setStatus(
                    "SIGNED_IN received. Supabase session is active.",
                    "ok"
                );

                homeBtn.style.display =
                    "block";

                /*
                 * Give the event a moment to
                 * finish persistence.
                 */

                setTimeout(
                    goHome,
                    1500
                );
            }
        }
    );


    /*
     * Now inspect the current URL.
     */

    checkAuthCallback();


} catch (err) {

    log(
        "FATAL INITIALIZATION ERROR:"
    );

    log(
        err?.stack ||
        err?.message ||
        String(err)
    );

    setStatus(
        "Supabase initialization failed: " +
        (err?.message || String(err)),
        "error"
    );

    googleBtn.disabled = false;
}

</script>

</body>
</html>
