<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BUSANSO — Sign In</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #3a321b 0%,
            #171717 35%,
            #070707 70%,
            #000 100%
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.auth-card{

    width:100%;
    max-width:390px;

    padding:40px 28px 30px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(212,175,55,.35);

    border-radius:25px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.75),
        0 0 35px rgba(212,175,55,.08);
}

.logo{

    width:95px;
    height:95px;

    object-fit:contain;

    display:block;

    margin:0 auto 20px;

    border-radius:20px;
}

.brand{

    margin:0;

    font-size:27px;

    font-weight:900;

    letter-spacing:1.5px;

    background:
        linear-gradient(
            90deg,
            #fff3a6,
            #d4af37,
            #fff3a6
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{

    margin-top:9px;

    color:#aaa;

    font-size:12px;

    line-height:1.6;
}

.google-button{

    width:100%;

    height:56px;

    margin-top:30px;

    border:0;

    border-radius:14px;

    background:#fff;

    color:#111;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.google-button:hover{

    transform:translateY(-1px);

    box-shadow:
        0 14px 35px rgba(0,0,0,.45);
}

.google-button:active{

    transform:translateY(0);
}

.google-button:disabled{

    opacity:.55;

    cursor:wait;

    transform:none;
}

.google-icon{

    width:21px;
    height:21px;
}

.status{

    min-height:22px;

    margin-top:17px;

    color:#aaa;

    font-size:12px;

    line-height:1.5;
}

.back{

    display:block;

    margin-top:24px;

    color:#777;

    text-decoration:none;

    font-size:12px;
}

.back:hover{

    color:#fff;
}

.footer{

    margin-top:27px;

    color:#555;

    font-size:10px;

    letter-spacing:.5px;
}

.gold-line{

    height:1px;

    margin:25px 0 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            transparent
        );
}

</style>

</head>

<body>

<main class="auth-card">

    <img
        class="logo"
        src="https://i.ibb.co/hxgrLF35/BUSANSO-New.png"
        alt="BUSANSO">

    <h1 class="brand">
        BUSANSO NATION
    </h1>

    <div class="subtitle">
        Sign in securely with your Google account
    </div>

    <button
        id="googleButton"
        class="google-button">

        <svg
            class="google-icon"
            viewBox="0 0 24 24"
            aria-hidden="true">

            <path
                fill="#4285F4"
                d="M21.35 12.23c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.4z"/>

            <path
                fill="#34A853"
                d="M12 21.5c2.63 0 4.84-.87 6.45-2.37l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.5z"/>

            <path
                fill="#FBBC05"
                d="M6.54 13.58A5.86 5.86 0 0 1 6.23 12c0-.55.1-1.08.31-1.58V7.9H3.3A9.5 9.5 0 0 0 2.25 12c0 1.48.35 2.88 1.05 4.1l3.24-2.52z"/>

            <path
                fill="#EA4335"
                d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.47 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.4l3.24 2.52C7.31 8.11 9.46 6.39 12 6.39z"/>

        </svg>

        Continue with Google

    </button>

    <div
        id="status"
        class="status">
    </div>

    <a
        class="back"
        href="index.html">
        ← Back to BUSANSO
    </a>

    <div class="gold-line"></div>

    <div class="footer">
        SECURE SIGN-IN • BUSANSO NATION
    </div>

</main>


<script>

(function(){

"use strict";


/*
============================================================
CONFIG
============================================================
*/

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";


/*
============================================================
MODE
============================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );

const isAppMode =
    params.get("app") === "1";


/*
============================================================
REDIRECT URL
============================================================
*/

const WEB_REDIRECT_URL =
    "https://busansoanimations-cloud.github.io/testbusanso/auth.html";

const APP_REDIRECT_URL =
    "busanso://auth-callback";


const REDIRECT_URL =
    isAppMode
        ? APP_REDIRECT_URL
        : WEB_REDIRECT_URL;


/*
============================================================
SUPABASE
============================================================
*/

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {

                /*
                 * APK:
                 *
                 * Google -> Supabase -> busanso://
                 *
                 * The callback token comes back in
                 * the URL fragment.
                 */

                flowType:
                    isAppMode
                        ? "implicit"
                        : "pkce",

                detectSessionInUrl:true,

                persistSession:true,

                autoRefreshToken:true,

                storageKey:
                    "busanso-auth"
            }
        }
    );


/*
============================================================
ELEMENTS
============================================================
*/

const button =
    document.getElementById(
        "googleButton"
    );

const status =
    document.getElementById(
        "status"
    );


/*
============================================================
STATUS
============================================================
*/

function setStatus(message){

    status.textContent =
        message || "";
}


/*
============================================================
SAVE AUTH COMPATIBILITY DATA
============================================================
*/

function saveAuthUser(user){

    if(!user){
        return;
    }

    try{

        localStorage.setItem(
            "auth_user_id",
            user.id
        );

        localStorage.setItem(
            "supabase_auth_user_id",
            user.id
        );

        localStorage.setItem(
            "email",
            user.email || ""
        );

        const metadata =
            user.user_metadata || {};

        const name =
            metadata.full_name ||
            metadata.name ||
            (
                user.email
                    ? user.email.split("@")[0]
                    : ""
            );

        if(name){

            localStorage.setItem(
                "name",
                name
            );

            localStorage.setItem(
                "username",
                name
            );
        }

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "isLoggedIn",
            "true"
        );

    }catch(error){

        console.warn(
            "Local auth save failed:",
            error
        );
    }
}


/*
============================================================
LOAD PROFILE
============================================================
*/

async function loadProfile(user){

    if(!user){
        return null;
    }

    try{

        const result =
            await supabase
                .from("profiles")
                .select("*")
                .eq(
                    "auth_user_id",
                    user.id
                )
                .maybeSingle();


        if(result.error){

            console.warn(
                "Profile lookup:",
                result.error
            );

            return null;
        }


        const profile =
            result.data;


        if(profile){

            try{

                localStorage.setItem(
                    "profile",
                    JSON.stringify(profile)
                );

                localStorage.setItem(
                    "busanso_profile",
                    JSON.stringify(profile)
                );

                if(profile.id != null){

                    localStorage.setItem(
                        "profile_id",
                        String(profile.id)
                    );

                    localStorage.setItem(
                        "user_id",
                        String(profile.id)
                    );
                }

                if(profile.name){

                    localStorage.setItem(
                        "name",
                        profile.name
                    );

                    localStorage.setItem(
                        "username",
                        profile.name
                    );
                }

                localStorage.setItem(
                    "membership",
                    profile.membership || "free"
                );

                localStorage.setItem(
                    "package_type",
                    profile.package_type || ""
                );

                localStorage.setItem(
                    "expires_at",
                    profile.expires_at || ""
                );

                localStorage.setItem(
                    "loggedIn",
                    "true"
                );

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );

            }catch(error){

                console.warn(
                    "Profile local save failed:",
                    error
                );
            }
        }


        return profile;

    }catch(error){

        console.warn(
            "Profile lookup failed:",
            error
        );

        return null;
    }
}


/*
============================================================
GO TO HOME
============================================================
*/

function goHome(){

    if(isAppMode){

        window.location.replace(
            "home.html?app=1"
        );

    }else{

        window.location.replace(
            "home.html"
        );
    }
}


/*
============================================================
CHECK EXISTING SESSION
============================================================
*/

async function checkSession(){

    try{

        const result =
            await supabase.auth.getSession();


        if(result.error){

            console.error(
                "Session error:",
                result.error
            );

            return false;
        }


        const session =
            result.data &&
            result.data.session;


        if(!session ||
            !session.user){

            return false;
        }


        /*
         * GOOGLE AUTHENTICATION IS SUCCESSFUL.
         */

        saveAuthUser(
            session.user
        );


        /*
         * If an existing BUSANSO profile is
         * connected to this Google account,
         * preserve its membership.
         */

        await loadProfile(
            session.user
        );


        setStatus(
            "Signed in. Opening BUSANSO..."
        );


        setTimeout(
            goHome,
            150
        );


        return true;

    }catch(error){

        console.error(
            "Session check failed:",
            error
        );

        return false;
    }
}


/*
============================================================
GOOGLE SIGN-IN
============================================================
*/

button.addEventListener(
    "click",
    async function(){

        button.disabled = true;

        setStatus(
            "Connecting to Google..."
        );


        try{

            const result =
                await supabase.auth.signInWithOAuth({

                    provider:
                        "google",

                    options:{

                        /*
                         * THIS IS THE CRITICAL PART.
                         *
                         * APK:
                         * busanso://auth-callback
                         *
                         * Browser:
                         * GitHub Pages auth.html
                         */

                        redirectTo:
                            REDIRECT_URL,

                        queryParams:{

                            prompt:
                                "select_account"
                        }
                    }
                });


            if(result.error){

                throw result.error;
            }


        }catch(error){

            console.error(
                "Google OAuth error:",
                error
            );

            button.disabled = false;

            setStatus(
                error.message ||
                "Google sign-in failed."
            );
        }

    }
);


/*
============================================================
AUTH STATE
============================================================
*/

supabase.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "BUSANSO AUTH:",
            event
        );


        if(
            session &&
            (
                event === "SIGNED_IN" ||
                event === "INITIAL_SESSION"
            )
        ){

            saveAuthUser(
                session.user
            );

            /*
             * Do not perform heavy Supabase
             * queries inside the auth callback.
             *
             * Simply continue to the app.
             */

            setStatus(
                "Signed in. Opening BUSANSO..."
            );

            setTimeout(
                goHome,
                150
            );
        }
    }
);


/*
============================================================
STARTUP
============================================================
*/

checkSession();


})();

</script>

</body>

</html>
