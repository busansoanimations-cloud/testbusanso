<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BUSANSO — Sign In</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at top,#3b2a08 0%,#171005 45%,#070707 100%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
}

.card{
    width:100%;
    max-width:430px;
    padding:35px 25px 30px;
    text-align:center;
    border-radius:22px;
    background:linear-gradient(145deg,#2a200c,#0d0d0d);
    border:1px solid rgba(212,175,55,.45);
    box-shadow:0 0 40px rgba(212,175,55,.14);
}

.logo{
    width:180px;
    max-width:75%;
    margin:0 auto 22px;
    display:block;
}

h1{
    margin:0;
    color:#f4d77a;
    font-size:29px;
}

.subtitle{
    margin:10px 0 28px;
    color:#bbb;
    font-size:15px;
    line-height:1.5;
}

#googleBtn{
    width:100%;
    min-height:58px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#f8df83,#c89b28);
    color:#111;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

#googleBtn:disabled{
    opacity:.55;
    cursor:wait;
}

#status{
    min-height:25px;
    margin-top:20px;
    color:#ccc;
    font-size:14px;
    line-height:1.5;
}

.error{
    color:#ff8585!important;
}

.success{
    color:#9be58c!important;
}

.small{
    margin-top:22px;
    color:#666;
    font-size:12px;
}
</style>

</head>

<body>

<div class="card">

<img
 class="logo"
 src="https://busansoanimations-cloud.github.io/testbusanso/images/busanso-logo-source.png"
 alt="BUSANSO">

<h1>Welcome to BUSANSO</h1>

<div class="subtitle">
Sign in with Google to continue watching.
</div>

<button
 id="googleBtn"
 type="button"> <span style="font-size:21px;margin-right:8px;">G</span>
Continue with Google </button>

<div id="status"></div>

<div class="small">
Secure sign-in powered by Google
</div>

</div>

<script>

"use strict";


/* ============================================================
   CONFIG
   ============================================================ */

const SUPABASE_URL =
    "https://dhkfhhybzcxdeoalcfqx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rjm3T44VKTeuOF2yJS5rMw_xDfwPjuG";


/* ============================================================
   MODE
   ============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

const isAppMode =
    params.get("app") === "1";


/* ============================================================
   REDIRECTS
   ============================================================ */

const WEB_REDIRECT_URL =
    "https://busansoanimations-cloud.github.io/testbusanso/auth.html";

const APP_REDIRECT_URL =
    "busanso://auth/callback";

const REDIRECT_URL =
    isAppMode
        ? APP_REDIRECT_URL
        : WEB_REDIRECT_URL;


/* ============================================================
   ELEMENTS
   ============================================================ */

const googleBtn =
    document.getElementById("googleBtn");

const statusBox =
    document.getElementById("status");


function showStatus(message,type){

    statusBox.textContent =
        message || "";

    statusBox.className =
        type || "";
}


/* ============================================================
   SUPABASE
   ============================================================ */

if(
    !window.supabase ||
    !window.supabase.createClient
){

    showStatus(
        "Sign-in service could not load.",
        "error"
    );

    throw new Error(
        "Supabase library unavailable."
    );
}


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,

                /*
                 * IMPORTANT:
                 * We process the OAuth code ourselves.
                 */
                detectSessionInUrl:false,

                flowType:"pkce",

                storageKey:"busanso-auth"
            }
        }
    );


/* ============================================================
   SAVE USER
   ============================================================ */

function saveUser(user){

    try{

        localStorage.setItem(
            "busanso_user",
            JSON.stringify(user)
        );

    }catch(e){}
}


/* ============================================================
   SAVE PROFILE
   ============================================================ */

function saveProfile(profile){

    try{

        localStorage.setItem(
            "busanso_profile",
            JSON.stringify(profile)
        );

    }catch(e){}
}


/* ============================================================
   LOAD PROFILE
   ============================================================ */

async function loadProfile(user){

    if(!user || !user.id){
        return null;
    }

    const result =
        await client
            .from("profiles")
            .select("*")
            .eq(
                "auth_user_id",
                user.id
            )
            .maybeSingle();

    if(result.error){

        console.error(
            "Profile load error:",
            result.error
        );

        return null;
    }

    if(result.data){

        saveProfile(
            result.data
        );
    }

    return result.data || null;
}


/* ============================================================
   CREATE PROFILE
   ============================================================ */

async function createProfile(user){

    const metadata =
        user.user_metadata || {};

    const name =
        metadata.full_name ||
        metadata.name ||
        (
            user.email
                ? user.email.split("@")[0]
                : "BUSANSO USER"
        );

    const avatar =
        metadata.avatar_url ||
        metadata.picture ||
        null;


    const result =
        await client
            .from("profiles")
            .insert({

                auth_user_id:user.id,

                email:
                    user.email || null,

                name:name,

                avatar_url:avatar

            })
            .select("*")
            .single();


    if(
        !result.error &&
        result.data
    ){

        saveProfile(
            result.data
        );

        return result.data;
    }


    /*
     * The database trigger may have created
     * the profile already.
     */

    return await loadProfile(
        user
    );
}


/* ============================================================
   FINISH LOGIN
   ============================================================ */

let finishingLogin =
    false;


async function finishLogin(user){

    if(!user){

        throw new Error(
            "No Google user was returned."
        );
    }


    if(finishingLogin){
        return;
    }


    finishingLogin = true;


    try{

        saveUser(
            user
        );


        showStatus(
            "Checking your BUSANSO profile..."
        );


        let profile =
            await loadProfile(
                user
            );


        if(!profile){

            showStatus(
                "Creating your BUSANSO profile..."
            );


            profile =
                await createProfile(
                    user
                );
        }


        if(!profile){

            throw new Error(
                "Google sign-in succeeded, but your BUSANSO profile could not be loaded."
            );
        }


        saveProfile(
            profile
        );


        showStatus(
            "Login successful. Opening BUSANSO...",
            "success"
        );


        setTimeout(
            function(){

                if(isAppMode){

                    window.location.href =
                        "home.html?app=1";

                }else{

                    window.location.href =
                        "home.html";
                }

            },
            400
        );


    }catch(error){

        finishingLogin =
            false;

        throw error;
    }
}


/* ============================================================
   PROCESS OAUTH CODE
   ============================================================ */

let callbackProcessed =
    false;


async function processOAuthCode(code){

    if(callbackProcessed){
        return;
    }

    callbackProcessed =
        true;


    googleBtn.disabled =
        true;


    showStatus(
        "Completing Google sign-in..."
    );


    try{

        console.log(
            "BUSANSO exchanging OAuth code"
        );


        const result =
            await client.auth.exchangeCodeForSession(
                code
            );


        console.log(
            "OAuth exchange result:",
            result
        );


        if(result.error){

            throw result.error;
        }


        if(
            !result.data ||
            !result.data.session ||
            !result.data.user
        ){

            throw new Error(
                "Google session could not be created."
            );
        }


        /*
         * Remove ?code=... from the visible
         * browser URL after successful exchange.
         */

        try{

            window.history.replaceState(
                {},
                document.title,
                isAppMode
                    ? "auth.html?app=1"
                    : "auth.html"
            );

        }catch(e){}


        await finishLogin(
            result.data.user
        );


    }catch(error){

        console.error(
            "OAuth exchange error:",
            error
        );


        callbackProcessed =
            false;

        finishingLogin =
            false;

        googleBtn.disabled =
            false;


        showStatus(
            error.message ||
            "Google sign-in could not be completed.",
            "error"
        );
    }
}


/* ============================================================
   PROCESS CURRENT WEB CALLBACK
   ============================================================ */

async function processWebCallback(){

    const code =
        new URLSearchParams(
            window.location.search
        ).get("code");


    const error =
        new URLSearchParams(
            window.location.search
        ).get("error");


    const errorDescription =
        new URLSearchParams(
            window.location.search
        ).get("error_description");


    if(error){

        showStatus(
            errorDescription ||
            error,
            "error"
        );

        return;
    }


    if(code){

        await processOAuthCode(
            code
        );

        return true;
    }


    return false;
}


/* ============================================================
   ANDROID CALLBACK FROM MAINACTIVITY
   ============================================================ */

window.addEventListener(
    "busansoOAuthCallback",
    function(event){

        console.log(
            "BUSANSO Android callback received"
        );


        if(
            event &&
            event.detail &&
            event.detail.url
        ){

            try{

                const callback =
                    new URL(
                        event.detail.url
                    );


                const error =
                    callback.searchParams.get(
                        "error"
                    );


                const errorDescription =
                    callback.searchParams.get(
                        "error_description"
                    );


                if(error){

                    showStatus(
                        errorDescription ||
                        error,
                        "error"
                    );

                    return;
                }


                const code =
                    callback.searchParams.get(
                        "code"
                    );


                if(!code){

                    showStatus(
                        "Google did not return an authorization code.",
                        "error"
                    );

                    return;
                }


                processOAuthCode(
                    code
                );

            }catch(error){

                console.error(
                    "Android callback error:",
                    error
                );

                showStatus(
                    error.message ||
                    "Google sign-in could not be completed.",
                    "error"
                );
            }
        }
    }
);


/* ============================================================
   GOOGLE BUTTON
   ============================================================ */

googleBtn.addEventListener(
    "click",
    async function(){

        googleBtn.disabled =
            true;


        showStatus(
            "Connecting to Google..."
        );


        try{

            console.log(
                "Starting Google OAuth"
            );


            const result =
                await client.auth.signInWithOAuth({

                    provider:"google",

                    options:{

                        redirectTo:
                            REDIRECT_URL,

                        queryParams:{
                            prompt:"select_account"
                        }

                    }

                });


            console.log(
                "Google OAuth started:",
                result
            );


            if(result.error){

                throw result.error;
            }


        }catch(error){

            console.error(
                "Google OAuth start error:",
                error
            );


            googleBtn.disabled =
                false;


            showStatus(
                error.message ||
                "Google sign-in could not start.",
                "error"
            );
        }

    }
);


/* ============================================================
   STARTUP
   ============================================================ */

console.log(
    "BUSANSO AUTH READY"
);

console.log(
    "App mode:",
    isAppMode
);

console.log(
    "Redirect:",
    REDIRECT_URL
);


/*
 * In Chrome, Google returns to:
 *
 * auth.html?code=...
 *
 * We manually exchange that code.
 *
 * In Android, MainActivity receives:
 *
 * busanso://auth/callback?code=...
 *
 * and sends it to the same processOAuthCode()
 * function through busansoOAuthCallback.
 */

if(!isAppMode){

    processWebCallback();

}

</script>

</body>
</html>
