
<!DOCTYPE html> 
<html lang="en"> <head> <meta charset="UTF-8"> 
<title>BUSANSO – Movies</title> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(circle at 50% -10%,rgba(212,175,55,.20),transparent 35%),linear-gradient(180deg,#120d04 0%,#070604 45%,#020201 100%);
 color:#f5ead0;font-family:'Poppins',sans-serif;overflow-x:hidden
}
.logo{display:flex;justify-content:center;padding:20px 10px 12px}
.logo img{height:58px;max-width:190px;object-fit:contain;border-radius:14px;box-shadow:0 0 28px rgba(212,175,55,.30),0 8px 25px rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.35)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;position:sticky;top:0;z-index:100;background:rgba(12,9,4,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(212,175,55,.20)}
.nav button{height:58px;border:1px solid rgba(212,175,55,.18);border-radius:16px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#d8c89d;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(212,175,55,.025));transition:.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.38)}
.nav button i{font-size:20px;color:#d4af37}
.nav button:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.45)}
.nav button.active{background:linear-gradient(135deg,#8f6b16,#d4af37 48%,#f4d76e);color:#1b1304;border-color:#f0cf61;box-shadow:0 0 20px rgba(212,175,55,.30),0 10px 28px rgba(0,0,0,.5)}
.nav button.active i{color:#1b1304}
.search{padding:18px 14px 12px}
.search input,.search select{width:100%;padding:14px 15px;margin-bottom:10px;border:1px solid rgba(212,175,55,.22);border-radius:13px;background:rgba(18,13,5,.92);color:#f8edcf;font-size:14px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 5px 16px rgba(0,0,0,.4)}
.search input:focus,.search select:focus{border-color:#d4af37;box-shadow:0 0 0 2px rgba(212,175,55,.10)}
.search select option{background:#120d04;color:#f8edcf}
.movies{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.card{background:linear-gradient(145deg,rgba(212,175,55,.075),rgba(255,255,255,.025));border:1px solid rgba(212,175,55,.16);border-radius:15px;overflow:hidden;cursor:pointer;transition:.25s;box-shadow:0 8px 25px rgba(0,0,0,.42)}
.card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.55);box-shadow:0 16px 35px rgba(0,0,0,.62),0 0 20px rgba(212,175,55,.10)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:.35s}
.card:hover img{transform:scale(1.04)}
.badge{position:absolute;top:8px;left:8px;padding:4px 8px;font-size:10px;font-weight:bold;border-radius:6px;text-transform:uppercase}
.badge.free{background:#22c55e}.badge.premium{background:#d4af37;color:#160f02}
.info{padding:10px}.title{color:#e2bd4b;font-weight:700;font-size:14px;margin-bottom:4px}.meta{font-size:11px;color:#cfc19e;line-height:1.45}
.watch{width:100%;padding:10px;margin-top:8px;border:none;border-radius:10px;background:linear-gradient(135deg,#9b761b,#d4af37,#f0ce65);color:#160f02;font-weight:700;cursor:pointer;transition:.25s}
.watch:hover{transform:scale(1.03);box-shadow:0 0 15px rgba(212,175,55,.3)}
@media(min-width:768px){.movies{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
</style></head>

<body>


<div class="logo">
  <img src="https://i.ibb.co/4wLHfntq/busanso-logo-source.png" alt="BUSANSO">
</div><div class="nav">
  <button class="active">
    <i class="fas fa-film"></i><span>Movies</span>
  </button>

  <button onclick="location.href='series.html'">
    <i class="fas fa-tv"></i><span>Series</span>
  </button>

  <button onclick="location.href='account.html'">
    <i class="fas fa-user-circle"></i><span>Account</span>
  </button>
</div>


<div class="search">
  <input id="search" placeholder="🔍 Search movies......">
  <select id="genreFilter">
    <option value="ALL">All Genres</option>
    <option value="ACTION">Action</option>
    <option value="COMEDY">Comedy</option>
    <option value="DRAMA">Drama</option>
    <option value="HORROR">Horror</option>
    <option value="ROMANCE">Romance</option>
    <option value="SCI-FI">SCI-FI</option>
 
 </select>
</div>

<div class="movies" id="list"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabaseUrl = 'https://dhkfhhybzcxdeoalcfqx.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY';
const supabase = createClient(supabaseUrl, supabaseKey);


const box = document.getElementById("list");
const search = document.getElementById("search");
const genreSelect = document.getElementById("genreFilter");
let activeGenre = null;
let MOVIES = [];



function render(data){

  box.innerHTML = "";

  if(!data || data.length===0){
    box.innerHTML="<p>No movies available.</p>";
    return;
  }

  data.forEach(m=>{

    const c = document.createElement("div");
    c.className = "card";

    c.onclick = () => {
      location.href = `movie.html?id=${m.id}`;
    };

   let badge = "";  c.innerHTML = `
      <div style="position:relative">
        ${badge}
        <img src="${m.poster}" alt="${m.title}">
      </div>

      <div class="info">
        <div class="title">${m.title}</div>

        <div class="meta">
          ${m.country || ''} • ${m.year || ''} • ${m.genre || ''}
          <br>👁 ${m.views || 0} views
        </div>
      </div>
    `;

    box.appendChild(c);

  });

}

function applyFilters(){
  let filtered = [...MOVIES];
  if(activeGenre){
    filtered = filtered.filter(m => m.genre && m.genre.toLowerCase() === activeGenre.toLowerCase());
  }
  const q = search.value.trim().toLowerCase();
  if(q){
    filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
  }
  render(filtered);
}

search.oninput = applyFilters;
genreSelect.onchange = () => {
  const val = genreSelect.value;
  activeGenre = val==="ALL"?null:val;
  applyFilters();
}

async function loadMovies(){
  const { data, error } = await supabase
    .from('movies')
    .select('*')
    .order('created_at',{ascending:false}); // newest first
  if(error){ console.error(error); box.innerHTML="<p>Failed to load movies.</p>"; return; }
  if(!data || data.length===0){ box.innerHTML="<p>No movies available.</p>"; return; }
  MOVIES = data;
  render(MOVIES);
}

loadMovies();
</script>

</body>
</html>
