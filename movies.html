
<!DOCTYPE html> 
<html lang="en"> <head> <meta charset="UTF-8"> 
<title>BUSANSO – Movies</title> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -15%,rgba(212,175,55,.24),transparent 38%),
    radial-gradient(circle at 10% 35%,rgba(120,85,20,.10),transparent 30%),
    linear-gradient(180deg,#161108 0%,#090805 45%,#030302 100%);
  color:#f8f1dc;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

/* LOGO */
.logo{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 10px 14px;
}
.logo img{
  height:58px;
  max-width:85%;
  object-fit:contain;
  border-radius:14px;
  box-shadow:0 0 28px rgba(212,175,55,.28);
}

/* PREMIUM NAVIGATION */
.nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:12px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(9,8,5,.90);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(212,175,55,.20);
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}
.nav button{
  height:58px;
  border:1px solid rgba(212,175,55,.14);
  border-radius:16px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  font-size:13px;
  font-weight:700;
  color:#d9cfae;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  transition:.25s;
}
.nav button i{font-size:20px;color:#d4af37}
.nav button:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.45)}
.nav button.active{
  background:linear-gradient(135deg,#b8860b,#f1d06a,#b8860b);
  color:#171108;
  border-color:#f6df88;
  box-shadow:0 0 20px rgba(212,175,55,.28),0 10px 28px rgba(0,0,0,.45);
}
.nav button.active i{color:#171108}

/* SEARCH */
.search{
  padding:16px 14px 10px;
  max-width:900px;
  margin:auto;
}
.search input,.search select{
  width:100%;
  padding:14px 15px;
  margin-bottom:10px;
  border:1px solid rgba(212,175,55,.20);
  border-radius:13px;
  outline:none;
  background:#100d07;
  color:#fff8df;
  font-size:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 5px 16px rgba(0,0,0,.35);
}
.search input:focus,.search select:focus{
  border-color:#d4af37;
  box-shadow:0 0 0 2px rgba(212,175,55,.12);
}
.search input::placeholder{color:#9e957e}

/* MOVIES */
.movies{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:12px;
  max-width:1200px;
  margin:auto;
}
.card{
  position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid rgba(212,175,55,.15);
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 8px 22px rgba(0,0,0,.38);
}
.card:hover{
  transform:translateY(-5px);
  border-color:rgba(212,175,55,.55);
  box-shadow:0 16px 34px rgba(0,0,0,.60),0 0 18px rgba(212,175,55,.10);
}
.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  transition:.35s;
}
.card:hover img{transform:scale(1.045)}
.info{padding:10px 10px 12px}
.title{
  color:#e8c95a;
  font-weight:700;
  font-size:14px;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.meta{
  font-size:11px;
  color:#bfb59b;
  line-height:1.45;
}
.footer-categories{display:none}

@media(min-width:768px){
  .movies{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:16px}
}
</style></head>

<body>


<div class="logo">
  <img src="https://i.ibb.co/4wLHfntq/busanso-logo-source.png" alt="BUSANSO">
</div><div class="nav">
  <button class="active">
    <i class="fas fa-film"></i><span>Movies</span>
  </button>

  <button onclick="location.href='series.html'">
    <i class="fas fa-tv"></i><span>Series</span>
  </button>

  <button onclick="location.href='account.html'">
    <i class="fas fa-user-circle"></i><span>Account</span>
  </button>
</div>


<div class="search">
  <input id="search" placeholder="🔍 Search movies......">
  <select id="genreFilter">
    <option value="ALL">All Genres</option>
    <option value="ACTION">Action</option>
    <option value="COMEDY">Comedy</option>
    <option value="DRAMA">Drama</option>
    <option value="HORROR">Horror</option>
    <option value="ROMANCE">Romance</option>
    <option value="SCI-FI">SCI-FI</option>
 
 </select>
</div>

<div class="movies" id="list"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabaseUrl = 'https://dhkfhhybzcxdeoalcfqx.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoa2ZoaHliemN4ZGVvYWxjZnF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzQxNTEsImV4cCI6MjA4ODExMDE1MX0.jZ4NDNPJmO0Ji05TxDqCnzgLIIzKf9uCx3WrSgk2DaY';
const supabase = createClient(supabaseUrl, supabaseKey);


const box = document.getElementById("list");
box.innerHTML = "<p style=\"grid-column:1/-1;text-align:center;color:#d4af37;padding:30px\">Loading movies...</p>";
const search = document.getElementById("search");
const genreSelect = document.getElementById("genreFilter");
let activeGenre = null;
let MOVIES = [];



function render(data){

  box.innerHTML = "";

  if(!data || data.length===0){
    box.innerHTML="<p>No movies available.</p>";
    return;
  }

  data.forEach(m=>{

    const c = document.createElement("div");
    c.className = "card";

    c.onclick = () => {
      location.href = `movie.html?id=${m.id}`;
    };

   let badge = "";  c.innerHTML = `
      <div style="position:relative">
        ${badge}
        <img src="${m.poster}" alt="${m.title}">
      </div>

      <div class="info">
        <div class="title">${m.title}</div>

        <div class="meta">
          ${m.country || ''} • ${m.year || ''} • ${m.genre || ''}
          <br>👁 ${m.views || 0} views
        </div>
      </div>
    `;

    box.appendChild(c);

  });

}

function applyFilters(){
  let filtered = [...MOVIES];
  if(activeGenre){
    filtered = filtered.filter(m => m.genre && m.genre.toLowerCase() === activeGenre.toLowerCase());
  }
  const q = search.value.trim().toLowerCase();
  if(q){
    filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
  }
  render(filtered);
}

search.oninput = applyFilters;
genreSelect.onchange = () => {
  const val = genreSelect.value;
  activeGenre = val==="ALL"?null:val;
  applyFilters();
}

async function loadMovies(){
  try{
    const { data, error } = await supabase
      .from('movies')
      .select('*')
      .order('created_at',{ascending:false}); // newest first

    if(error){
      console.error("MOVIES FETCH ERROR:", error);
      box.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#e8c95a;padding:30px">Failed to load movies.</p>`;
      return;
    }

    if(!data || data.length===0){
      box.innerHTML="<p style=\"grid-column:1/-1;text-align:center;color:#d4af37;padding:30px\">No movies available.</p>";
      return;
    }

    MOVIES = data;
    render(MOVIES);
  }catch(err){
    console.error("MOVIES LOAD ERROR:", err);
    box.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#e8c95a;padding:30px">Failed to load movies.</p>`;
  }
}

loadMovies();
</script>

</body>
</html>
