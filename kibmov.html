/* ===== HIDE DOWNLOAD FOR YOUTUBE ===== */

function isYouTube(url){
  return /youtube\.com|youtu\.be/.test(url);
}

  downloadBtn.style.display = "none";
}


/* ===== VIDEO NORMALIZER ===== */

function getVideoUrl(url){

  if(!url) return "";

  if(url.includes("youtube.com")){

    const ytId =
      new URL(url).searchParams.get("v");

    return `https://www.youtube.com/embed/${ytId}?autoplay=1&controls=1&rel=0`;
  }


  if(url.includes("youtu.be")){

    const ytId =
      url.split("youtu.be/")[1].split("?")[0];

    return `https://www.youtube.com/embed/${ytId}?autoplay=1&controls=1&rel=0`;
  }


  if(url.includes("vimeo.com")){

    const vid =
      url.split("/").pop();

    return `https://player.vimeo.com/video/${vid}?autoplay=1`;
  }


  // ✅ Robust Google Drive preview

  if(url.includes("drive.google.com")){

    let match =
      url.match(/\/d\/(.*?)\//);

    let id =
      match
      ? match[1]
      : new URL(url).searchParams.get("id");


    if(id){

      return `https://drive.google.com/file/d/${id}/preview`;

    }

  }


  return url;

}


/* ===== GOOGLE DRIVE DOWNLOAD FIX ===== */

function getDownloadUrl(url){

  if(!url) return "";


  if(url.includes("drive.google.com")){

    let match =
      url.match(/\/d\/(.*?)\//);

    let id =
      match
      ? match[1]
      : new URL(url).searchParams.get("id");


    if(id){

      return `https://drive.google.com/uc?export=download&id=${id}`;

    }

  }


  return url;

}


/* ===== PLAY ===== */

  player.src =
    getVideoUrl(movie.video);

  player.style.display =
    "block";

  posterImg.style.display =
    "none";

  watchBtn.style.display =
    "none";

  downloadBtn.style.display =
    "none";

}


/* ===== DOWNLOAD ===== */

function downloadMovie(){

  const url =
    getDownloadUrl(movie.video);

  if(!url) return;

  window.open(url, "_blank");

}

  playMovie;

  downloadMovie;
